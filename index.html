<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXUS">
<link rel="manifest" href="manifest.json">
<title>NEXUS 2.0</title>
<style>
*{box-sizing:border-box}
:root{
 --accent:#6366f1;--bg:#0b1020;--panel:rgba(20,27,48,.82);
 --panel2:rgba(30,40,68,.78);--text:#f5f7ff;--muted:#9ca8c7;
 --border:rgba(255,255,255,.1);--radius:18px;
}
body.light{--bg:#eef2ff;--panel:rgba(255,255,255,.86);--panel2:#fff;--text:#182033;--muted:#65708a;--border:rgba(0,0,0,.09)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--text);background:var(--bg);min-height:100vh;overflow-x:hidden;transition:.3s}
body.noanim *{transition:none!important;animation:none!important}
#wallpaper{position:fixed;inset:0;z-index:-3;background:#0b1020;transition:.5s}
#overlay{position:fixed;inset:0;z-index:-2;background:rgba(4,8,20,.35);pointer-events:none}
body.light #overlay{background:rgba(255,255,255,.28)}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{position:fixed;z-index:20;left:0;top:0;bottom:0;width:250px;padding:18px 12px;background:rgba(9,14,28,.86);backdrop-filter:blur(24px);border-right:1px solid var(--border);overflow:auto}
.light .sidebar{background:rgba(255,255,255,.9)}
.logo{font-size:25px;font-weight:900;padding:8px 12px 18px;letter-spacing:2px}
.logo span{color:var(--accent)}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{background:transparent;color:#aeb9d5;text-align:left;padding:12px 13px;border-radius:12px;font-weight:700}
.nav button:hover,.nav button.active{background:var(--accent);color:white}
.main{margin-left:250px;width:calc(100% - 250px);padding:22px;max-width:1800px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.search{flex:1;max-width:600px;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:13px 17px;border-radius:14px;outline:none}
.iconbtn,.btn{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:12px;font-weight:700}
.btn.primary{background:var(--accent);color:white;border-color:transparent}
.btn.danger{background:#ef4444;color:#fff;border-color:transparent}
.btn.small{padding:7px 10px;font-size:13px}
.page{display:none}
.page.active{display:block}
h1{font-size:30px;margin:4px 0 5px}
h2{font-size:20px;margin:0 0 15px}
h3{margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:15px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;backdrop-filter:blur(20px);box-shadow:0 12px 35px rgba(0,0,0,.12)}
.col12{grid-column:span 12}.col8{grid-column:span 8}.col6{grid-column:span 6}.col4{grid-column:span 4}.col3{grid-column:span 3}
.stat{font-size:30px;font-weight:900}.muted{color:var(--muted)}
.list{display:flex;flex-direction:column;gap:9px}
.item{padding:13px;border-radius:13px;background:var(--panel2);border:1px solid var(--border)}
.itemrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.item.done{opacity:.55;text-decoration:line-through}
.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:rgba(99,102,241,.2);color:#c7cbff;font-size:12px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
input,textarea,select{width:100%;background:rgba(10,15,30,.48);color:var(--text);border:1px solid var(--border);border-radius:11px;padding:11px;outline:none}
.light input,.light textarea,.light select{background:#fff;color:#182033}
textarea{min-height:130px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:700}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.form .full{grid-column:1/-1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:100;display:none;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}
.modalbox{width:min(700px,100%);max-height:90vh;overflow:auto;background:var(--panel);backdrop-filter:blur(25px);border:1px solid var(--border);border-radius:22px;padding:20px}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:13px 17px;border-radius:13px;z-index:300;opacity:0;transform:translateY(20px);transition:.3s}
.toast.show{opacity:1;transform:translateY(0)}
.progress{height:8px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--accent)}
.kpi{font-size:12px;color:var(--muted)}
canvas{width:100%;height:220px;display:block}
.calendarhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calday{min-height:110px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:7px;font-size:12px}
.calday.today{outline:2px solid var(--accent)}
.calday.other{opacity:.4}
.eventdot{background:var(--accent);color:white;padding:3px 5px;border-radius:5px;margin-top:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.timer{font-size:70px;font-weight:900;text-align:center;letter-spacing:2px}
.timerMode{display:flex;gap:7px;justify-content:center;margin-bottom:18px}
.wallpapers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.wall{height:90px;border-radius:13px;border:2px solid transparent;cursor:pointer;position:relative;overflow:hidden}
.wall.active{border-color:white}
.wall span{position:absolute;bottom:7px;left:8px;font-size:12px;color:white;font-weight:800;text-shadow:0 2px 5px #000}
.switch{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.searchresults{margin-top:15px}
.xpbar{height:12px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#22d3ee)}
.mobileNav{display:none}
@media(max-width:900px){
.sidebar{width:220px}.main{margin-left:220px;width:calc(100% - 220px)}
.col8,.col6,.col4{grid-column:span 12}.col3{grid-column:span 6}
.wallpapers{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:650px){
.sidebar{display:none}.main{margin:0;padding:14px;width:100%;padding-bottom:80px}
.mobileNav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(10,15,30,.92);backdrop-filter:blur(20px);overflow:auto}
.mobileNav button{flex:1;min-width:65px;background:none;color:#aeb9d5;padding:10px 5px;font-size:11px}
.mobileNav button.active{color:white;background:var(--accent)}
.topbar{flex-wrap:wrap}.search{order:2;flex-basis:100%}
.form{grid-template-columns:1fr}.col3{grid-column:span 12}
.wallpapers{grid-template-columns:repeat(2,1fr)}
.calday{min-height:75px}
.timer{font-size:48px}
}
</style>
</head>
<body>
<div id="wallpaper"></div><div id="overlay"></div>

<aside class="sidebar">
 <div class="logo">NEX<span>U</span>S <small>2.0</small></div>
 <nav class="nav" id="nav"></nav>
</aside>

<main class="main">
 <div class="topbar">
  <button class="iconbtn" onclick="toggleTheme()">☀️</button>
  <input id="globalSearch" class="search" placeholder="NEXUSを検索…" oninput="globalSearch(this.value)">
  <button class="iconbtn" onclick="quickAdd()">＋</button>
 </div>

 <section id="dashboard" class="page active"></section>
 <section id="tasks" class="page"></section>
 <section id="notes" class="page"></section>
 <section id="calendar" class="page"></section>
 <section id="timer" class="page"></section>
 <section id="novels" class="page"></section>
 <section id="games" class="page"></section>
 <section id="study" class="page"></section>
 <section id="habits" class="page"></section>
 <section id="tags" class="page"></section>
 <section id="link" class="page"></section>
 <section id="database" class="page"></section>
 <section id="stats" class="page"></section>
 <section id="activity" class="page"></section>
 <section id="trash" class="page"></section>
 <section id="settings" class="page"></section>
 <section id="search" class="page"></section>
</main>

<nav class="mobileNav" id="mobileNav"></nav>

<div class="modal" id="modal"><div class="modalbox" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY="NEXUS_2_COMPLETE";
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const blank={
 tasks:[],notes:[],events:[],novels:[],games:[],studies:[],habits:[],
 links:[],tags:[],activity:[],trash:[],databases:[],
 xp:0,level:1,calendar:new Date().getFullYear()+"-"+String(new Date().getMonth()+1).padStart(2,"0"),
 settings:{
  theme:"dark",accent:"#6366f1",wallpaper:"space",density:"normal",
  animations:true,sounds:true,autoWall:false,notifications:false,
  dashboard:["welcome","tasks","calendar","timer","novels","games","study","habits","xp","activity"]
 },
 timer:{mode:"countdown",seconds:1500,running:false,last:0,targetType:"",targetId:"",pomodoro:25},
 history:{}
};
let db=JSON.parse(localStorage.getItem(KEY)||"null")||structuredClone(blank);
for(const k of Object.keys(blank))if(db[k]===undefined)db[k]=structuredClone(blank[k]);
let current="dashboard",timerHandle=null;

const NAV=[
 ["dashboard","⌂","ホーム"],["tasks","✓","タスク"],["notes","▤","ノート"],["calendar","▦","カレンダー"],
 ["timer","◷","タイマー"],["novels","✎","小説"],["games","🎮","ゲーム"],["study","📚","勉強"],
 ["habits","◉","習慣"],["tags","#","タグ"],["link","↗","NEXUS LINK"],["database","▥","データベース"],
 ["stats","⌁","統計"],["activity","↻","履歴"],["trash","♻","ゴミ箱"],["settings","⚙","設定"]
];

function save(){
 localStorage.setItem(KEY,JSON.stringify(db));
}
function log(action,type,id,title){
 db.activity.unshift({id:uid(),date:new Date().toISOString(),action,type,ref:id,title});
 db.activity=db.activity.slice(0,300);save();
}
function toast(t){
 const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");
 setTimeout(()=>x.classList.remove("show"),2200);
}
function xp(n){
 db.xp+=n;
 while(db.xp>=db.level*100){db.xp-=db.level*100;db.level++}
 save();
}
function removeToTrash(type,id){
 const arr=db[type]||[];const i=arr.findIndex(x=>x.id===id);if(i<0)return;
 db.trash.push({originalType:type,item:arr[i],deletedAt:new Date().toISOString()});
 arr.splice(i,1);log("削除",type,id,arr[i]?.title||"");save();render();
}
function restoreTrash(i){
 const x=db.trash[i];if(!x)return;
 db[x.originalType].push(x.item);db.trash.splice(i,1);save();render();toast("復元しました");
}
function permanentDelete(i){if(confirm("完全に削除しますか？")){db.trash.splice(i,1);save();render()}}
function modal(title,html,onSave){
 const m=document.getElementById("modal"),b=document.getElementById("modalBox");
 b.innerHTML=`<div class="modalhead"><h2>${title}</h2><button class="iconbtn" onclick="closeModal()">✕</button></div>${html}`;
 m.classList.add("show");
 b.querySelector("[data-save]")?.addEventListener("click",()=>{onSave(b);closeModal()});
}
function closeModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});

function renderNav(){
 const html=NAV.map(([id,ic,n])=>`<button class="${current===id?"active":""}" onclick="go('${id}')">${ic}　${n}</button>`).join("");
 document.getElementById("nav").innerHTML=html;
 document.getElementById("mobileNav").innerHTML=NAV.slice(0,8).map(([id,ic,n])=>`<button class="${current===id?"active":""}" onclick="go('${id}')">${ic}<br>${n}</button>`).join("");
}
function go(id){
 current=id;
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 document.getElementById(id)?.classList.add("active");
 renderNav();render();
 window.scrollTo({top:0,behavior:"smooth"});
}
function render(){renderNav();renderCurrent()}
function renderCurrent(){
 const fn={
 dashboard:renderDashboard,tasks:renderTasks,notes:renderNotes,calendar:renderCalendar,
 timer:renderTimer,novels:renderNovels,games:renderGames,study:renderStudy,
 habits:renderHabits,tags:renderTags,link:renderLinks,database:renderDatabase,
 stats:renderStats,activity:renderActivity,trash:renderTrash,settings:renderSettings,search:renderSearch
 }[current];if(fn)fn();
 applySettings();
}

function applySettings(){
 document.documentElement.style.setProperty("--accent",db.settings.accent);
 document.body.classList.toggle("light",db.settings.theme==="light");
 document.body.classList.toggle("noanim",!db.settings.animations);
 if(db.settings.density==="compact")document.documentElement.style.setProperty("--radius","12px");
 setWallpaper(db.settings.wallpaper);
}

const WALLPAPERS={
 space:["🌌","radial-gradient(circle at 20% 20%,#6842c7,transparent 30%),radial-gradient(circle at 80% 70%,#075985,transparent 30%),linear-gradient(135deg,#050816,#111827)"],
 galaxy:["🌠","radial-gradient(circle at 30% 40%,#ff4ecd,transparent 18%),radial-gradient(circle at 70% 20%,#6655ff,transparent 20%),radial-gradient(circle at 60% 80%,#00d4ff,transparent 20%),#090018"],
 neon:["🌃","linear-gradient(130deg,#ff006e,#3b0764 45%,#00e5ff)"],
 aurora:["🌌","radial-gradient(ellipse at 30% 80%,#00ffb3,transparent 35%),radial-gradient(ellipse at 70% 20%,#7c3aed,transparent 40%),#061426"],
 ocean:["🌊","linear-gradient(160deg,#001b3d,#006994 45%,#00c6a7)"],
 forest:["🌲","linear-gradient(140deg,#061b11,#14532d 45%,#022c22)"],
 volcano:["🌋","radial-gradient(circle at 55% 80%,#ff6b00,transparent 25%),linear-gradient(150deg,#170500,#57120a 55%,#050505)"],
 sunset:["🌅","linear-gradient(180deg,#25105c,#c0265d 45%,#ff9a3c 75%,#ffd166)"],
 sunrise:["🌄","linear-gradient(180deg,#172554,#f97316 55%,#fde68a)"],
 rain:["🌧️","linear-gradient(145deg,#111827,#334155 55%,#0f172a)"],
 snow:["❄️","linear-gradient(145deg,#dbeafe,#64748b,#e0f2fe)"],
 desert:["🏜️","linear-gradient(160deg,#451a03,#c2410c 45%,#fbbf24)"],
 night:["🌙","radial-gradient(circle at 75% 25%,#fef3c7 0 3%,transparent 4%),linear-gradient(145deg,#020617,#172554)"],
 sky:["☁️","linear-gradient(180deg,#38bdf8,#bae6fd 60%,#e0f2fe)"],
 cyber:["⚡","linear-gradient(135deg,#020617 20%,#0f172a 20% 40%,#312e81 40% 60%,#020617 60%)"],
 bluegrid:["🔷","linear-gradient(rgba(56,189,248,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.15) 1px,transparent 1px),#06111f"],
 purple:["🟣","radial-gradient(circle at 50% 40%,#a855f7,transparent 30%),linear-gradient(135deg,#16002d,#581c87,#090014)"],
 crimson:["🟥","linear-gradient(145deg,#090909,#450a0a 45%,#991b1b)"],
 minimal:["⬛","linear-gradient(135deg,#050505,#171717,#050505)"]
};
function setWallpaper(name){
 const w=document.getElementById("wallpaper"),v=WALLPAPERS[name]||WALLPAPERS.space;
 w.style.background=v[1];
}
function chooseWallpaper(name){
 db.settings.wallpaper=name;save();render();
}
function randomWallpaper(){
 const a=Object.keys(WALLPAPERS);chooseWallpaper(a[Math.floor(Math.random()*a.length)]);
}
setInterval(()=>{if(db.settings.autoWall)randomWallpaper()},86400000);

function renderDashboard(){
 const tasks=db.tasks.filter(x=>!x.done).slice(0,5);
 const todayEvents=db.events.filter(x=>x.date===today()).slice(0,5);
 const activeNovels=db.novels.slice(0,4),games=db.games.slice(0,4);
 const blocks={
 welcome:`<div class="card col12"><div class="itemrow"><div><h1>NEXUS 2.0</h1><p class="sub">君のデータをひとつにつなぐPersonal OS。</p></div><button class="btn primary" onclick="quickAdd()">＋ Quick Add</button></div><div class="xpbar"><i style="width:${Math.min(100,db.xp/(db.level*100)*100)}%"></i></div><small>LEVEL ${db.level}　XP ${db.xp}/${db.level*100}</small></div>`,
 tasks:`<div class="card col6"><div class="itemrow"><h2>✓ 今日のタスク</h2><button class="btn small" onclick="go('tasks')">すべて</button></div><div class="list">${tasks.length?tasks.map(taskHTML).join(""):"<p class='muted'>未完了タスクなし 🎉</p>"}</div></div>`,
 calendar:`<div class="card col6"><div class="itemrow"><h2>▦ 今日の予定</h2><button class="btn small" onclick="go('calendar')">カレンダー</button></div><div class="list">${todayEvents.length?todayEvents.map(e=>`<div class="item"><b>${esc(e.title)}</b><br><span class="muted">${esc(e.time||"時間未設定")}</span></div>`).join(""):"<p class='muted'>予定なし</p>"}</div></div>`,
 timer:`<div class="card col4"><h2>◷ タイマー</h2><div class="timer" style="font-size:42px">${formatTime(db.timer.seconds)}</div><button class="btn primary" onclick="go('timer')">タイマーを開く</button></div>`,
 novels:`<div class="card col4"><h2>✎ 小説</h2><div class="stat">${db.novels.length}</div><span class="muted">作品</span><br><button class="btn small" onclick="go('novels')">管理</button></div>`,
 games:`<div class="card col4"><h2>🎮 ゲーム</h2><div class="stat">${db.games.length}</div><span class="muted">登録ゲーム</span><br><button class="btn small" onclick="go('games')">管理</button></div>`,
 study:`<div class="card col6"><h2>📚 今日の勉強</h2><div class="stat">${db.studies.filter(x=>x.date===today()).reduce((a,x)=>a+Number(x.minutes||0),0)}分</div><button class="btn small" onclick="go('study')">記録する</button></div>`,
 habits:`<div class="card col6"><h2>◉ 今日の習慣</h2><div class="list">${db.habits.slice(0,5).map(h=>habitHTML(h)).join("")||"<p class='muted'>習慣を追加しよう</p>"}</div></div>`,
 xp:`<div class="card col4"><h2>⚡ NEXUS LEVEL</h2><div class="stat">Lv.${db.level}</div><div class="progress"><i style="width:${db.xp/(db.level*100)*100}%"></i></div><small>${db.xp}/${db.level*100} XP</small></div>`,
 activity:`<div class="card col8"><h2>↻ 最近のアクティビティ</h2><div class="list">${db.activity.slice(0,6).map(a=>`<div class="item"><b>${esc(a.action)}</b>　${esc(a.title||"")}<small class="muted">　${new Date(a.date).toLocaleString("ja-JP")}</small></div>`).join("")||"<p class='muted'>まだありません</p>"}</div></div>`
 };
 document.getElementById("dashboard").innerHTML=`<div class="grid">${db.settings.dashboard.map(k=>blocks[k]||"").join("")}</div>`;
}
function taskHTML(t){
 return `<div class="item ${t.done?"done":""}"><div class="itemrow"><label style="margin:0"><input type="checkbox" ${t.done?"checked":""} onchange="toggleTask('${t.id}')"> ${esc(t.title)}</label><span class="badge">${esc(t.priority||"通常")}</span></div>${t.due?`<small class="muted">期限 ${esc(t.due)}</small>`:""}</div>`;
}
function habitHTML(h){
 const done=(h.history||[]).includes(today());
 return `<div class="item itemrow"><span>${esc(h.title)}</span><button class="btn small ${done?"primary":""}" onclick="toggleHabit('${h.id}')">${done?"✓ 完了":"完了"}</button></div>`;
}

function renderTasks(){
 document.getElementById("tasks").innerHTML=`<h1>タスク</h1><p class="sub">やることを全部NEXUSへ。</p>
 <div class="actions" style="margin-bottom:15px"><button class="btn primary" onclick="taskModal()">＋ タスク追加</button></div>
 <div class="list">${db.tasks.length?db.tasks.map(taskHTML).join(""):"<div class='card'><p class='muted'>タスクはありません。</p></div>"}</div>`;
}
function taskModal(id=null){
 const t=db.tasks.find(x=>x.id===id)||{};
 modal(id?"タスク編集":"タスク追加",`<div class="form">
 <div class="full"><label>タイトル</label><input id="f_title" value="${esc(t.title)}"></div>
 <div><label>期限</label><input id="f_due" type="datetime-local" value="${esc(t.due||"")}"></div>
 <div><label>優先度</label><select id="f_priority"><option ${t.priority==="低"?"selected":""}>低</option><option ${!t.priority||t.priority==="通常"?"selected":""}>通常</option><option ${t.priority==="高"?"selected":""}>高</option><option ${t.priority==="緊急"?"selected":""}>緊急</option></select></div>
 <div class="full"><label>タグ</label><input id="f_tags" value="${esc((t.tags||[]).join(", "))}" placeholder="勉強,重要"></div>
 <div class="full"><label>サブタスク（1行1つ）</label><textarea id="f_sub">${esc((t.subtasks||[]).map(x=>x.title||x).join("\n"))}</textarea></div>
 </div><br><button class="btn primary" data-save>保存</button>`,b=>{
  const x={id:t.id||uid(),title:b.querySelector("#f_title").value.trim(),due:b.querySelector("#f_due").value,
  priority:b.querySelector("#f_priority").value,tags:b.querySelector("#f_tags").value.split(",").map(x=>x.trim()).filter(Boolean),

function renderTimer(){
 const t=db.timer;
 document.getElementById("timer").innerHTML=`<h1>タイマー</h1><p class="sub">集中時間をNEXUSに記録。</p>
 <div class="card col12"><div class="timerMode">

 <button class="btn ${t.mode==="stopwatch"?"primary":""}" onclick="timerMode('stopwatch')">ストップウォッチ</button>

 <div class="timer">${formatTime(t.seconds)}</div>
 <div class="actions" style="justify-content:center"><button class="btn primary" onclick="timerStart()">▶ ${t.running?"実行中":"開始"}</button><button class="btn" onclick="timerPause()">Ⅱ</button><button class="btn" onclick="timerReset()">↺</button></div>
 <br><div class="form"><div><label>分数</label><input id="timerMin" type="number" min="1" value="${Math.max(1,Math.round(t.seconds/60))}" onchange="timerSet(this.value)"></div>

function timerMode(m){
 db.timer.mode=m;db.timer.running=false;
 if(m==="pomodoro")db.timer.seconds=1500;
 else if(m==="countdown")db.timer.seconds=1500;
 else db.timer.seconds=0;
 save();render();
}
function timerSet(v){if(!db.timer.running)db.timer.seconds=Number(v)*60;save();render()}
function setTimerTarget(v){const [a,b]=v.split(":");db.timer.targetType=a||"";db.timer.targetId=b||"";save()}
function timerStart(){
 if(db.timer.running)return;
 db.timer.running=true;db.timer.last=Date.now();save();
 timerHandle=setInterval(()=>{
  if(!db.timer.running)return;
  const now=Date.now(),diff=Math.floor((now-db.timer.last)/1000);if(!diff)return;
  db.timer.last=now;
  if(db.timer.mode==="stopwatch")db.timer.seconds+=diff;else db.timer.seconds-=diff;
  if(db.timer.mode!=="stopwatch"&&db.timer.seconds<=0){db.timer.seconds=0;timerPause();finishTimer();return}
  save();renderTimer();
 },1000);
 renderTimer();
}
function timerPause(){db.timer.running=false;clearInterval(timerHandle);save();renderTimer()}
function timerReset(){timerPause();db.timer.seconds=db.timer.mode==="stopwatch"?0:1500;save();render()}
function finishTimer(){
 const mins=Math.max(1,Math.round(db.timer.mode==="stopwatch"?db.timer.seconds/60:25));
 db.studies.push({id:uid(),date:today(),minutes:mins,subject:"タイマー",note:"NEXUS Timer"});
 xp(Math.min(30,Math.max(5,Math.floor(mins/5))));log("タイマー完了","timer","",mins+"分");save();toast("タイマー完了！");
 if(db.settings.notifications&&"Notification"in window&&Notification.permission==="granted")new Notification("NEXUS Timer",{body:`${mins}分の集中時間が完了しました。`});
}

}
function tagModal(){modal("タグ作成",`<label>タグ名</label><input id="tag"><br><button class="btn primary" data-save>保存</button>`,b=>{const t=b.querySelector("#tag").value.trim();if(t&&!db.tags.includes(t))db.tags.push(t);save();render()})}

function allRecords(type){
 return db[type]||[];
}
function renderLinks(){
 const options=NAV.filter(x=>["tasks","notes","novels","games","study"].includes(x[0]));
 const make=(type)=>allRecords(type).map(x=>`<option value="${type}:${x.id}">${x.title||x.subject||x.name||"無題"}</option>`).join("");
 document.getElementById("link").innerHTML=`<h1>NEXUS LINK</h1><p class="sub">タスク・ノート・小説・ゲーム・勉強をつなぐ。</p>
 <div class="card"><div class="form"><div><label>元データ</label><select id="linkA"><option value="">選択</option>${options.map(x=>`<optgroup label="${x[2]}">${make(x[0])}</optgroup>`).join("")}</select></div><div><label>関連データ</label><select id="linkB"><option value="">選択</option>${options.map(x=>`<optgroup label="${x[2]}">${make(x[0])}</optgroup>`).join("")}</select></div></div><br><button class="btn primary" onclick="createLink()">🔗 リンクする</button></div>
 <div class="list" style="margin-top:15px">${db.links.map((l,i)=>`<div class="card itemrow"><span><b>${linkName(l.a)}</b>　↔　<b>${linkName(l.b)}</b></span><button class="btn small danger" onclick="db.links.splice(${i},1);save();render()">削除</button></div>`).join("")||"<div class='card'>リンクはありません。</div>"}</div>`;
}
function linkName(v){if(!v)return"-";const [t,id]=v.split(":");const x=db[t]?.find(x=>x.id===id);return esc(x?.title||x?.subject||"不明")}
function createLink(){const a=document.getElementById("linkA").value,b=document.getElementById("linkB").value;if(!a||!b)return;db.links.push({id:uid(),a,b});save();render();}

function renderDatabase(){
 document.getElementById("database").innerHTML=`<h1>データベース</h1><p class="sub">NEXUSに好きなデータ管理表を作る。</p><button class="btn primary" onclick="dbModal()">＋ データベース作成</button><div class="grid" style="margin-top:15px">${db.databases.map(d=>`<div class="card col6"><div class="itemrow"><h2>▥ ${esc(d.name)}</h2><button class="btn small" onclick="recordModal('${d.id}')">＋記録</button></div><p class="muted">${(d.fields||[]).length}フィールド / ${(d.records||[]).length}件</p>${(d.records||[]).slice(-5).reverse().map(r=>`<div class="item">${Object.values(r).map(v=>`<span class="badge">${esc(v)}</span> `).join("")}</div>`).join("")}</div>`).join("")||"<div class='card col12'>カスタムデータベースを作成しよう。</div>"}</div>`;
}
function dbModal(){
 modal("データベース作成",`<label>名前</label><input id="dbn" placeholder="読書記録"><br><label>フィールド（カンマ区切り）</label><input id="dbf" placeholder="タイトル,著者,評価,日付"><br><button class="btn primary" data-save>作成</button>`,b=>{
  const d={id:uid(),name:b.querySelector("#dbn").value,fields:b.querySelector("#dbf").value.split(",").map(x=>x.trim()).filter(Boolean),records:[]};if(!d.name)return;db.databases.push(d);save();render();
 });
}
function recordModal(id){
 const d=db.databases.find(x=>x.id===id);if(!d)return;
 modal("データ追加",d.fields.map((f,i)=>`<label>${esc(f)}</label><input id="df${i}">`).join("")+`<br><button class="btn primary" data-save>保存</button>`,b=>{
  const r={};d.fields.forEach((f,i)=>r[f]=b.querySelector("#df"+i).value);d.records.push(r);save();render();
 });
}

function renderStats(){
 const completed=db.tasks.filter(x=>x.done).length,focus=db.studies.reduce((a,x)=>a+Number(x.minutes||0),0),game=db.games.reduce((a,x)=>a+Number(x.minutes||0),0),pv=db.novels.reduce((a,x)=>a+Number(x.pv||0),0);
 document.getElementById("stats").innerHTML=`<h1>統計</h1><p class="sub">NEXUSに蓄積されたデータ。</p><div class="grid">
 <div class="card col3"><div class="stat">${completed}</div><span class="muted">完了タスク</span></div><div class="card col3"><div class="stat">${focus}</div><span class="muted">勉強分</span></div><div class="card col3"><div class="stat">${game}</div><span class="muted">ゲーム分</span></div><div class="card col3"><div class="stat">${pv}</div><span class="muted">小説PV</span></div>
 <div class="card col6"><h2>データ数</h2><p>タスク　${db.tasks.length}</p><p>ノート　${db.notes.length}</p><p>予定　${db.events.length}</p><p>小説　${db.novels.length}</p><p>ゲーム　${db.games.length}</p></div>
 <div class="card col6"><h2>レベル</h2><div class="stat">Lv.${db.level}</div><div class="xpbar"><i style="width:${db.xp/(db.level*100)*100}%"></i></div><p>${db.xp}/${db.level*100} XP</p></div>
 </div>`;
}

function renderActivity(){
 document.getElementById("activity").innerHTML=`<h1>アクティビティ</h1><p class="sub">NEXUSで何をしたかを記録。</p><div class="list">${db.activity.map(a=>`<div class="card itemrow"><span><b>${esc(a.action)}</b>　${esc(a.title||"")}</span><small class="muted">${new Date(a.date).toLocaleString("ja-JP")}</small></div>`).join("")||"<div class='card'>履歴はありません。</div>"}</div>`;
}

function renderTrash(){
 document.getElementById("trash").innerHTML=`<h1>ゴミ箱</h1><p class="sub">削除したデータを復元できます。</p><div class="list">${db.trash.map((x,i)=>`<div class="card itemrow"><span><b>${esc(x.item.title||"無題")}</b><br><small>${esc(x.originalType)} / ${new Date(x.deletedAt).toLocaleString("ja-JP")}</small></span><div class="actions"><button class="btn small" onclick="restoreTrash(${i})">復元</button><button class="btn small danger" onclick="permanentDelete(${i})">完全削除</button></div></div>`).join("")||"<div class='card'>ゴミ箱は空です。</div>"}</div>`;
}

function renderSettings(){
 document.getElementById("settings").innerHTML=`<h1>設定</h1><p class="sub">NEXUSを自分仕様に。</p>
 <div class="grid">
 <div class="card col6"><h2>🎨 外観</h2>
 <div class="switch"><span>ライトモード</span><button class="btn small" onclick="setSetting('theme',db.settings.theme==='dark'?'light':'dark')">${db.settings.theme==="dark"?"OFF":"ON"}</button></div>
 <label style="margin-top:15px">アクセントカラー</label><input type="color" value="${db.settings.accent}" onchange="setSetting('accent',this.value)">
 <label style="margin-top:15px">カード密度</label><select onchange="setSetting('density',this.value)"><option value="normal" ${db.settings.density==="normal"?"selected":""}>通常</option><option value="compact" ${db.settings.density==="compact"?"selected":""}>コンパクト</option></select>
 <div class="switch"><span>アニメーション</span><button class="btn small" onclick="setSetting('animations',!db.settings.animations)">${db.settings.animations?"ON":"OFF"}</button></div>
 <div class="switch"><span>毎日壁紙変更</span><button class="btn small" onclick="setSetting('autoWall',!db.settings.autoWall)">${db.settings.autoWall?"ON":"OFF"}</button></div>
 </div>
 <div class="card col6"><h2>🖼️ 壁紙</h2><div class="wallpapers">${Object.entries(WALLPAPERS).map(([k,v])=>`<div class="wall ${db.settings.wallpaper===k?"active":""}" style="background:${v[1]}" onclick="chooseWallpaper('${k}')"><span>${v[0]} ${k}</span></div>`).join("")}</div><br><button class="btn" onclick="randomWallpaper()">🎲 ランダム</button></div>
 <div class="card col6"><h2>🔔 通知</h2><p class="muted">対応ブラウザでNEXUSの通知を許可します。</p><button class="btn primary" onclick="enableNotifications()">通知を許可</button><p>${db.settings.notifications?"現在ON":"現在OFF"}</p></div>
 <div class="card col6"><h2>🏠 ホーム画面</h2><p class="muted">表示するカードの順番を設定。</p>${["welcome","tasks","calendar","timer","novels","games","study","habits","xp","activity"].map(k=>`<div class="switch"><span>${k}</span><input type="checkbox" ${db.settings.dashboard.includes(k)?"checked":""} onchange="toggleDashboard('${k}',this.checked)" style="width:auto"></div>`).join("")}</div>
 <div class="card col6"><h2>💾 データ</h2><div class="actions"><button class="btn primary" onclick="exportData()">バックアップ</button><button class="btn" onclick="document.getElementById('importFile').click()">復元</button><input id="importFile" type="file" accept=".json" hidden onchange="importData(this)"></div><br><button class="btn danger" onclick="resetData()">全データ初期化</button></div>
 </div>`;
}
function setSetting(k,v){db.settings[k]=v;save();render()}
function toggleDashboard(k,on){if(on&&!db.settings.dashboard.includes(k))db.settings.dashboard.push(k);if(!on)db.settings.dashboard=db.settings.dashboard.filter(x=>x!==k);save();render()}
async function enableNotifications(){
 if(!("Notification"in window)){toast("このブラウザは通知に対応していません");return}
 const p=await Notification.requestPermission();db.settings.notifications=p==="granted";save();render();toast(p==="granted"?"通知を許可しました":"通知は許可されませんでした");
}
function exportData(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="NEXUS-backup-"+today()+".json";a.click();URL.revokeObjectURL(a.href);
}
function importData(input){
 const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render();toast("復元しました")}catch{toast("ファイルが正しくありません")}};r.readAsText(f);
}
function resetData(){if(confirm("本当に全データを削除しますか？")){localStorage.removeItem(KEY);location.reload()}}

function globalSearch(q){
 if(!q.trim()){if(current==="search")go("dashboard");return}
 current="search";document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById("search").classList.add("active");renderNav();
 const result=[];
 [["tasks","タスク"],["notes","ノート"],["events","予定"],["novels","小説"],["games","ゲーム"],["habits","習慣"]].forEach(([type,label])=>{
  (db[type]||[]).forEach(x=>{const s=JSON.stringify(x).toLowerCase();if(s.includes(q.toLowerCase()))result.push({type,label,x})})
 });
 document.getElementById("search").innerHTML=`<h1>検索結果</h1><p class="sub">「${esc(q)}」</p><div class="list">${result.map(r=>`<div class="card itemrow"><span><span class="badge">${r.label}</span> <b>${esc(r.x.title||r.x.name||"")}</b></span><button class="btn small" onclick="go('${r.type}')">開く</button></div>`).join("")||"<div class='card'>見つかりませんでした。</div>"}</div>`;
}
function renderSearch(){}

function quickAdd(){
 modal("Quick Add",`<div class="actions"><button class="btn primary" onclick="closeModal();taskModal()">✓ タスク</button><button class="btn" onclick="closeModal();noteModal()">▤ ノート</button><button class="btn" onclick="closeModal();eventModal()">▦ 予定</button><button class="btn" onclick="closeModal();novelModal()">✎ 小説</button><button class="btn" onclick="closeModal();gameModal()">🎮 ゲーム</button><button class="btn" onclick="closeModal();studyModal()">📚 勉強</button><button class="btn" onclick="closeModal();habitModal()">◉ 習慣</button></div>`);
}

function init(){
 render();
 if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
init();
</script>
</body>
</html>
