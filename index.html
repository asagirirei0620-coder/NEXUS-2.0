<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6366f1">
<link rel="manifest" href="manifest.json">
<title>NEXUS 2.0 MAX</title>

<style>
:root{
  --bg:#f4f6fb;--panel:#fff;--text:#172033;--sub:#6b7280;
  --line:#e5e7eb;--accent:#6366f1;--accent2:#8b5cf6;
  --danger:#ef4444;--ok:#10b981;--shadow:0 8px 25px #0001
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body.dark{--bg:#0b1020;--panel:#121a2b;--text:#f3f4f6;--sub:#9ca3af;--line:#263249;--shadow:0 8px 25px #0005}
button,input,textarea,select{font:inherit}
button{border:0;border-radius:10px;padding:9px 13px;background:var(--accent);color:#fff;cursor:pointer}
button:hover{opacity:.85}
.ghost{background:transparent!important;color:var(--text)!important;border:1px solid var(--line)}
.danger{background:var(--danger)}
.ok{background:var(--ok)}
input,textarea,select{
 width:100%;padding:10px;border:1px solid var(--line);
 border-radius:10px;background:var(--panel);color:var(--text)
}
textarea{min-height:120px;resize:vertical}
.app{display:flex;min-height:100vh}
.sidebar{
 width:245px;position:fixed;inset:0 auto 0 0;background:var(--panel);
 border-right:1px solid var(--line);padding:18px;overflow:auto;z-index:50
}
.logo{font-size:25px;font-weight:900;letter-spacing:4px;margin-bottom:20px}
.logo small{display:block;font-size:8px;color:var(--sub);letter-spacing:2px}
.nav{display:grid;gap:5px}
.nav button{
 background:transparent;color:var(--text);text-align:left;width:100%
}
.nav button.active{background:#6366f11c;color:var(--accent);font-weight:700}
.main{margin-left:245px;width:calc(100% - 245px);padding:22px;max-width:1800px}
.top{display:flex;gap:10px;margin-bottom:20px}
.search{flex:1}
h1{margin:0;font-size:30px}
h2{font-size:21px;margin:0 0 13px}
h3{margin:0 0 8px}
.sub{color:var(--sub)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{
 background:var(--panel);border:1px solid var(--line);
 border-radius:18px;padding:16px;box-shadow:var(--shadow)
}
.stat{font-size:29px;font-weight:800}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.list{display:grid;gap:8px}
.item{padding:12px;border:1px solid var(--line);border-radius:12px}
.done{opacity:.55;text-decoration:line-through}
.badge{
 display:inline-block;padding:3px 8px;border-radius:99px;
 background:#6366f11c;color:var(--accent);font-size:11px;margin:2px
}
.progress{height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.empty{text-align:center;padding:30px;color:var(--sub)}
.modal{
 position:fixed;inset:0;background:#0008;display:none;
 align-items:center;justify-content:center;padding:18px;z-index:100
}
.modal.show{display:flex}
.modalbox{
 background:var(--panel);width:min(720px,100%);max-height:90vh;
 overflow:auto;border-radius:20px;padding:20px
}
.form{display:grid;gap:12px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.weekday{text-align:center;color:var(--sub);font-size:12px;padding:7px}
.day{
 min-height:90px;border:1px solid var(--line);border-radius:10px;
 padding:7px;cursor:pointer;background:var(--panel)
}
.day:hover{border-color:var(--accent)}
.today{outline:2px solid var(--accent)}
.event{
 margin-top:4px;padding:3px 5px;border-radius:5px;
 background:#6366f11c;color:var(--accent);font-size:10px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.timer{font-size:65px;font-weight:900;text-align:center}
.chart{
 height:180px;display:flex;align-items:end;gap:5px;
 border:1px solid var(--line);border-radius:14px;padding:12px
}
.bar{flex:1;background:var(--accent);border-radius:5px 5px 0 0;min-width:4px}
.mobile{display:none}
.toast{
 position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;
 padding:12px 16px;border-radius:12px;opacity:0;transition:.2s;z-index:200
}
.toast.show{opacity:1}
@media(max-width:900px){
 .sidebar{transform:translateX(-100%);transition:.2s}
 .sidebar.open{transform:none}
 .main{margin-left:0;width:100%;padding:14px}
 .mobile{display:block}
 .g3,.g2{grid-template-columns:1fr}
 .g4{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">
  <div class="logo">
    NEXUS
    <small>PERSONAL OPERATING SYSTEM</small>
  </div>
  <div class="nav" id="nav"></div>
</aside>

<main class="main">

<div class="top">
  <button class="ghost mobile" onclick="toggleMenu()">☰</button>
  <input class="search" id="search" placeholder="NEXUS全体を検索…">
  <button class="ghost" onclick="quickAdd()">＋</button>
  <button class="ghost" onclick="toggleDark()">◐</button>
</div>

<div id="page"></div>

</main>
</div>

<div class="modal" id="modal">
  <div class="modalbox" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<script>

const KEY="NEXUS_2_MAX";

const defaults={
 tasks:[],
 notes:[],
 events:[],
 novels:[],
 episodes:[],
 games:[],
 studies:[],
 habits:[],
 links:[],
 tags:[],
 activity:[],
 timerSessions:[],
 xp:0,
 settings:{dark:false,sound:true},
 calendar:new Date().getMonth(),
 calendarYear:new Date().getFullYear()
};

let db=load();

function load(){
 try{
   return {...defaults,...JSON.parse(localStorage.getItem(KEY)||"{}")};
 }catch{
   return {...defaults};
 }
}

function save(){
 localStorage.setItem(KEY,JSON.stringify(db));
}

function uid(){
 return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function esc(s=""){
 return String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function toast(t){
 const x=document.getElementById("toast");
 x.textContent=t;
 x.classList.add("show");
 setTimeout(()=>x.classList.remove("show"),1800);
}

function log(text){
 db.activity.unshift({
   id:uid(),text,date:new Date().toISOString()
 });
 db.activity=db.activity.slice(0,300);
 save();
}

function addXP(n){
 db.xp=Math.max(0,db.xp+n);
 save();
}

function level(){
 return Math.floor(db.xp/100)+1;
}

function levelProgress(){
 return db.xp%100;
}

function toggleDark(){
 db.settings.dark=!db.settings.dark;
 save();
 applyTheme();
}

function applyTheme(){
 document.body.classList.toggle("dark",db.settings.dark);
}

function toggleMenu(){
 document.getElementById("sidebar").classList.toggle("open");
}

const NAV=[
 ["dashboard","⌂","Dashboard"],
 ["tasks","✓","Tasks"],
 ["notes","▤","Notes"],
 ["calendar","▦","Calendar"],
 ["timer","◷","Timer"],
 ["novels","✎","Novels"],
 ["games","🎮","Games"],
 ["study","📚","Study"],
 ["habits","🔥","Habits"],
 ["tags","🏷","Tags"],
 ["link","🔗","NEXUS LINK"],
 ["stats","◈","Stats"],
 ["activity","◌","Activity"],
 ["settings","⚙","Settings"]
];

let current="dashboard";
let taskMode="all";

function renderNav(){
 document.getElementById("nav").innerHTML=
 NAV.map(n=>`
 <button class="${current===n[0]?"active":""}"
 onclick="go('${n[0]}')">
 ${n[1]}　${n[2]}
 </button>`).join("");
}

function go(p){
 current=p;
 renderNav();
 render();
 document.getElementById("sidebar").classList.remove("open");
 window.scrollTo(0,0);
}

function render(){
 document.getElementById("page").innerHTML=pages[current]();
 updateTimerDisplay();
}

function modal(title,html){
 document.getElementById("modalBox").innerHTML=`
 <div class="row">
   <h2>${title}</h2>
   <button class="ghost" onclick="closeModal()">✕</button>
 </div>
 ${html}`;
 document.getElementById("modal").classList.add("show");
}

function closeModal(){
 document.getElementById("modal").classList.remove("show");
}

document.getElementById("modal").onclick=e=>{
 if(e.target.id==="modal")closeModal();
};

document.getElementById("search").oninput=e=>{
 if(e.target.value.trim())go("search");
};

function tagsHTML(tags=[]){
 return tags.map(t=>`<span class="badge">#${esc(t)}</span>`).join("");
}

function tagsArray(v){
 return String(v||"").split(",").map(x=>x.trim()).filter(Boolean);
}

function today(){
 return new Date().toISOString().slice(0,10);
}

function dateJP(x){
 return x?new Date(x).toLocaleDateString("ja-JP"):"";
}


/* QUICK ADD */

function quickAdd(){
 modal("Quick Add",`
 <div class="grid g3">
 <button onclick="openTask()">✓ Task</button>
 <button onclick="openNote()">▤ Note</button>
 <button onclick="openEvent()">▦ Event</button>
 <button onclick="openNovel()">✎ Novel</button>
 <button onclick="openGame()">🎮 Game</button>
 <button onclick="openStudy()">📚 Study</button>
 </div>`);
}


/* TASK */

function openTask(id=""){
 const x=db.tasks.find(a=>a.id===id)||{};
 modal(id?"Task編集":"Task追加",`
 <div class="form">
 <div><label>タイトル</label>
 <input id="taskTitle" value="${esc(x.title)}"></div>

 <div class="grid g2">
 <div><label>期限</label>
 <input id="taskDue" type="date" value="${x.due||""}"></div>

 <div><label>優先度</label>
 <select id="taskPriority">
 <option ${x.priority==="低"?"selected":""}>低</option>
 <option ${x.priority==="中"||!x.priority?"selected":""}>中</option>
 <option ${x.priority==="高"?"selected":""}>高</option>
 </select></div>
 </div>

 <div><label>タグ</label>
 <input id="taskTags" value="${esc((x.tags||[]).join(","))}" placeholder="勉強,重要"></div>

 <div><label>メモ</label>
 <textarea id="taskMemo">${esc(x.memo||"")}</textarea></div>

 <button onclick="saveTask('${id}')">保存</button>
 </div>`);
}

function saveTask(id){
 const title=document.getElementById("taskTitle").value.trim();
 if(!title)return toast("タイトルを入力してね");

 let x=id?db.tasks.find(a=>a.id===id):{
   id:uid(),done:false,created:new Date().toISOString()
 };

 Object.assign(x,{
   title,
   due:document.getElementById("taskDue").value,
   priority:document.getElementById("taskPriority").value,
   tags:tagsArray(document.getElementById("taskTags").value),
   memo:document.getElementById("taskMemo").value
 });

 if(!id)db.tasks.unshift(x);

 save();
 log(`Task保存：${title}`);
 closeModal();
 render();
}

function toggleTask(id){
 const x=db.tasks.find(a=>a.id===id);
 x.done=!x.done;
 addXP(x.done?10:-10);
 log(`${x.done?"Task完了":"Taskを未完了へ"}：${x.title}`);
 save();
 render();
}

function deleteTask(id){
 if(!confirm("削除する？"))return;
 db.tasks=db.tasks.filter(x=>x.id!==id);
 save();
 render();
}

function taskHTML(x){
 return `
 <div class="item ${x.done?"done":""}">
 <div class="row">
 <div>
 <div><b>${esc(x.title)}</b></div>
 ${tagsHTML(x.tags)}
 <div class="sub">${x.due?"期限："+x.due:""}　優先度：${x.priority}</div>
 </div>
 <div class="actions">
 <button onclick="toggleTask('${x.id}')">${x.done?"戻す":"完了"}</button>
 <button class="ghost" onclick="openTask('${x.id}')">編集</button>
 <button class="danger" onclick="deleteTask('${x.id}')">削除</button>
 </div>
 </div>
 </div>`;
}


/* NOTES */

function openNote(id=""){
 const x=db.notes.find(a=>a.id===id)||{};
 modal(id?"Note編集":"Note追加",`
 <div class="form">
 <div><label>タイトル</label>
 <input id="noteTitle" value="${esc(x.title)}"></div>

 <div><label>タグ</label>
 <input id="noteTags" value="${esc((x.tags||[]).join(","))}"></div>

 <div><label>本文</label>
 <textarea id="noteBody" style="min-height:250px">${esc(x.body||"")}</textarea></div>

 <button onclick="saveNote('${id}')">保存</button>
 </div>`);
}

function saveNote(id){
 const title=document.getElementById("noteTitle").value.trim()||"無題";

 let x=id?db.notes.find(a=>a.id===id):{
   id:uid(),created:new Date().toISOString()
 };

 Object.assign(x,{
   title,
   tags:tagsArray(document.getElementById("noteTags").value),
   body:document.getElementById("noteBody").value,
   updated:new Date().toISOString()
 });

 if(!id)db.notes.unshift(x);

 save();
 log(`Note保存：${title}`);
 closeModal();
 render();
}

function deleteNote(id){
 db.notes=db.notes.filter(x=>x.id!==id);
 save();
 render();
}


/* CALENDAR */

function changeMonth(n){
 db.calendarMonth=(db.calendarMonth??new Date().getMonth())+n;
 if(db.calendarMonth>11){
   db.calendarMonth=0;
   db.calendarYear++;
 }
 if(db.calendarMonth<0){
   db.calendarMonth=11;
   db.calendarYear--;
 }
 save();
 render();
}

function openEvent(id="",date=""){
 const x=db.events.find(a=>a.id===id)||{};

 modal(id?"予定編集":"予定追加",`
 <div class="form">
 <div><label>タイトル</label>
 <input id="eventTitle" value="${esc(x.title)}"></div>

 <div class="grid g2">
 <div><label>日付</label>
 <input id="eventDate" type="date" value="${x.date||date}"></div>

 <div><label>時刻</label>
 <input id="eventTime" type="time" value="${x.time||""}"></div>
 </div>

 <div class="grid g2">
 <div><label>カテゴリ</label>
 <input id="eventCategory" value="${esc(x.category||"")}" placeholder="学校"></div>

 <div><label>繰り返し</label>
 <select id="eventRepeat">
 <option value="">なし</option>
 <option value="daily">毎日</option>
 <option value="weekly">毎週</option>
 <option value="monthly">毎月</option>
 </select>
 </div>
 </div>

 <textarea id="eventDetail">${esc(x.detail||"")}</textarea>

 <button onclick="saveEvent('${id}')">保存</button>
 </div>`);

 if(x.repeat)document.getElementById("eventRepeat").value=x.repeat;
}

function saveEvent(id){
 const title=document.getElementById("eventTitle").value.trim();
 if(!title)return;

 let x=id?db.events.find(a=>a.id===id):{id:uid()};

 Object.assign(x,{
   title,
   date:document.getElementById("eventDate").value,
   time:document.getElementById("eventTime").value,
   category:document.getElementById("eventCategory").value,
   repeat:document.getElementById("eventRepeat").value,
   detail:document.getElementById("eventDetail").value
 });

 if(!id)db.events.push(x);

 save();
 log(`予定保存：${title}`);
 closeModal();
 render();
}

function deleteEvent(id){
 db.events=db.events.filter(x=>x.id!==id);
 save();
 render();
}

function calendarHTML(){
 const y=db.calendarYear??new Date().getFullYear();
 const m=db.calendarMonth??new Date().getMonth();
 const first=new Date(y,m,1);
 const last=new Date(y,m+1,0);

 let html=["日","月","火","水","木","金","土"]
 .map(x=>`<div class="weekday">${x}</div>`).join("");

 for(let i=0;i<first.getDay();i++)html+=`<div></div>`;

 for(let d=1;d<=last.getDate();d++){
   const date=new Date(y,m,d);
   const key=date.toISOString().slice(0,10);
   const ev=db.events.filter(x=>x.date===key);

   html+=`
   <div class="day ${key===today()?"today":""}"
        onclick="openEvent('','${key}')">
   <b>${d}</b>
   ${ev.slice(0,3).map(e=>`<div class="event">${esc(e.title)}</div>`).join("")}
   </div>`;
 }
 return html;
}


/* TIMER */

let timerSeconds=1500;
let timerRunning=false;
let timerInterval=null;
let timerMode="countdown";

function startTimer(){
 if(timerRunning)return;
 timerRunning=true;

 timerInterval=setInterval(()=>{
   if(timerMode==="countdown"){
     if(timerSeconds<=0){
       finishTimer();
       return;
     }
     timerSeconds--;
   }else{
     timerSeconds++;
   }
   updateTimerDisplay();
 },1000);
}

function pauseTimer(){
 timerRunning=false;
 clearInterval(timerInterval);
}

function resetTimer(){
 pauseTimer();
 timerSeconds=timerMode==="countdown"?1500:0;
 updateTimerDisplay();
}

function setTimer(min){
 timerMode="countdown";
 timerSeconds=min*60;
 updateTimerDisplay();
}

function stopwatch(){
 timerMode="stopwatch";
 timerSeconds=0;
 updateTimerDisplay();
}

function finishTimer(){
 pauseTimer();

 const mins=Math.max(1,Math.floor(timerSeconds/60));

 db.timerSessions.unshift({
   id:uid(),
   minutes:mins,
   date:new Date().toISOString()
 });

 addXP(Math.min(25,mins));
 log(`タイマー完了：${mins}分`);

 if(db.settings.sound){
   try{
     const a=new AudioContext();
     const o=a.createOscillator();
     const g=a.createGain();
     o.connect(g);g.connect(a.destination);
     o.frequency.value=880;
     g.gain.value=.08;
     o.start();
     o.stop(a.currentTime+.25);
   }catch{}
 }

 toast("タイマー完了！");
 render();
}

function updateTimerDisplay(){
 const el=document.getElementById("timerDisplay");
 if(!el)return;

 const m=Math.floor(timerSeconds/60);
 const s=timerSeconds%60;

 el.textContent=
 `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}


/* NOVELS */

function openNovel(id=""){
 const x=db.novels.find(a=>a.id===id)||{};

 modal(id?"作品編集":"作品追加",`
 <div class="form">
 <div><label>作品名</label>
 <input id="novelTitle" value="${esc(x.title)}"></div>

 <div class="grid g2">
 <div><label>ジャンル</label>
 <input id="novelGenre" value="${esc(x.genre||"")}"></div>

 <div><label>状態</label>
 <select id="novelStatus">
 <option>構想</option><option>執筆中</option><option>完結</option><option>休止</option>
 </select></div>
 </div>

 <div class="grid g2">
 <div><label>総文字数</label>
 <input id="novelWords" type="number" value="${x.words||0}"></div>

 <div><label>累計PV</label>
 <input id="novelPV" type="number" value="${x.pv||0}"></div>
 </div>

 <div><label>投稿先</label>
 <input id="novelPlatform" value="${esc(x.platform||"")}"></div>

 <textarea id="novelMemo">${esc(x.memo||"")}</textarea>

 <button onclick="saveNovel('${id}')">保存</button>
 </div>`);

 if(x.status)document.getElementById("novelStatus").value=x.status;
}

function saveNovel(id){
 const title=document.getElementById("novelTitle").value.trim();
 if(!title)return;

 let x=id?db.novels.find(a=>a.id===id):{
   id:uid(),created:new Date().toISOString(),pvHistory:[]
 };

 Object.assign(x,{
   title,
   genre:document.getElementById("novelGenre").value,
   status:document.getElementById("novelStatus").value,
   words:+document.getElementById("novelWords").value||0,
   pv:+document.getElementById("novelPV").value||0,
   platform:document.getElementById("novelPlatform").value,
   memo:document.getElementById("novelMemo").value
 });

 if(!id)db.novels.push(x);

 save();
 log(`作品保存：${title}`);
 closeModal();
 render();
}

function novelMetric(id,type){
 const x=db.novels.find(a=>a.id===id);
 const value=+prompt(type==="pv"?"追加PV":"追加文字数","0");
 if(!value)return;

 if(type==="pv"){
   x.pv=(x.pv||0)+value;
   x.pvHistory=x.pvHistory||[];
   x.pvHistory.push({
     date:today(),
     value
   });
 }else{
   x.words=(x.words||0)+value;
 }

 addXP(type==="pv"?Math.min(10,Math.floor(value/10)):Math.min(20,Math.floor(value/500)));
 save();
 render();
}

function deleteNovel(id){
 db.novels=db.novels.filter(x=>x.id!==id);
 db.episodes=db.episodes.filter(x=>x.novelId!==id);
 save();
 render();
}

function openEpisode(novelId,id=""){
 const x=db.episodes.find(a=>a.id===id)||{};

 modal(id?"エピソード編集":"エピソード追加",`
 <div class="form">
 <input id="epNo" placeholder="第1話" value="${esc(x.no||"")}">
 <input id="epTitle" placeholder="タイトル" value="${esc(x.title||"")}">
 <input id="epWords" type="number" placeholder="文字数" value="${x.words||0}">
 <input id="epPV" type="number" placeholder="PV" value="${x.pv||0}">
 <select id="epStatus">
 <option>未投稿</option><option>下書き</option><option>投稿済み</option>
 </select>
 <textarea id="epMemo">${esc(x.memo||"")}</textarea>
 <button onclick="saveEpisode('${novelId}','${id}')">保存</button>
 </div>`);

 if(x.status)document.getElementById("epStatus").value=x.status;
}

function saveEpisode(novelId,id){
 let x=id?db.episodes.find(a=>a.id===id):{id:uid(),novelId};

 Object.assign(x,{
   novelId,
   no:document.getElementById("epNo").value,
   title:document.getElementById("epTitle").value,
   words:+document.getElementById("epWords").value||0,
   pv:+document.getElementById("epPV").value||0,
   status:document.getElementById("epStatus").value,
   memo:document.getElementById("epMemo").value
 });

 if(!id)db.episodes.push(x);

 save();
 closeModal();
 render();
}

function deleteEpisode(id){
 db.episodes=db.episodes.filter(x=>x.id!==id);
 save();
 render();
}


/* GAMES */

function openGame(id=""){
 const x=db.games.find(a=>a.id===id)||{};

 modal(id?"ゲーム編集":"ゲーム追加",`
 <div class="form">
 <input id="gameTitle" placeholder="ゲーム名" value="${esc(x.title||"")}">

 <input id="gameLevel" type="number" placeholder="Lv" value="${x.level||1}">
 </div>

 <div class="grid g2">
 <input id="gameScore" type="number" placeholder="スコア" value="${x.score||0}">
 <input id="gameMinutes" type="number" placeholder="プレイ時間" value="${x.minutes||0}">
 </div>

 <textarea id="gameMemo">${esc(x.memo||"")}</textarea>
 <button onclick="saveGame('${id}')">保存</button>
 </div>`);
}

function saveGame(id){
 const title=document.getElementById("gameTitle").value.trim();
 if(!title)return;

 let x=id?db.games.find(a=>a.id===id):{
   id:uid(),history:[]
 };

 Object.assign(x,{
   title,
   goal:document.getElementById("gameGoal").value,
   level:+document.getElementById("gameLevel").value||1,
   score:+document.getElementById("gameScore").value||0,
   minutes:+document.getElementById("gameMinutes").value||0,
   memo:document.getElementById("gameMemo").value
 });

 if(!id)db.games.push(x);

 save();
 log(`ゲーム保存：${title}`);
 closeModal();
 render();
}

function addGameTime(id){
 const x=db.games.find(a=>a.id===id);
 const n=+prompt("追加プレイ時間（分）","30");
 if(!n)return;

 x.minutes=(x.minutes||0)+n;
 x.history=x.history||[];
 x.history.push({date:today(),minutes:n});

 addXP(Math.min(15,Math.floor(n/10)));
 save();
 render();
}

function deleteGame(id){
 db.games=db.games.filter(x=>x.id!==id);
 save();
 render();
}

function saveHabit(){
 const name=document.getElementById("habitName").value.trim();
 if(!name)return;

 db.habits.push({
   id:uid(),name,streak:0,last:""
 });

 save();
 closeModal();
 render();
}

function completeHabit(id){
 const x=db.habits.find(a=>a.id===id);

 if(x.last===today())return toast("今日は達成済み");

 const d=new Date();
 d.setDate(d.getDate()-1);

 const yesterday=d.toISOString().slice(0,10);

 x.streak=x.last===yesterday?x.streak+1:1;
 x.last=today();

 addXP(5);
 log(`習慣達成：${x.name}`);
 save();
 render();
}

function deleteHabit(id){
 db.habits=db.habits.filter(x=>x.id!==id);
 save();
 render();
}

function saveTag(){
 const t=document.getElementById("tagName").value.trim().replace("#","");
 if(!t)return;
 if(!db.tags.includes(t))db.tags.push(t);
 save();
 closeModal();
 render();
}

function tagCounts(){
 const c={};
 db.tags.forEach(t=>c[t]=0);

 [...db.tasks,...db.notes].forEach(x=>{
   (x.tags||[]).forEach(t=>{
     c[t]=(c[t]||0)+1;
   });
 });

 return c;
}

function linkName(x){

   Task:db.tasks,
   Note:db.notes,
   Novel:db.novels,
   Game:db.games,

 };

 const y=(maps[x.type]||[]).find(a=>a.id===x.target);

<h1>Settings</h1>
<p class="sub">NEXUSの設定・バックアップ。</p>

<div class="grid g2">

<div class="card">
 <h2>Appearance</h2>
 <button onclick="toggleDark()">
 ${db.settings.dark?"☀ Light":"🌙 Dark"}
 </button>
</div>

<div class="card">
 <h2>Sound</h2>
 <button onclick="
 db.settings.sound=!db.settings.sound;
 save();render()">
 ${db.settings.sound?"🔊 ON":"🔇 OFF"}
 </button>
</div>

</div>

<br>

<div class="card">
 <h2>Backup</h2>
 <div class="actions">
  <button onclick="backup()">JSONを書き出す</button>
  <label class="ghost" style="padding:9px 13px;border-radius:10px;cursor:pointer">
   JSONを復元
   <input type="file" accept=".json" hidden onchange="restore(this)">
  </label>
 </div>
</div>

<br>

<div class="card">
 <h2>Data</h2>
 <p class="sub">現在の保存データ：${JSON.stringify(db).length.toLocaleString()} bytes</p>
 <button class="danger" onclick="
 if(confirm('全データを削除する？')){
  localStorage.removeItem(KEY);
  location.reload();
 }">
 全データ削除
 </button>
</div>
`,

search:()=>{

 const q=document.getElementById("search").value.toLowerCase();

 const results=[
  ...db.tasks.map(x=>({...x,_type:"Task"})),
  ...db.notes.map(x=>({...x,_type:"Note"})),
  ...db.novels.map(x=>({...x,_type:"Novel"})),
  ...db.games.map(x=>({...x,_type:"Game"})),
  ...db.events.map(x=>({...x,_type:"Event"}))
 ].filter(x=>JSON.stringify(x).toLowerCase().includes(q));

 return `
 <h1>Search</h1>
 <p class="sub">「${esc(q)}」の検索結果：${results.length}件</p>

 <div class="list">
 ${results.map(x=>`
 <div class="item">
  <span class="badge">${x._type}</span>
  <b>${esc(x.title||x.name||"無題")}</b>
 </div>`).join("")||
 `<div class="empty">見つからない。</div>`}
 </div>`;
}

};


/* BACKUP */

function backup(){

 const blob=new Blob(
   [JSON.stringify(db,null,2)],
   {type:"application/json"}
 );

 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download=`NEXUS_backup_${today()}.json`;
 a.click();

 URL.revokeObjectURL(a.href);
}

function restore(input){

 const file=input.files[0];
 if(!file)return;

 const reader=new FileReader();

 reader.onload=()=>{
   try{
     db={...defaults,...JSON.parse(reader.result)};
     save();
     applyTheme();
     render();
     toast("復元完了");
   }catch{
     toast("JSONが正しくありません");
   }
 };

 reader.readAsText(file);
}


/* INIT */

applyTheme();
renderNav();
render();


/* SERVICE WORKER */

if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
   navigator.serviceWorker.register("sw.js").catch(()=>{});
 });
}

</script>

</body>
</html>
