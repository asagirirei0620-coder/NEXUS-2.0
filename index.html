<!-- index.html -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXUS">
<meta name="description" content="NEXUS 2.0 Personal OS">
<link rel="manifest" href="manifest.json">
<title>NEXUS 2.0</title>

<style>
:root{
  --bg:#080b14;
  --panel:rgba(15,20,34,.78);
  --panel2:rgba(20,27,45,.84);
  --line:rgba(255,255,255,.09);
  --text:#f4f7ff;
  --muted:#8e99b3;
  --accent:#6c7cff;
  --accent2:#9d6cff;
  --good:#45d483;
  --warn:#ffc857;
  --danger:#ff5d73;
  --shadow:0 20px 60px rgba(0,0,0,.28);
  --radius:18px;
  --sidebar:270px;
  --density:1;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Yu Gothic",sans-serif;
  color:var(--text);
  background:var(--bg);
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:active{transform:scale(.98)}
.hidden{display:none!important}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-3;
  background:var(--wallpaper,linear-gradient(135deg,#080b14,#101a38));
  background-size:cover;
  background-position:center;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  background:rgba(0,0,0,var(--overlay,.18));
  pointer-events:none;
}

.app{
  display:grid;
  grid-template-columns:var(--sidebar) 1fr;
  width:100%;
  height:100%;
  overflow:hidden;
}

.sidebar{
  position:relative;
  z-index:20;
  height:100%;
  min-width:0;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  background:rgba(7,10,19,.78);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  border-right:1px solid var(--line);
  padding:18px 12px calc(18px + env(safe-area-inset-bottom));
}

.sidebar::-webkit-scrollbar,
.main::-webkit-scrollbar,
.modal-body::-webkit-scrollbar{width:5px}
.sidebar::-webkit-scrollbar-thumb,
.main::-webkit-scrollbar-thumb,
.modal-body::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.13);
  border-radius:99px;
}

.logo{
  display:flex;
  align-items:center;
  gap:11px;
  padding:5px 8px 18px;
}
.logo-mark{
  width:40px;height:40px;border-radius:13px;
  display:grid;place-items:center;
  font-weight:900;font-size:19px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 8px 30px rgba(108,124,255,.35);
}
.logo-title{font-weight:900;font-size:18px;letter-spacing:.4px}
.logo-version{font-size:10px;color:var(--muted);margin-top:2px}

.profile{
  padding:12px;
  margin-bottom:12px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.045);
  border-radius:15px;
}
.profile-top{display:flex;align-items:center;gap:10px}
.avatar{
  width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-weight:800;
}
.profile-name{font-weight:700;font-size:14px}
.profile-level{font-size:11px;color:var(--muted)}
.xpbar{height:5px;background:rgba(255,255,255,.08);border-radius:99px;margin-top:10px;overflow:hidden}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}

.nav-group{margin:14px 0}
.nav-label{
  color:#68728b;font-size:10px;font-weight:800;
  padding:0 11px 7px;text-transform:uppercase;letter-spacing:1.2px
}
.nav-item{
  width:100%;
  min-height:44px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:#aeb7cc;
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 12px;
  margin:3px 0;
  text-align:left;
  transition:.16s;
}
.nav-item:hover{background:rgba(255,255,255,.055);color:#fff}
.nav-item.active{
  background:linear-gradient(90deg,rgba(108,124,255,.2),rgba(157,108,255,.08));
  color:#fff;
  box-shadow:inset 3px 0 var(--accent);
}
.nav-icon{width:21px;text-align:center;font-size:17px}
.nav-text{font-size:13px;font-weight:650;flex:1}
.nav-badge{
  min-width:20px;padding:2px 6px;border-radius:99px;
  font-size:10px;background:rgba(255,255,255,.08);text-align:center
}

.sidebar-bottom{
  margin-top:18px;
  border-top:1px solid var(--line);
  padding-top:12px;
}

.main{
  min-width:0;
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:18px clamp(14px,3vw,34px) 60px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 0 16px;
  background:linear-gradient(var(--bg),rgba(8,11,20,.88),transparent);
  backdrop-filter:blur(8px);
}
.menu-btn{display:none}
.page-title{font-size:25px;font-weight:900;letter-spacing:-.6px}
.top-actions{margin-left:auto;display:flex;gap:8px}
.icon-btn,.btn{
  border:1px solid var(--line);
  background:rgba(255,255,255,.055);
  color:var(--text);
  min-height:40px;
  border-radius:12px;
  padding:8px 13px;
}
.icon-btn{width:42px;padding:0;display:grid;place-items:center}
.btn:hover,.icon-btn:hover{background:rgba(255,255,255,.1)}
.btn.primary{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.btn.good{border:0;background:var(--good);color:#07140d}
.btn.danger{border-color:rgba(255,93,115,.35);color:#ff9aaa}
.btn.small{min-height:34px;padding:6px 10px;font-size:12px}
.btn.ghost{background:transparent}

.view{animation:fade .18s ease}
@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}

.grid{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:14px;
}
.col-12{grid-column:span 12}.col-8{grid-column:span 8}.col-6{grid-column:span 6}
.col-4{grid-column:span 4}.col-3{grid-column:span 3}

.card{
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--panel);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  box-shadow:var(--shadow);
  padding:18px;
  min-width:0;
}
.card-title{
  display:flex;align-items:center;gap:8px;
  font-size:14px;font-weight:800;margin-bottom:13px
}
.card-title small{margin-left:auto;color:var(--muted);font-weight:500}

.stat-card{min-height:120px}
.stat-value{font-size:28px;font-weight:900;margin-top:8px}
.stat-label{color:var(--muted);font-size:11px}
.stat-sub{font-size:11px;color:var(--muted);margin-top:7px}

.progress{
  width:100%;height:7px;background:rgba(255,255,255,.07);
  border-radius:99px;overflow:hidden
}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}

.list{display:flex;flex-direction:column;gap:8px}
.list-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 12px;border:1px solid rgba(255,255,255,.065);
  border-radius:13px;background:rgba(255,255,255,.035)
}
.list-item-main{flex:1;min-width:0}
.list-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-meta{font-size:10px;color:var(--muted);margin-top:3px}
.checkbox{
  width:22px;height:22px;border-radius:7px;
  border:1px solid rgba(255,255,255,.18);
  display:grid;place-items:center;flex:none;
}
.checkbox.done{background:var(--good);border-color:var(--good);color:#06140c}
.tag{
  display:inline-flex;align-items:center;
  padding:4px 7px;border-radius:99px;
  font-size:10px;background:rgba(108,124,255,.13);
  color:#bfc7ff;margin:2px
}
.empty{
  color:var(--muted);text-align:center;padding:30px 10px;font-size:12px
}

.kpis{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px
}
.kpi{
  padding:13px;border:1px solid var(--line);
  background:rgba(255,255,255,.035);border-radius:14px
}

.toolbar{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px
}
.search{
  flex:1;min-width:180px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.05);
  color:var(--text);border-radius:12px;padding:11px 13px;outline:none
}
.input,.select,.textarea{
  width:100%;border:1px solid var(--line);
  background:rgba(5,8,15,.55);color:var(--text);
  border-radius:11px;padding:10px 11px;outline:none
}
.textarea{min-height:110px;resize:vertical}
.input:focus,.select:focus,.textarea:focus,.search:focus{
  border-color:rgba(108,124,255,.7);
  box-shadow:0 0 0 3px rgba(108,124,255,.1)
}
label.field{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.form-grid .full{grid-column:1/-1}

.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}
th{color:var(--muted);font-size:10px;text-transform:uppercase}
tr:last-child td{border-bottom:0}

.calendar-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.calendar-title{font-size:17px;font-weight:850}
.calendar-head .spacer{flex:1}
.calendar-grid{
  display:grid;grid-template-columns:repeat(7,1fr);
  border:1px solid var(--line);border-radius:14px;overflow:hidden
}
.calendar-weekday{
  padding:9px 4px;text-align:center;font-size:10px;
  color:var(--muted);background:rgba(255,255,255,.035)
}
.day{
  min-height:115px;padding:7px;border-top:1px solid var(--line);
  border-right:1px solid var(--line);background:rgba(255,255,255,.015)
}
.day:nth-child(7n){border-right:0}
.day.other{opacity:.35}
.day.today{background:rgba(108,124,255,.09)}
.day-number{font-size:11px;font-weight:800}
.event-dot{
  margin-top:5px;padding:4px 5px;border-radius:6px;
  background:rgba(108,124,255,.16);font-size:9px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.event-dot.task{background:rgba(69,212,131,.13)}
.event-dot.habit{background:rgba(255,200,87,.13)}

.week-grid{
  display:grid;grid-template-columns:60px repeat(7,1fr);
  border:1px solid var(--line);border-radius:14px;overflow:auto
}
.week-cell{
  min-width:120px;height:70px;border-right:1px solid var(--line);
  border-top:1px solid var(--line);padding:6px
}
.time-cell{color:var(--muted);font-size:9px}
.week-event{font-size:10px;padding:4px;border-radius:6px;background:rgba(108,124,255,.2)}

.chart{
  width:100%;height:230px;display:block;
  border-radius:12px;background:rgba(0,0,0,.12)
}

.bar-chart{
  display:flex;align-items:end;gap:8px;height:170px;
  padding:15px 5px 24px;border-bottom:1px solid var(--line)
}
.bar-wrap{flex:1;height:100%;display:flex;align-items:end;gap:3px}
.bar{flex:1;border-radius:5px 5px 0 0;background:linear-gradient(180deg,var(--accent),var(--accent2));min-height:2px}
.bar-label{font-size:9px;color:var(--muted);text-align:center;margin-top:6px}

.timer-display{
  font-size:76px;line-height:1;font-weight:900;
  text-align:center;letter-spacing:-3px;padding:28px 0
}
.timer-status{text-align:center;color:var(--muted);font-size:12px}
.timer-controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.timer-presets{display:flex;justify-content:center;gap:6px;margin:15px 0;flex-wrap:wrap}

.kanban{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px
}
.kanban-col{
  border:1px solid var(--line);border-radius:15px;padding:10px;
  background:rgba(255,255,255,.025);min-height:250px
}
.kanban-title{font-size:11px;font-weight:800;color:var(--muted);margin-bottom:8px}

.wallpaper-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px
}
.wallpaper{
  position:relative;height:100px;border-radius:14px;overflow:hidden;
  border:2px solid transparent;cursor:pointer
}
.wallpaper.selected{border-color:#fff;box-shadow:0 0 0 3px rgba(108,124,255,.45)}
.wallpaper span{
  position:absolute;left:8px;bottom:7px;
  font-size:10px;font-weight:700;
  text-shadow:0 2px 5px #000
}

.modal{
  position:fixed;inset:0;z-index:100;
  display:grid;place-items:center;padding:18px;
  background:rgba(0,0,0,.55);backdrop-filter:blur(8px)
}
.modal-box{
  width:min(720px,100%);max-height:min(90vh,850px);
  display:flex;flex-direction:column;
  border:1px solid var(--line);border-radius:20px;
  background:rgba(13,18,31,.96);box-shadow:0 30px 100px rgba(0,0,0,.55)
}
.modal-head{
  display:flex;align-items:center;padding:15px 17px;
  border-bottom:1px solid var(--line)
}
.modal-title{font-weight:850}
.modal-close{margin-left:auto}
.modal-body{padding:17px;overflow:auto}
.modal-foot{
  display:flex;justify-content:flex-end;gap:8px;
  padding:13px 17px;border-top:1px solid var(--line)
}

.toast{
  position:fixed;right:20px;bottom:20px;z-index:200;
  max-width:350px;padding:12px 15px;border-radius:12px;
  background:rgba(20,25,40,.95);border:1px solid var(--line);
  box-shadow:var(--shadow);font-size:12px;
  animation:toast .2s ease
}
@keyframes toast{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

.lock{
  position:fixed;inset:0;z-index:999;
  display:grid;place-items:center;
  background:#050711;
}
.lock-box{width:min(380px,90vw);text-align:center}
.lock-logo{margin:0 auto 15px;width:70px;height:70px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:28px;font-weight:900}
.lock-title{font-size:25px;font-weight:900}
.lock-sub{color:var(--muted);font-size:12px;margin:8px 0 20px}
.pin-dots{display:flex;justify-content:center;gap:9px;margin:18px}
.pin-dot{width:12px;height:12px;border-radius:50%;border:1px solid #65708b}
.pin-dot.on{background:var(--accent);border-color:var(--accent)}

.mobile-overlay{display:none}

@media(max-width:1050px){
  .col-4{grid-column:span 6}
  .col-3{grid-column:span 6}
  .wallpaper-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:760px){
  :root{--sidebar:270px}
  .app{display:block}
  .sidebar{
    position:fixed;left:-280px;top:0;bottom:0;width:270px;
    transition:.22s;box-shadow:20px 0 50px rgba(0,0,0,.35)
  }
  .sidebar.open{left:0}
  .mobile-overlay{
    position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.45)
  }
  .mobile-overlay.show{display:block}
  .menu-btn{display:grid}
  .main{padding:13px 12px 50px}
  .page-title{font-size:21px}
  .col-8,.col-6,.col-4,.col-3{grid-column:span 12}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:1fr}
  .wallpaper-grid{grid-template-columns:repeat(2,1fr)}
  .timer-display{font-size:55px}
  .kanban{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div id="lockScreen" class="lock hidden">
  <div class="lock-box">
    <div class="lock-logo">N</div>
    <div class="lock-title">NEXUS</div>
    <div class="lock-sub">アプリロック</div>
    <div id="pinDots" class="pin-dots"></div>
    <input id="lockPin" class="input" type="password" inputmode="numeric" maxlength="6" placeholder="PINを入力">
    <button class="btn primary" style="width:100%;margin-top:10px" onclick="unlockApp()">ロック解除</button>
  </div>
</div>

<div id="mobileOverlay" class="mobile-overlay" onclick="closeSidebar()"></div>

<div class="app">
  <aside id="sidebar" class="sidebar"></aside>

  <main id="main" class="main">
    <div class="topbar">
      <button class="icon-btn menu-btn" onclick="toggleSidebar()">☰</button>
      <div id="pageTitle" class="page-title">Dashboard</div>
      <div class="top-actions">
        <button class="icon-btn" onclick="quickAdd()" title="Quick Add">＋</button>
        <button class="icon-btn" onclick="globalSearch()" title="検索">⌕</button>
        <button class="icon-btn" onclick="toggleTheme()" title="テーマ">◐</button>
      </div>
    </div>
    <section id="view" class="view"></section>
  </main>
</div>

<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>

<script>
"use strict";

/* =========================================================
   NEXUS 2.0
   Local-first Personal OS
========================================================= */

const KEY="NEXUS_2_LOCAL_V2";
const VERSION=2;

const NAV=[
  ["dashboard","⌂","Dashboard","ホーム"],
  ["tasks","✓","Tasks","タスク"],
  ["notes","▤","Notes","ノート"],
  ["calendar","□","Calendar","カレンダー"],
  ["timer","◷","Timer","タイマー"],
  ["novels","✎","Novels","小説"],
  ["games","◇","Games","ゲーム"],
  ["study","▣","Study","勉強"],
  ["habits","↻","Habits","習慣"],
  ["tags","#","Tags","タグ"],
  ["link","∞","NEXUS LINK","リンク"],
  ["database","▦","Database","データベース"],
  ["money","¥","Money","お金"],
  ["files","▧","Files","ファイル"],
  ["stats","◒","Stats","統計"],
  ["activity","◌","Activity","履歴"],
  ["trash","⌫","Trash","ゴミ箱"]
];

const WALLPAPERS={
  space:["Deep Space","radial-gradient(circle at 20% 20%,#273a73 0 1%,transparent 2%),radial-gradient(circle at 75% 30%,#6f55bd 0 1%,transparent 2%),radial-gradient(circle at 50% 80%,#182d67 0 2%,transparent 3%),linear-gradient(135deg,#02040b,#0a1028 50%,#120b24)"],
  galaxy:["Galaxy","radial-gradient(ellipse at 20% 40%,#5d37b8 0,transparent 35%),radial-gradient(ellipse at 80% 65%,#1e7fd0 0,transparent 32%),linear-gradient(135deg,#03030a,#130d31 48%,#020711)"],
  neon:["Neon City","linear-gradient(115deg,#070019,#2b004c 35%,#001c3d 70%,#020812),repeating-linear-gradient(90deg,transparent 0 35px,rgba(0,255,255,.08) 36px 37px)"],
  aurora:["Aurora","radial-gradient(ellipse at 30% 10%,rgba(47,255,193,.55),transparent 30%),radial-gradient(ellipse at 70% 30%,rgba(106,82,255,.55),transparent 35%),linear-gradient(#04131b,#030611)"],
  ocean:["Ocean","radial-gradient(circle at 50% 0,#087c9b,transparent 45%),linear-gradient(150deg,#001c2d,#003a54 50%,#001018)"],
  forest:["Mystic Forest","radial-gradient(circle at 50% 20%,#235d43,transparent 25%),linear-gradient(135deg,#03140d,#08291c 50%,#020b08)"],
  volcano:["Volcano","radial-gradient(ellipse at 60% 90%,#ff542e,transparent 30%),linear-gradient(150deg,#160609,#4c1712 55%,#090204)"],
  sunset:["Sunset","radial-gradient(circle at 75% 35%,#ffd36b,transparent 12%),linear-gradient(160deg,#ff6a61,#d83c75 48%,#30255e)"],
  sunrise:["Sunrise","radial-gradient(circle at 50% 55%,#fff1ad,transparent 15%),linear-gradient(180deg,#6f91e8,#ffad78 55%,#ffe0a0)"],
  rain:["Rain","linear-gradient(115deg,#111b2c,#263954 45%,#09111e),repeating-linear-gradient(110deg,transparent 0 18px,rgba(150,190,255,.08) 19px 20px)"],
  snow:["Snow","radial-gradient(circle at 20% 30%,white 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,white 0 2px,transparent 3px),linear-gradient(135deg,#536d9e,#b9d5ee)"],
  desert:["Desert","radial-gradient(circle at 70% 28%,#ffe8a1,transparent 11%),linear-gradient(160deg,#8e4e2f,#d28c52 55%,#e9b36f)"],

function clone(o){return JSON.parse(JSON.stringify(o));}
function uid(prefix="id"){return prefix+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);}
function now(){return new Date().toISOString();}
function today(){return new Date().toISOString().slice(0,10);}
function fmtDate(v){
  if(!v)return "";
  const d=new Date(v+"T00:00:00");
  return d.toLocaleDateString("ja-JP",{year:"numeric",month:"short",day:"numeric"});
}
function fmtDateTime(v){
  if(!v)return "";
  const d=new Date(v);
  if(isNaN(d))return v;
  return d.toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
}
function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function arr(v){return Array.isArray(v)?v:[];}
function getById(type,id){return arr(db[type]).find(x=>x.id===id);}
function saveDB(){
  localStorage.setItem(KEY,JSON.stringify(db));
}
function loadDB(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY)||"null");
    if(x){
      const merged=deepMerge(clone(DEFAULT),x);
      return merged;
    }
  }catch(e){}
  return clone(DEFAULT);
}
function deepMerge(base,src){
  if(!src||typeof src!=="object")return base;
  for(const k of Object.keys(src)){
    if(src[k]&&typeof src[k]==="object"&&!Array.isArray(src[k])&&base[k]&&typeof base[k]==="object"&&!Array.isArray(base[k])){
      base[k]=deepMerge(base[k],src[k]);
    }else base[k]=src[k];
  }
  return base;
}
function logActivity(type,title,detail=""){
  db.activity.unshift({id:uid("act"),type,title,detail,date:now()});
  db.activity=db.activity.slice(0,500);
  saveDB();
}
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;
  el.classList.remove("hidden");
  clearTimeout(toast.t);
  toast.t=setTimeout(()=>el.classList.add("hidden"),2400);
}
function addXP(amount,reason){
  amount=Math.max(0,Number(amount)||0);
  if(!amount)return;
  const old=db.level;
  db.xp+=amount;
  db.level=1+Math.floor(db.xp/500);
  logActivity("xp",`+${amount} XP`,reason);
  saveDB();
  if(db.level>old){
    unlockAchievement("level_"+db.level,`レベル ${db.level}`,`NEXUSレベル${db.level}到達`);
    toast(`LEVEL UP! Lv.${db.level}`);
  }
}
function unlockAchievement(id,title,description){
  if(db.achievements.some(x=>x.id===id))return;
  db.achievements.push({id,title,description,date:now()});
  saveDB();
  toast(`🏆 実績解除: ${title}`);
}
function levelProgress(){
  const current=(db.level-1)*500;
  return Math.round(((db.xp-current)/500)*100);
}

function applySettings(){
  document.documentElement.style.setProperty("--accent",db.settings.accent);
  document.documentElement.style.setProperty("--accent2",mixColor(db.settings.accent));
  document.documentElement.style.setProperty("--overlay",db.settings.overlay);
  document.documentElement.style.setProperty("--density",db.settings.density==="compact"?.82:db.settings.density==="large"?1.15:1);
  document.documentElement.style.setProperty("--text-size",db.settings.fontScale+"");
  document.documentElement.style.fontSize=(16*db.settings.fontScale)+"px";
  const wp=WALLPAPERS[db.settings.wallpaper]||WALLPAPERS.space;
  document.body.style.setProperty("--wallpaper",wp[1]);
  document.body.dataset.theme=db.settings.theme;
  if(db.settings.theme==="light"){
    document.documentElement.style.setProperty("--bg","#e9edf5");
    document.documentElement.style.setProperty("--panel","rgba(255,255,255,.76)");
    document.documentElement.style.setProperty("--panel2","rgba(255,255,255,.9)");
    document.documentElement.style.setProperty("--text","#151a26");
    document.documentElement.style.setProperty("--muted","#667085");
  }else{
    document.documentElement.style.setProperty("--bg","#080b14");
    document.documentElement.style.setProperty("--panel","rgba(15,20,34,.78)");
    document.documentElement.style.setProperty("--panel2","rgba(20,27,45,.84)");
    document.documentElement.style.setProperty("--text","#f4f7ff");
    document.documentElement.style.setProperty("--muted","#8e99b3");
  }
}
function mixColor(hex){
  const h=hex.replace("#","");
  if(h.length!==6)return "#9d6cff";
  const n=parseInt(h,16);
  const r=255-((n>>16)&255);
  const g=255-((n>>8)&255);
  const b=255-(n&255);
  return `rgb(${Math.max(80,r)},${Math.max(70,g)},${Math.max(100,b)})`;
}
function toggleTheme(){
  db.settings.theme=db.settings.theme==="dark"?"light":"dark";
  saveDB();applySettings();render();
}
function randomWallpaper(){
  const keys=Object.keys(WALLPAPERS);
  const current=db.settings.wallpaper;
  let next=current;
  while(next===current)next=keys[Math.floor(Math.random()*keys.length)];
  db.settings.wallpaper=next;
  saveDB();applySettings();render();
}
function dailyWallpaper(){
  const keys=Object.keys(WALLPAPERS);
  const day=Math.floor(Date.now()/86400000);
  db.settings.wallpaper=keys[day%keys.length];
  saveDB();applySettings();
}

/* TASKS */
function renderTasks(){
  const q=searchTerm.toLowerCase();
  const tasks=db.tasks.filter(t=>!q||(t.title+" "+t.description+" "+(t.tags||[]).join(" ")).toLowerCase().includes(q));
  const groups={todo:[],doing:[],done:[]};
  tasks.forEach(t=>groups[t.done?"done":t.progress>0?"doing":"todo"].push(t));
  return `<div class="toolbar">
    <input class="search" placeholder="タスクを検索..." value="${esc(searchTerm)}" oninput="searchTerm=this.value;render()">
    <select class="select" style="width:150px" onchange="taskFilter=this.value;render()">
      <option value="">すべて</option><option value="high">高優先</option><option value="today">今日</option>
    </select>
    <button class="btn primary" onclick="openTaskModal()">＋ タスク追加</button>
  </div>
  <div class="kanban">
    ${taskColumn("未着手",groups.todo)}
    ${taskColumn("進行中",groups.doing)}
    ${taskColumn("完了",groups.done)}
  </div>`;
}
let taskFilter="";
function taskColumn(title,items){
  if(taskFilter==="high")items=items.filter(x=>x.priority==="high");
  if(taskFilter==="today")items=items.filter(x=>x.due===today());
  return `<div class="kanban-col"><div class="kanban-title">${title} (${items.length})</div>
  ${items.map(t=>`
    <div class="list-item" style="margin-bottom:7px">
      <div class="checkbox ${t.done?"done":""}" onclick="toggleTask('${t.id}')">${t.done?"✓":""}</div>
      <div class="list-item-main" onclick="openTaskModal('${t.id}')">
        <div class="list-title">${esc(t.title)}</div>
        <div class="list-meta">${t.due?fmtDate(t.due):"期限なし"} ・ ${t.priority||"normal"}</div>
        ${t.subtasks?.length?`<div class="progress" style="margin-top:6px"><i style="width:${subtaskProgress(t)}%"></i></div>`:""}
      </div>
    </div>`).join("")||`<div class="empty">なし</div>`}</div>`;
}
function subtaskProgress(t){
  if(!t.subtasks?.length)return 0;
  return Math.round(t.subtasks.filter(x=>x.done).length/t.subtasks.length*100);
}
function toggleTask(id){
  const t=getById("tasks",id);if(!t)return;
  t.done=!t.done;
  t.completedAt=t.done?now():null;
  if(t.done)addXP(20,`タスク完了: ${t.title}`);
  logActivity("task",t.done?"タスク完了":"タスク再開",t.title);
  saveDB();render();
}

function autosaveNote(id,key,value){
  const n=getById("notes",id);if(!n)return;
  clearTimeout(noteAutosaveTimer);
  noteAutosaveTimer=setTimeout(()=>{
    if(key==="content"&&value!==n.content){
      n.history=n.history||[];
      n.history.unshift({title:n.title,content:n.content,date:now()});
      n.history=n.history.slice(0,30);
    }
    n[key]=value;n.updatedAt=now();saveDB();
  },350);
}
function updateNoteTags(id,v){
  const n=getById("notes",id);

/* CALENDAR */
function renderCalendar(){
  if(calendarMode==="month")return renderMonthCalendar();
  if(calendarMode==="week")return renderWeekCalendar();
  return renderDayCalendar();
}
function calendarToolbar(){
  const y=calendarDate.getFullYear(),m=calendarDate.getMonth()+1;
  return `<div class="calendar-head">
    <button class="btn small" onclick="moveCalendar(-1)">‹</button>
    <button class="btn small" onclick="calendarDate=new Date();render()">今日</button>
    <button class="btn small" onclick="moveCalendar(1)">›</button>
    <div class="calendar-title">${y}年 ${m}月</div><div class="spacer"></div>
    <select class="select" style="width:110px" onchange="calendarMode=this.value;render()">
      <option value="month" ${calendarMode==="month"?"selected":""}>月</option>
      <option value="week" ${calendarMode==="week"?"selected":""}>週</option>
      <option value="day" ${calendarMode==="day"?"selected":""}>日</option>
    </select>
    <button class="btn primary" onclick="openEventModal()">＋ 予定</button>
  </div>`;
}
function moveCalendar(n){
  if(calendarMode==="month")calendarDate.setMonth(calendarDate.getMonth()+n);
  else if(calendarMode==="week")calendarDate.setDate(calendarDate.getDate()+n*7);
  else calendarDate.setDate(calendarDate.getDate()+n);
  render();
}
function eventsForDate(d){
  const ds=d.toISOString().slice(0,10);
  return db.events.filter(e=>e.date===ds||recurringMatches(e,ds));
}
function recurringMatches(e,ds){
  if(!e.repeat||e.date===ds)return false;
  const start=new Date(e.date+"T00:00:00"),target=new Date(ds+"T00:00:00");
  if(target<start)return false;
  const diff=Math.floor((target-start)/86400000);
  if(e.repeat==="daily")return true;
  if(e.repeat==="weekly")return diff%7===0;
  if(e.repeat==="monthly")return start.getDate()===target.getDate();
  return false;
}
function renderMonthCalendar(){
  const y=calendarDate.getFullYear(),m=calendarDate.getMonth();
  const first=new Date(y,m,1),start=new Date(first);
  start.setDate(1-first.getDay());
  let html=calendarToolbar()+`<div class="calendar-grid">`;
  ["日","月","火","水","木","金","土"].forEach(x=>html+=`<div class="calendar-weekday">${x}</div>`);
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const ds=d.toISOString().slice(0,10);
    const isOther=d.getMonth()!==m,isToday=ds===today();
    const ev=eventsForDate(d);
    const task=db.tasks.filter(t=>t.due===ds);
    html+=`<div class="day ${isOther?"other":""} ${isToday?"today":""}" onclick="openEventModal(null,'${ds}')">
      <div class="day-number">${d.getDate()}</div>
      ${ev.slice(0,3).map(e=>`<div class="event-dot">${esc(e.time||"")} ${esc(e.title)}</div>`).join("")}
      ${task.slice(0,2).map(t=>`<div class="event-dot task">✓ ${esc(t.title)}</div>`).join("")}
    </div>`;
  }
  return `<div class="card">${html}</div>`;
}
function renderWeekCalendar(){
  const base=new Date(calendarDate);base.setDate(base.getDate()-base.getDay());
  let html=calendarToolbar()+`<div class="week-grid"><div class="week-cell"></div>`;
  for(let i=0;i<7;i++){
    const d=new Date(base);d.setDate(base.getDate()+i);
    html+=`<div class="week-cell" style="height:45px;font-weight:800">${d.getMonth()+1}/${d.getDate()}</div>`;
  }
  for(let h=0;h<24;h++){
    html+=`<div class="week-cell time-cell">${String(h).padStart(2,"0")}:00</div>`;
    for(let i=0;i<7;i++){
      const d=new Date(base);d.setDate(base.getDate()+i);
      const ev=eventsForDate(d).filter(e=>Number((e.time||"00:00").slice(0,2))===h);
      html+=`<div class="week-cell">${ev.map(e=>`<div class="week-event">${esc(e.title)}</div>`).join("")}</div>`;
    }
  }
  return `<div class="card">${html}</div>`;
}
function renderDayCalendar(){
  const ds=calendarDate.toISOString().slice(0,10);
  const ev=eventsForDate(calendarDate);
  const tasks=db.tasks.filter(t=>t.due===ds);
  return `<div class="card">${calendarToolbar()}
    <div class="list">${ev.map(e=>`<div class="list-item"><div class="list-item-main"><div class="list-title">${esc(e.title)}</div><div class="list-meta">${esc(e.time||"")} ・ ${esc(e.place||"")}</div></div><button class="btn small" onclick="openEventModal('${e.id}')">編集</button></div>`).join("")}
    ${tasks.map(t=>`<div class="list-item"><div class="checkbox ${t.done?"done":""}" onclick="toggleTask('${t.id}')">${t.done?"✓":""}</div><div class="list-item-main"><div class="list-title">${esc(t.title)}</div><div class="list-meta">タスク</div></div></div>`).join("")}
    ${!ev.length&&!tasks.length?`<div class="empty">予定はありません</div>`:""}</div>
  </div>`;
}

/* TIMER */
function formatTime(sec){
  sec=Math.max(0,Math.floor(sec));
  return `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;
}
function renderTimer(){
  return `<div class="grid">
    <div class="card col-8">
      <div class="card-title">◷ Focus Timer</div>
      <div id="timerDisplay" class="timer-display">${formatTime(timer.remaining)}</div>
      <div id="timerStatus" class="timer-status">${timer.running?"実行中":"停止中"} ・ ${timer.mode}</div>
      <div class="timer-presets">
        <button class="btn small" onclick="setTimer(300)">5分</button>
        <button class="btn small" onclick="setTimer(900)">15分</button>
        <button class="btn small" onclick="setTimer(1500)">25分</button>
        <button class="btn small" onclick="setTimer(3000)">50分</button>
        <button class="btn small" onclick="setTimer(3600)">60分</button>
      </div>
      <div class="timer-controls">
        <button class="btn primary" onclick="toggleTimer()">${timer.running?"一時停止":"開始"}</button>
        <button class="btn" onclick="resetTimer()">リセット</button>
        <button class="btn" onclick="finishTimer()">終了して記録</button>
      </div>
      <div style="margin-top:20px" class="form-grid">
        <div><label class="field">モード</label><select class="select" onchange="timer.mode=this.value"><option value="pomodoro">Pomodoro</option><option value="countdown">Countdown</option><option value="stopwatch">Stopwatch</option></select></div>
        <div><label class="field">関連データ</label><select id="timerLink" class="select" onchange="timer.linkedId=this.value">
          <option value="">なし</option>${timerLinkOptions()}
        </select></div>
      </div>
    </div>
    <div class="card col-4">
      <div class="card-title">今日のFocus</div>
      <div class="stat-value">${db.timerSessions.filter(x=>x.date===today()).reduce((a,b)=>a+(b.minutes||0),0)}<small>分</small></div>
      <div class="stat-sub">セッション ${db.timerSessions.filter(x=>x.date===today()).length}</div>
      <div class="list" style="margin-top:15px">${db.timerSessions.slice(0,8).map(x=>`<div class="list-item"><div class="list-item-main"><div class="list-title">${x.minutes}分</div><div class="list-meta">${fmtDateTime(x.date)}</div></div></div>`).join("")}</div>
    </div>
  </div>`;
}
function timerLinkOptions(){
  return [
    ...db.tasks.map(x=>`<option value="task:${x.id}" ${timer.linkedId===`task:${x.id}`?"selected":""}>✓ ${esc(x.title)}</option>`),
    ...db.novels.map(x=>`<option value="novel:${x.id}" ${timer.linkedId===`novel:${x.id}`?"selected":""}>✎ ${esc(x.title)}</option>`),
    ...db.games.map(x=>`<option value="game:${x.id}" ${timer.linkedId===`game:${x.id}`?"selected":""}>◇ ${esc(x.title)}</option>`)
  ].join("");
}
function setTimer(sec){
  clearInterval(timer.interval);
  timer.running=false;timer.duration=sec;timer.remaining=sec;timer.startedAt=null;render();
}
function toggleTimer(){
  if(timer.running){
    clearInterval(timer.interval);timer.running=false;
  }else{
    timer.running=true;timer.startedAt=Date.now()-(timer.duration-timer.remaining)*1000;
    timer.interval=setInterval(timerTick,1000);
  }
  updateTimerDOM();
}
function timerTick(){
  if(timer.mode==="stopwatch")timer.remaining++;
  else timer.remaining--;
  if(timer.remaining<=0&&timer.mode!=="stopwatch"){
    timer.remaining=0;clearInterval(timer.interval);timer.running=false;
    finishTimer(true);return;
  }
  updateTimerDOM();
}
function updateTimerDOM(){
  const d=document.getElementById("timerDisplay"),s=document.getElementById("timerStatus");
  if(d)d.textContent=formatTime(timer.remaining);
  if(s)s.textContent=`${timer.running?"実行中":"停止中"} ・ ${timer.mode}`;
}
function resetTimer(){
  clearInterval(timer.interval);timer.running=false;timer.remaining=timer.duration;timer.startedAt=null;updateTimerDOM();
}
function finishTimer(auto=false){
  clearInterval(timer.interval);
  const elapsed=timer.mode==="stopwatch"?timer.remaining:Math.max(0,timer.duration-timer.remaining);
  const minutes=Math.max(1,Math.round(elapsed/60));
  if(elapsed>20){
    db.timerSessions.unshift({id:uid("session"),date:today(),minutes,mode:timer.mode,linkedId:timer.linkedId});
    addXP(Math.min(60,minutes),`Focus ${minutes}分`);
    logActivity("timer",`Focus ${minutes}分`);
    saveDB();
  }
  timer.running=false;
  if(auto){
    notify("NEXUS Timer","タイマーが終了しました");
    toast("タイマー終了！");
    playBeep();
  }
  if(currentView==="timer")render();
}

    <div class="card col-4"><div class="card-title">▧ ${esc(f.name)}</div><div class="list-meta">${esc(f.type||"")} ・ ${formatBytes(f.size)}</div>
    <div class="toolbar" style="margin-top:10px"><button class="btn small" onclick="downloadStoredFile('${f.id}')">開く</button><button class="btn small danger" onclick="trashItem('files','${f.id}')">削除</button></div></div>`).join("")||`<div class="card col-12"><div class="empty">ファイルなし</div></div>`}</div>`;
}
function formatBytes(n){
  n=Number(n)||0;if(n<1024)return n+" B";if(n<1048576)return (n/1024).toFixed(1)+" KB";return (n/1048576).toFixed(1)+" MB";
}
async function importFiles(files){
  for(const f of files){
    if(f.size>5*1024*1024){toast("5MBを超えるファイルは保存できません");continue}
    const data=await fileToDataURL(f);
    db.files.unshift({id:uid("file"),name:f.name,type:f.type,size:f.size,data,createdAt:now()});
  }
  saveDB();render();toast("ファイルを保存しました");
}
function fileToDataURL(file){
  return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})
}
function downloadStoredFile(id){
  const f=getById("files",id);if(!f)return;
  const a=document.createElement("a");a.href=f.data;a.download=f.name;a.target="_blank";a.click();
}

    <div class="card col-6"><div class="card-title">Study / Focus</div><canvas id="studyChart" class="chart" width="700" height="230"></canvas></div>
    <div class="card col-6"><div class="card-title">Task Completion</div><canvas id="taskChart" class="chart" width="700" height="230"></canvas></div>
    <div class="card col-6"><div class="card-title">Novel PV</div><canvas id="pvChart" class="chart" width="700" height="230"></canvas></div>
    <div class="card col-6"><div class="card-title">Game Playtime</div><canvas id="gameChart" class="chart" width="700" height="230"></canvas></div>
  </div>`;
}
function drawChart(id,data,labels){
  const c=document.getElementById(id);if(!c)return;
  const ctx=c.getContext("2d"),w=c.width,h=c.height;
  ctx.clearRect(0,0,w,h);
  const max=Math.max(1,...data);
  ctx.strokeStyle="rgba(255,255,255,.1)";
  for(let i=0;i<5;i++){const y=20+i*(h-55)/4;ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(w-15,y);ctx.stroke()}
  ctx.beginPath();
  data.forEach((v,i)=>{
    const x=45+i*((w-70)/Math.max(1,data.length-1));
    const y=20+(h-55)*(1-v/max);
    i?ctx.lineTo(x,y):ctx.moveTo(x,y)
  });
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||"#6c7cff";
  ctx.lineWidth=3;ctx.stroke();
  data.forEach((v,i)=>{
    const x=45+i*((w-70)/Math.max(1,data.length-1));
    const y=20+(h-55)*(1-v/max);
    ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.55)";ctx.font="9px sans-serif";ctx.fillText(labels[i],x-12,h-12);
  });
}
function drawStatsCharts(){
  const days=[],labels=[];
  for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const ds=d.toISOString().slice(0,10);days.push(ds);labels.push(ds.slice(5))}
  const study=days.map(d=>db.studies.filter(x=>x.date===d).reduce((a,b)=>a+(+b.minutes||0),0));
  const focus=days.map(d=>db.timerSessions.filter(x=>x.date===d).reduce((a,b)=>a+(+b.minutes||0),0));
  const tasks=days.map(d=>db.tasks.filter(x=>x.done&&x.completedAt?.slice(0,10)===d).length);
  const pv=days.map(d=>db.novels.reduce((a,n)=>a+(n.dailyPV?.[d]||0),0));
  drawChart("studyChart",study,labels);
  drawChart("taskChart",tasks,labels);
  drawChart("pvChart",pv,labels);
  drawChart("gameChart",focus,labels);
}

function trashItem(type,id){
  const list=db[type],i=list.findIndex(x=>x.id===id);if(i<0)return;
  const item=list[i];
  list.splice(i,1);
  db.trash.unshift({id:uid("trash"),type,item,deletedAt:now()});
  saveDB();logActivity("trash","データをゴミ箱へ",item.title||item.name||"");render();
}
function restoreTrash(id){
  const x=db.trash.find(v=>v.id===id);if(!x)return;
  if(db[x.type])db[x.type].push(x.item);
  db.trash=db.trash.filter(v=>v.id!==id);
  saveDB();render();toast("復元しました");
}
function deleteTrash(id){db.trash=db.trash.filter(v=>v.id!==id);saveDB();render();}

function toggleDashboardCard(id){

function dropDashboard(target){
  if(!dragDashboard||dragDashboard===target)return;

  db.dashboardOrder.splice(a,1);db.dashboardOrder.splice(b,0,dragDashboard);

}

function globalSearch(){
  showModal("NEXUS Search",`
    <input id="globalSearchInput" class="search" placeholder="タスク、ノート、小説、ゲーム、予定..." autofocus oninput="runGlobalSearch(this.value)">

function runGlobalSearch(q){
  const out=document.getElementById("globalResults");if(!out)return;
  q=q.toLowerCase().trim();
  if(!q){out.innerHTML=`<div class="empty">検索語を入力</div>`;return}
  const types=["tasks","notes","events","novels","games","habits","studies","money"];
  let rows=[];
  types.forEach(type=>db[type].forEach(x=>{
    const text=JSON.stringify(x).toLowerCase();
    if(text.includes(q))rows.push({type,x});
  }));
  out.innerHTML=rows.slice(0,50).map(r=>`<div class="list-item"><div class="list-item-main"><div class="list-title">${esc(r.x.title||r.x.name||r.x.subject||"データ")}</div><div class="list-meta">${r.type}</div></div><button class="btn small" onclick="closeModal();go('${typeToView(r.type)}')">開く</button></div>`).join("")||`<div class="empty">見つかりません</div>`;
}
function typeToView(t){
  return {tasks:"tasks",notes:"notes",events:"calendar",novels:"novels",games:"games",habits:"habits",studies:"study",money:"money"}[t]||"dashboard";
}

  obj.tags=document.getElementById("fTags").value.split(",").map(x=>x.trim()).filter(Boolean);

function openEpisodeModal(id=null,novelId=null){
  let parent=novelId?getById("novels",novelId):db.novels[0];
  let existing=null;
  if(id){
    for(const n of db.novels){existing=n.episodes?.find(e=>e.id===id);if(existing){parent=n;break}}
  }
  if(!parent)return toast("先に作品を作成してください");
  showModal("エピソード",`
    <div class="form-grid">
      <div class="full"><label class="field">作品</label><select id="epNovel" class="select">${db.novels.map(n=>`<option value="${n.id}" ${n.id===parent.id?"selected":""}>${esc(n.title)}</option>`).join("")}</select></div>
      <div><label class="field">タイトル</label><input id="epTitle" class="input" value="${esc(existing?.title||"")}"></div>
      <div><label class="field">文字数</label><input id="epWords" type="number" class="input" value="${existing?.wordCount||0}"></div>
      <div><label class="field">PV</label><input id="epPV" type="number" class="input" value="${existing?.pv||0}"></div>
      <div><label class="field">投稿状況</label><select id="epStatus" class="select"><option>未投稿</option><option>投稿済</option><option>予約</option></select></div>
    </div>`,
    `<button class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary" onclick="saveEpisode('${id||""}')">保存</button>`);
  if(existing)document.getElementById("epStatus").value=existing.status||"未投稿";
}
function saveEpisode(id){
  const novel=getById("novels",document.getElementById("epNovel").value);if(!novel)return;
  const old=id?novel.episodes.find(x=>x.id===id):null;
  const e=old||{id:uid("episode"),createdAt:now()};
  e.title=document.getElementById("epTitle").value.trim()||"無題";e.wordCount=+document.getElementById("epWords").value||0;e.pv=+document.getElementById("epPV").value||0;e.status=document.getElementById("epStatus").value;
  if(!old)novel.episodes.push(e);
  novel.wordCount=novel.episodes.reduce((a,b)=>a+(+b.wordCount||0),0);
  saveDB();closeModal();render();
}
function openPVModal(id){
  const n=getById("novels",id);
  showModal("PV記録",`
    <div class="form-grid">
      <div><label class="field">日付</label><input id="pvDate" type="date" class="input" value="${today()}"></div>
      <div><label class="field">PV</label><input id="pvValue" type="number" class="input" value="0"></div>
    </div>`,
    `<button class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary" onclick="savePV('${id}')">保存</button>`);
}
function savePV(id){
  const n=getById("novels",id),d=document.getElementById("pvDate").value,v=+document.getElementById("pvValue").value||0;
  if(!n)return;n.dailyPV=n.dailyPV||{};n.dailyPV[d]=v;n.totalPV=Object.values(n.dailyPV).reduce((a,b)=>a+(+b||0),0);n.highestDayPV=Math.max(0,...Object.values(n.dailyPV).map(Number));
  saveDB();closeModal();render();
}

function openDatabaseRecordModal(dbid,rid=null){

/* BACKUP */
function exportBackup(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`NEXUS-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href);
}
async function importBackup(file){
  if(!file)return;
  try{
    const text=await file.text(),data=JSON.parse(text);
    if(!confirm("現在のデータを読み込んだデータで置き換えますか？"))return;
    db=deepMerge(clone(DEFAULT),data);saveDB();applySettings();renderSidebar();render();toast("バックアップを復元しました");
  }catch(e){toast("JSONを読み込めませんでした")}
}
function exportFileManifest(){
  const blob=new Blob([JSON.stringify(db.files.map(({data,...x})=>x),null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="NEXUS-files.json";a.click();
}
function resetAll(){
  if(!confirm("本当に全データを削除しますか？"))return;
  localStorage.removeItem(KEY);db=clone(DEFAULT);saveDB();applySettings();renderSidebar();render();toast("初期化しました");
}

/* PIN */
async function hashPin(pin){
  const data=new TextEncoder().encode(pin);
  const hash=await crypto.subtle.digest("SHA-256",data);
  return [...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function setPIN(){
  const p=document.getElementById("pinSetting")?.value||"";
  if(!/^\d{4,6}$/.test(p))return toast("4〜6桁の数字を入力してください");
  db.settings.pin=await hashPin(p);db.settings.lock=true;saveDB();toast("PINを設定しました");
}
async function removePIN(){db.settings.pin="";db.settings.lock=false;saveDB();toast("PINを解除しました")}
async function unlockApp(){
  const p=document.getElementById("lockPin").value;
  if(await hashPin(p)===db.settings.pin){
    document.getElementById("lockScreen").classList.add("hidden");
    document.getElementById("lockPin").value="";
  }else toast("PINが違います");
}
function initLock(){
  if(db.settings.lock&&db.settings.pin)document.getElementById("lockScreen").classList.remove("hidden");
}

/* NOTIFICATIONS */
async function requestNotifications(){
  if(!("Notification" in window))return toast("このブラウザは通知に対応していません");
  const p=await Notification.requestPermission();
  toast(p==="granted"?"通知を許可しました":"通知は許可されませんでした");
}
function notify(title,body){
  if("Notification" in window&&Notification.permission==="granted"){
    try{new Notification(title,{body,icon:""})}catch(e){}
  }
}
function notificationLoop(){
  const nowMs=Date.now();
  db.events.forEach(e=>{
    if(!e.reminder||!e.date||!e.time)return;
    const t=new Date(`${e.date}T${e.time}`).getTime()-e.reminder*60000;
    if(Math.abs(t-nowMs)<35000&&!e._notified){
      e._notified=true;saveDB();notify("NEXUS予定",e.title);
    }
  });
  db.tasks.forEach(t=>{
    if(!t.due||t.done)return;
    if(t.due===today()&&t.time){
      const target=new Date(`${t.due}T${t.time}`).getTime();
      if(Math.abs(target-nowMs)<35000&&!t._notified){
        t._notified=true;saveDB();notify("NEXUSタスク",t.title);
      }
    }
  });
}

/* SOUND */
function playBeep(){
  if(!db.settings.sound)return;
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    const c=new C(),o=c.createOscillator(),g=c.createGain();
    o.frequency.value=740;g.gain.value=.06;o.connect(g);g.connect(c.destination);o.start();
    setTimeout(()=>{o.frequency.value=980},120);
    setTimeout(()=>{o.stop();c.close()},280);
  }catch(e){}
}

/* SERVICE WORKER */
async function registerSW(){
  if("serviceWorker" in navigator){
    try{await navigator.serviceWorker.register("./sw.js",{scope:"./"})}catch(e){}
  }
}

/* AUTO WALLPAPER */
function checkDailyWallpaper(){
  if(!db.settings.autoWallpaper)return;
  const last=localStorage.getItem("NEXUS_WP_DAY");
  const d=today();
  if(last!==d){
    dailyWallpaper();
    localStorage.setItem("NEXUS_WP_DAY",d);
  }
}

/* INITIAL */
function init(){
  checkDailyWallpaper();
  applySettings();
  renderSidebar();
  render();
  initLock();
  setInterval(notificationLoop,30000);
  registerSW();
}
init();
</script>
