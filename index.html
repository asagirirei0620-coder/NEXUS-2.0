<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>NEXUS 2.0</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f4f7fb;
  --card:#fff;
  --text:#18212f;
  --muted:#718096;
  --border:#e2e8f0;
  --primary:#2563eb;
  --side:#111827;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}

body.dark{
  --bg:#0b1220;
  --card:#111827;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --border:#263247;
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

.app{
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:245px;
  background:var(--side);
  color:white;
  padding:20px 14px;
  position:fixed;
  inset:0 auto 0 0;
  overflow:auto;
  z-index:5;
}

.logo{
  font-size:25px;
  font-weight:800;
  padding:8px 10px 24px;
}

.logo small{
  display:block;
  font-size:10px;
  opacity:.55;
  letter-spacing:2px;
  margin-top:3px;
}

.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:#cbd5e1;
  text-align:left;
  padding:12px;
  border-radius:10px;
  margin:2px 0;
}

.nav button:hover,
.nav button.active{
  background:#243047;
  color:white;
}

.main{
  margin-left:245px;
  width:calc(100% - 245px);
  padding:26px;
  max-width:1600px;
}

.top{
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:22px;
}

.top h1{
  margin:0;
  flex:1;
  font-size:28px;
}

.search{
  width:min(430px,45vw);
  padding:11px 14px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
  color:var(--text);
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  box-shadow:0 4px 18px #00000008;
}

.grid{
  display:grid;
  gap:16px;
}

.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}

.stat{
  font-size:30px;
  font-weight:800;
  margin-top:5px;
}

.muted{
  color:var(--muted);
  font-size:13px;
}

.section{
  margin:24px 0 10px;
  font-size:19px;
  font-weight:800;
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

.between{
  justify-content:space-between;
}

input,
textarea,
select{
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px;
  background:var(--card);
  color:var(--text);
  width:100%;
}

textarea{
  min-height:130px;
  resize:vertical;
}

.form{
  display:grid;
  gap:10px;
}

.btn{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  background:#e9eef6;
  color:#18212f;
}

.primary{
  background:var(--primary);
  color:white;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.danger{
  background:#fee2e2;
  color:#b91c1c;
}

.darkbtn{
  background:#1f2937;
  color:white;
}

.item{
  border:1px solid var(--border);
  border-radius:12px;
  padding:13px;
  margin-top:10px;
}

.done{
  text-decoration:line-through;
  opacity:.55;
}

.tag{
  display:inline-block;
  background:#eef2ff;
  color:#4338ca;
  padding:4px 8px;
  border-radius:999px;
  font-size:11px;
  margin:3px;
}

.progress{
  height:8px;
  background:#e8edf4;
  border-radius:99px;
  overflow:hidden;
}

.progress i{
  display:block;
  height:100%;
  background:var(--primary);
}

.timer{
  font-size:64px;
  font-weight:800;
  text-align:center;
  padding:20px;
}

.timer-mode{
  text-align:center;
  font-size:13px;
  color:var(--muted);
}

.bigbtn{
  font-size:18px;
  padding:13px 24px;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}

.weekday{
  text-align:center;
  font-weight:700;
  color:var(--muted);
  padding:8px;
}

.day{
  min-height:90px;
  border:1px solid var(--border);
  border-radius:10px;
  padding:7px;
  background:var(--card);
}

.day.today{
  outline:2px solid var(--primary);
}

.day b{
  font-size:12px;
}

.event{
  font-size:10px;
  background:#dbeafe;
  color:#1e40af;
  border-radius:5px;
  padding:3px 4px;
  margin-top:3px;
  overflow:hidden;
  white-space:nowrap;
}

.dark .event{
  background:#1e3a5f;
  color:#bfdbfe;
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#111827;
  color:white;
  padding:12px 16px;
  border-radius:12px;
  display:none;
  z-index:20;
}

.modal{
  position:fixed;
  inset:0;
  background:#0007;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:10;
}

.modal.show{
  display:flex;
}

.modalbox{
  background:var(--card);
  color:var(--text);
  border-radius:18px;
  padding:22px;
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
}

.empty{
  text-align:center;
  padding:25px;
  color:var(--muted);
}

.xpbar{
  height:10px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
}

.xpbar i{
  display:block;
  height:100%;
  background:var(--primary);
}

.badge{
  display:inline-block;
  padding:7px 10px;
  background:#fef3c7;
  color:#92400e;
  border-radius:9px;
  margin:4px;
  font-size:12px;
}

@media(max-width:900px){
  .sidebar{
    width:72px;
  }

  .logo{
    font-size:0;
    text-align:center;
  }

  .logo:before{
    content:"N";
    font-size:25px;
  }

  .logo small,
  .nav span{
    display:none;
  }

  .nav button{
    text-align:center;
  }

  .main{
    margin-left:72px;
    width:calc(100% - 72px);
    padding:16px;
  }

  .g4{
    grid-template-columns:repeat(2,1fr);
  }

  .g3{
    grid-template-columns:1fr;
  }
}

@media(max-width:600px){
  .top{
    flex-wrap:wrap;
  }

  .top h1{
    width:100%;
    flex:auto;
  }

  .search{
    width:100%;
  }

  .g4,
  .g2{
    grid-template-columns:1fr;
  }

  .timer{
    font-size:48px;
  }

  .day{
    min-height:65px;
  }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">
  <div class="logo">
    NEXUS
    <small>PERSONAL OS 2.0</small>
  </div>

  <div class="nav">
    <button class="active" onclick="showPage('dashboard',this)">🏠 <span>ダッシュボード</span></button>
    <button onclick="showPage('tasks',this)">✅ <span>タスク</span></button>
    <button onclick="showPage('notes',this)">📝 <span>ノート</span></button>
    <button onclick="showPage('calendar',this)">📅 <span>カレンダー</span></button>
    <button onclick="showPage('timer',this)">⏱️ <span>タイマー</span></button>
    <button onclick="showPage('novels',this)">✍️ <span>小説</span></button>
    <button onclick="showPage('games',this)">🎮 <span>ゲーム</span></button>
    <button onclick="showPage('study',this)">📚 <span>勉強</span></button>
    <button onclick="showPage('habits',this)">🔥 <span>習慣</span></button>
    <button onclick="showPage('tags',this)">🏷️ <span>タグ</span></button>
    <button onclick="showPage('stats',this)">📊 <span>統計</span></button>
    <button onclick="showPage('activity',this)">📜 <span>履歴</span></button>
    <button onclick="showPage('settings',this)">⚙️ <span>設定</span></button>
  </div>
</aside>

<main class="main">

<div class="top">
  <h1 id="pageTitle">ダッシュボード</h1>
  <input class="search" id="globalSearch" placeholder="NEXUS全体を検索..." oninput="globalSearch(this.value)">
  <button class="btn primary" onclick="quickAdd()">＋追加</button>
</div>

<div id="content"></div>

</main>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="modal">
  <div class="modalbox" id="modalContent"></div>
</div>

<script>

const KEY="nexus_2_data";

let data=JSON.parse(localStorage.getItem(KEY)||"null")||{
  tasks:[],
  notes:[],
  events:[],
  novels:[],
  games:[],
  studies:[],
  habits:[],
  activity:[],
  timerSessions:[],
  tags:[],
  xp:0,
  settings:{
    dark:false,
    sound:true
  }
};

let timer={
  seconds:25*60,
  running:false,
  interval:null,
  mode:"Pomodoro"
};

let calendarDate=new Date();

function save(){
  localStorage.setItem(KEY,JSON.stringify(data));
}

function uid(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}

function esc(s=""){
  return String(s).replace(/[&<>"']/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[m]));
}

function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;
  el.style.display="block";
  setTimeout(()=>el.style.display="none",1800);
}

function log(action){
  data.activity.unshift({
    id:uid(),
    text:action,
    date:new Date().toLocaleString("ja-JP")
  });

  data.activity=data.activity.slice(0,200);
  save();
}

function addXP(amount){
  data.xp+=amount;
  save();
}

function level(){
  return Math.floor(data.xp/100)+1;
}

function xpCurrent(){
  return data.xp%100;
}

function showPage(page,btn){
  document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
  if(btn)btn.classList.add("active");

  const titles={
    dashboard:"ダッシュボード",
    tasks:"タスク",
    notes:"ノート",
    calendar:"カレンダー",
    timer:"タイマー",
    novels:"小説",
    games:"ゲーム",
    study:"勉強",
    habits:"習慣",
    tags:"タグ",
    stats:"統計",
    activity:"活動履歴",
    settings:"設定"
  };

  document.getElementById("pageTitle").textContent=titles[page]||"NEXUS";
  render(page);
}

function render(page){
  if(page==="dashboard")dashboard();
  if(page==="tasks")tasks();
  if(page==="notes")notes();
  if(page==="calendar")calendar();
  if(page==="timer")timerPage();
  if(page==="novels")novels();
  if(page==="games")games();
  if(page==="study")study();
  if(page==="habits")habits();
  if(page==="tags")tagsPage();
  if(page==="stats")stats();
  if(page==="activity")activity();
  if(page==="settings")settingsPage();
}

function dashboard(){

  const totalTasks=data.tasks.length;
  const done=data.tasks.filter(x=>x.done).length;
  const focus=data.timerSessions.reduce((a,b)=>a+b.minutes,0);

  document.getElementById("content").innerHTML=`

  <div class="grid g4">

    <div class="card">
      <div class="muted">タスク</div>
      <div class="stat">${totalTasks}</div>
      <div class="muted">${done} 件完了</div>
    </div>

    <div class="card">
      <div class="muted">集中時間</div>
      <div class="stat">${focus}</div>
      <div class="muted">分</div>
    </div>

    <div class="card">
      <div class="muted">NEXUS LEVEL</div>
      <div class="stat">${level()}</div>
      <div class="xpbar"><i style="width:${xpCurrent()}%"></i></div>
    </div>

    <div class="card">
      <div class="muted">ノート</div>
      <div class="stat">${data.notes.length}</div>
      <div class="muted">保存済み</div>
    </div>

  </div>

  <div class="section">クイックタイマー</div>

  <div class="card">
    <div class="timer" id="dashTimer">${formatTime(timer.seconds)}</div>
    <div class="row" style="justify-content:center">
      <button class="btn primary bigbtn" onclick="startTimer()">▶ 開始</button>
      <button class="btn bigbtn" onclick="pauseTimer()">Ⅱ 一時停止</button>
      <button class="btn bigbtn" onclick="resetTimer()">↻ リセット</button>
    </div>
  </div>

  <div class="section">今日のタスク</div>

  <div class="card">
    ${data.tasks.length
      ? data.tasks.slice(0,6).map(taskHTML).join("")
      : `<div class="empty">タスクはありません</div>`
    }
  </div>

  <div class="section">NEXUS概要</div>

  <div class="grid g3">

    <div class="card">
      <b>✍️ 小説</b>
      <div class="stat">${data.novels.length}</div>
      <div class="muted">作品</div>
    </div>

    <div class="card">
      <b>🎮 ゲーム</b>
      <div class="stat">${data.games.length}</div>
      <div class="muted">登録ゲーム</div>
    </div>

    <div class="card">
      <b>🔥 習慣</b>
      <div class="stat">${data.habits.length}</div>
      <div class="muted">登録習慣</div>
    </div>

  </div>

  <div class="section">最近の活動</div>

  <div class="card">
    ${data.activity.slice(0,5).map(a=>`
      <div class="item">
        <b>${esc(a.text)}</b>
        <div class="muted">${esc(a.date)}</div>
      </div>
    `).join("")||`<div class="empty">まだ活動履歴がありません</div>`}
  </div>
  `;
}

function taskHTML(t){
  return `
  <div class="item">
    <div class="row between">
      <div class="${t.done?"done":""}">
        <b>${esc(t.title)}</b>
        ${t.priority?`<span class="tag">${esc(t.priority)}</span>`:""}
      </div>

      <div class="row">
        <button class="btn success" onclick="toggleTask('${t.id}')">
          ${t.done?"戻す":"完了"}
        </button>
        <button class="btn danger" onclick="deleteTask('${t.id}')">削除</button>
      </div>
    </div>

    ${t.due?`<div class="muted">期限：${esc(t.due)}</div>`:""}

    ${(t.tags||[]).map(x=>`<span class="tag">#${esc(x)}</span>`).join("")}
  </div>`;
}

function tasks(){

  document.getElementById("content").innerHTML=`

  <div class="card">

    <div class="section" style="margin-top:0">新しいタスク</div>

    <div class="form">

      <input id="taskTitle" placeholder="タスク名">

      <div class="grid g2">
        <input id="taskDue" type="date">
        <select id="taskPriority">
          <option value="">優先度なし</option>
          <option>高</option>
          <option>中</option>
          <option>低</option>
        </select>
      </div>

      <input id="taskTags" placeholder="タグ（カンマ区切り）">

      <button class="btn primary" onclick="addTask()">タスクを追加</button>

    </div>
  </div>

  <div class="section">タスク一覧</div>

  <div class="card">

    <div class="row">
      <button class="btn" onclick="filterTasks('all')">すべて</button>
      <button class="btn" onclick="filterTasks('open')">未完了</button>
      <button class="btn" onclick="filterTasks('done')">完了</button>
    </div>

    <div id="taskList">
      ${data.tasks.map(taskHTML).join("")||`<div class="empty">タスクなし</div>`}
    </div>

  </div>
  `;
}

function filterTasks(type){

  let arr=data.tasks;

  if(type==="open")arr=arr.filter(x=>!x.done);
  if(type==="done")arr=arr.filter(x=>x.done);

  document.getElementById("taskList").innerHTML=
    arr.map(taskHTML).join("")||`<div class="empty">該当するタスクはありません</div>`;
}

function addTask(){

  const title=document.getElementById("taskTitle").value.trim();

  if(!title){
    toast("タスク名を入力してね");
    return;
  }

  const tags=document.getElementById("taskTags").value
    .split(",")
    .map(x=>x.trim())
    .filter(Boolean);

  data.tasks.unshift({
    id:uid(),
    title,
    due:document.getElementById("taskDue").value,
    priority:document.getElementById("taskPriority").value,
    tags,
    done:false,
    created:new Date().toISOString()
  });

  tags.forEach(addTag);

  addXP(5);
  log("タスクを追加："+title);
  save();

  toast("タスクを追加しました");
  tasks();
}

function toggleTask(id){

  const t=data.tasks.find(x=>x.id===id);
  if(!t)return;

  t.done=!t.done;

  if(t.done){
    addXP(10);
    log("タスク完了："+t.title);
  }else{
    log("タスクを未完了に戻した："+t.title);
  }

  save();
  render("tasks");
}

function deleteTask(id){

  const t=data.tasks.find(x=>x.id===id);

  data.tasks=data.tasks.filter(x=>x.id!==id);

  log("タスク削除："+(t?.title||""));
  save();
  render("tasks");
}

function notes(){

  document.getElementById("content").innerHTML=`

  <div class="card">

    <div class="section" style="margin-top:0">新しいノート</div>

    <div class="form">

      <input id="noteTitle" placeholder="タイトル">

      <textarea id="noteBody" placeholder="内容"></textarea>

      <input id="noteTags" placeholder="タグ（カンマ区切り）">

      <button class="btn primary" onclick="addNote()">保存</button>

    </div>

  </div>

  <div class="section">ノート一覧</div>

  <div class="grid g2">

    ${data.notes.map(n=>`

      <div class="card">

        <div class="row between">
          <b>${esc(n.title)}</b>
          <button class="btn danger" onclick="deleteNote('${n.id}')">削除</button>
        </div>

        <p>${esc(n.body).replace(/\n/g,"<br>")}</p>

        ${(n.tags||[]).map(x=>`<span class="tag">#${esc(x)}</span>`).join("")}

        <div class="muted">${esc(n.date)}</div>

      </div>

    `).join("")||`<div class="card empty">ノートなし</div>`}

  </div>
  `;
}

function addNote(){

  const title=document.getElementById("noteTitle").value.trim();

  if(!title){
    toast("タイトルを入力してね");
    return;
  }

  const tags=document.getElementById("noteTags").value
    .split(",")
    .map(x=>x.trim())
    .filter(Boolean);

  data.notes.unshift({
    id:uid(),
    title,
    body:document.getElementById("noteBody").value,
    tags,
    date:new Date().toLocaleString("ja-JP")
  });

  tags.forEach(addTag);

  addXP(5);
  log("ノート作成："+title);
  save();

  toast("ノートを保存しました");
  notes();
}

function deleteNote(id){

  const n=data.notes.find(x=>x.id===id);

  data.notes=data.notes.filter(x=>x.id!==id);

  log("ノート削除："+(n?.title||""));
  save();

  notes();
}

function calendar(){

  const y=calendarDate.getFullYear();
  const m=calendarDate.getMonth();

  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();

  let cells="";

  for(let i=0;i<first;i++){
    cells+=`<div></div>`;
  }

  for(let d=1;d<=days;d++){

    const date=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

    const today=new Date();
    const isToday=
      today.getFullYear()===y &&
      today.getMonth()===m &&
      today.getDate()===d;

    const events=data.events.filter(e=>e.date===date);

    cells+=`

      <div class="day ${isToday?"today":""}" onclick="addEvent('${date}')">

        <b>${d}</b>

        ${events.map(e=>`
          <div class="event" title="${esc(e.title)}">
            ${esc(e.title)}
          </div>
        `).join("")}

      </div>
    `;
  }

  document.getElementById("content").innerHTML=`

    <div class="card">

      <div class="row between">

        <button class="btn" onclick="changeMonth(-1)">←</button>

        <h2>${y}年 ${m+1}月</h2>

        <button class="btn" onclick="changeMonth(1)">→</button>

      </div>

      <div class="calendar">

        ${["日","月","火","水","木","金","土"]
          .map(x=>`<div class="weekday">${x}</div>`).join("")}

        ${cells}

      </div>

      <div class="muted" style="margin-top:10px">
        日付をタップすると予定を追加できます。
      </div>

    </div>

    <div class="section">予定一覧</div>

    <div class="card">

      ${data.events.map(e=>`

        <div class="item">

          <div class="row between">

            <div>
              <b>${esc(e.title)}</b>
              <div class="muted">${esc(e.date)} ${esc(e.time||"")}</div>
            </div>

            <button class="btn danger" onclick="deleteEvent('${e.id}')">
              削除
            </button>

          </div>

        </div>

      `).join("")||`<div class="empty">予定なし</div>`}

    </div>
  `;
}

function formatTime(sec){

  const s=(sec%60).toString().padStart(2,"0");

  return `${m}:${s}`;
}

function updateTimerDisplays(){

  const text=formatTime(timer.seconds);

  const a=document.getElementById("mainTimer");
  const b=document.getElementById("dashTimer");

  if(a)a.textContent=text;
  if(b)b.textContent=text;
}

function startTimer(){

  if(timer.running)return;

  timer.running=true;

  timer.interval=setInterval(()=>{

    timer.seconds--;

    updateTimerDisplays();

    if(timer.seconds<=0){

      clearInterval(timer.interval);
      timer.running=false;

      const minutes=timer.mode==="Pomodoro"?25:1;

      data.timerSessions.unshift({
        id:uid(),
        minutes,
        date:new Date().toLocaleString("ja-JP")
      });

      addXP(minutes);
      log(`${minutes}分の集中セッション完了`);
      save();

      if(data.settings.sound){
        beep();
      }

      toast("集中セッション完了！");

      resetTimer();
      timerPage();
    }

  },1000);
}

function pauseTimer(){

  clearInterval(timer.interval);
  timer.running=false;
}

function resetTimer(){

  clearInterval(timer.interval);
  timer.running=false;

  if(timer.mode==="Pomodoro"){
    timer.seconds=25*60;
  }else{
    timer.seconds=5*60;
  }

  updateTimerDisplays();
}

function setTimer(min){

  clearInterval(timer.interval);

  timer.running=false;
  timer.seconds=min*60;
  timer.mode=min===25?"Pomodoro":"Countdown";

  updateTimerDisplays();

  if(document.getElementById("content")){
    timerPage();
  }
}

function beep(){

  try{

    const ctx=new AudioContext();

    const osc=ctx.createOscillator();
    const gain=ctx.createGain();

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.frequency.value=880;
    gain.gain.value=.1;

    osc.start();

    setTimeout(()=>{
      osc.stop();
      ctx.close();
    },300);

  }catch(e){}
}

  if(el){

  data.games.forEach(x=>{

function toggleDark(){

  data.settings.dark=!data.settings.dark;

  document.body.classList.toggle("dark",data.settings.dark);

  save();
  settingsPage();
}

function toggleSound(){

  data.settings.sound=!data.settings.sound;

  save();
  settingsPage();
}

function exportData(){

  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download="nexus-backup.json";
  a.click();

  URL.revokeObjectURL(url);

  toast("バックアップを作成しました");
}

function importData(){

  const input=document.createElement("input");

  input.type="file";
  input.accept=".json";

  input.onchange=e=>{

    const file=e.target.files[0];

    if(!file)return;

    const reader=new FileReader();

    reader.onload=()=>{

      try{

        const imported=JSON.parse(reader.result);

        if(!imported.tasks)throw Error();

        data=imported;

        save();

        location.reload();

      }catch{

        alert("正しいNEXUSバックアップではありません。");

      }

    };

    reader.readAsText(file);
  };

  input.click();
}

function clearAll(){

  if(!confirm(
    "本当にすべてのNEXUSデータを削除しますか？"
  ))return;

  localStorage.removeItem(KEY);

  location.reload();
}

function quickAdd(){

  openModal(`

    <h2>Quick Add</h2>

    <div class="grid g3">

      <button class="btn primary" onclick="quickTask()">
        ✅ タスク
      </button>

      <button class="btn" onclick="quickNote()">
        📝 ノート
      </button>

      <button class="btn" onclick="quickTimer()">
        ⏱️ タイマー
      </button>

    </div>

    <button class="btn" style="margin-top:15px;width:100%"
      onclick="closeModal()">
      キャンセル
    </button>
  `);
}

function quickTask(){

  closeModal();
  showPage("tasks",document.querySelectorAll(".nav button")[1]);

  setTimeout(()=>{
    document.getElementById("taskTitle")?.focus();
  },100);
}

function quickNote(){

  closeModal();
  showPage("notes",document.querySelectorAll(".nav button")[2]);

  setTimeout(()=>{
    document.getElementById("noteTitle")?.focus();
  },100);
}

function quickTimer(){

  closeModal();
  showPage("timer",document.querySelectorAll(".nav button")[4]);
}

function openModal(html){

  document.getElementById("modalContent").innerHTML=html;
  document.getElementById("modal").classList.add("show");
}

function closeModal(){

  document.getElementById("modal").classList.remove("show");
}

document.getElementById("modal").addEventListener("click",e=>{
  if(e.target.id==="modal")closeModal();
});

document.body.classList.toggle("dark",data.settings.dark);

render("dashboard");

</script>

</body>
</html>
