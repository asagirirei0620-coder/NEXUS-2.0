<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXUS">
<link rel="manifest" href="manifest.json">
<title>NEXUS 3.0</title>

<style>
:root{
  --bg:#0b1020;
  --panel:rgba(18,25,45,.82);
  --panel2:rgba(25,34,59,.86);
  --text:#f5f7ff;
  --muted:#8d98b5;
  --line:rgba(255,255,255,.09);
  --accent:#7c5cff;
  --accent2:#20d9ff;
  --danger:#ff5577;
  --success:#39d98a;
  --warning:#ffca5c;
  --radius:18px;
  --sidebar:260px;
  --density:1;
  --font:15px;
  --wallpaper:linear-gradient(135deg,#090b18,#141a39 45%,#38206d);
}

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  font-size:var(--font);
  color:var(--text);
  background:var(--wallpaper);
  background-attachment:fixed;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
input,textarea,select{
  width:100%;
  border:1px solid var(--line);
  background:rgba(0,0,0,.18);
  color:var(--text);
  border-radius:12px;
  padding:11px 13px;
  outline:none;
}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
button{
  border:0;
  border-radius:12px;
  padding:10px 14px;
  color:var(--text);
  background:rgba(255,255,255,.08);
}
button:hover{background:rgba(255,255,255,.13)}
.primary{background:linear-gradient(135deg,var(--accent),#9a6cff)}
.primary:hover{filter:brightness(1.1)}
.success{background:rgba(57,217,138,.18);color:#72efb1}
.danger{background:rgba(255,85,119,.16);color:#ff829b}
.warning{background:rgba(255,202,92,.15);color:#ffd878}
.icon-btn{width:42px;height:42px;padding:0;display:grid;place-items:center}
.small{font-size:12px}
.muted{color:var(--muted)}
.bold{font-weight:700}
.hidden{display:none!important}

.app{
  height:100vh;
  display:flex;
  position:relative;
  overflow:hidden;
}
.app:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:rgba(0,0,0,var(--overlay,0));
  z-index:0;
}
.app:after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  backdrop-filter:blur(var(--blur,0px));
  z-index:0;
}

.sidebar{
  width:var(--sidebar);
  min-width:var(--sidebar);
  height:100%;
  position:relative;
  z-index:10;
  display:flex;
  flex-direction:column;
  background:rgba(8,12,26,.9);
  border-right:1px solid var(--line);
  backdrop-filter:blur(22px);
}
.brand{
  height:76px;
  padding:18px 20px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--line);
}
.logo{
  width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;font-weight:900;
  box-shadow:0 8px 30px rgba(124,92,255,.35);
}
.brand-title{font-weight:900;letter-spacing:1.5px}
.brand-sub{font-size:10px;color:var(--muted);margin-top:2px}

.nav{
  flex:1;
  overflow:auto;
  padding:12px 10px 20px;
}
.nav::-webkit-scrollbar,.main::-webkit-scrollbar{width:7px}
.nav::-webkit-scrollbar-thumb,.main::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.12);border-radius:10px
}
.nav-group{
  margin:14px 7px 7px;
  color:#6e7895;
  font-size:10px;
  font-weight:800;
  letter-spacing:1.5px;
}
.nav-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 12px;
  margin:2px 0;
  color:#aeb7cf;
  background:transparent;
  text-align:left;
  border-radius:11px;
}
.nav-item:hover{background:rgba(255,255,255,.06)}
.nav-item.active{
  background:linear-gradient(90deg,rgba(124,92,255,.25),rgba(32,217,255,.06));
  color:#fff;
  box-shadow:inset 3px 0 0 var(--accent);
}
.nav-icon{width:22px;text-align:center}
.sidebar-bottom{
  border-top:1px solid var(--line);
  padding:10px;
}
.level-mini{
  padding:11px;
  border-radius:14px;
  background:rgba(255,255,255,.05);
}
.level-row{display:flex;justify-content:space-between;align-items:center}
.xpbar{
  height:6px;background:rgba(255,255,255,.08);
  border-radius:99px;overflow:hidden;margin-top:8px;
}
.xpbar>i{
  display:block;height:100%;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-radius:99px;
}

.main{
  flex:1;
  min-width:0;
  height:100%;
  overflow:auto;
  position:relative;
  z-index:1;
}
.topbar{
  position:sticky;
  top:0;
  z-index:8;
  height:70px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 20px;
  background:rgba(8,12,26,.72);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}
.top-title{font-size:20px;font-weight:800;flex:1}
.search{
  max-width:320px;
  background:rgba(255,255,255,.07);
}
.content{
  max-width:1600px;
  margin:auto;
  padding:20px;
}
.mobile-menu{display:none}

.grid{
  display:grid;
  gap:14px;
}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.auto{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:calc(16px * var(--density));
  backdrop-filter:blur(18px);
  box-shadow:0 12px 40px rgba(0,0,0,.14);
}
.card-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:13px;
}
.card-title h2,.card-title h3{margin:0}
.stat{
  min-height:130px;
}
.stat-value{font-size:30px;font-weight:900;margin:8px 0}
.stat-label{color:var(--muted);font-size:12px}
.stat-icon{font-size:25px}
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}

.list{display:flex;flex-direction:column;gap:8px}
.list-item{
  padding:11px 12px;
  border-radius:12px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.05);
}
.list-item:hover{background:rgba(255,255,255,.07)}
.row{display:flex;align-items:center;gap:9px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:4px 8px;
  border-radius:999px;
  background:rgba(255,255,255,.08);
  color:#bfc8df;
  font-size:11px;
}
.badge.accent{background:rgba(124,92,255,.2);color:#c5b7ff}
.badge.green{background:rgba(57,217,138,.14);color:#72efb1}
.badge.red{background:rgba(255,85,119,.14);color:#ff91a5}
.badge.yellow{background:rgba(255,202,92,.14);color:#ffd979}

.progress{
  height:8px;border-radius:99px;
  background:rgba(255,255,255,.08);
  overflow:hidden;
}
.progress>i{
  display:block;height:100%;
  border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
}

.section-title{
  margin:25px 0 12px;
  font-size:18px;
  font-weight:800;
}
.empty{
  text-align:center;
  padding:30px 15px;
  color:var(--muted);
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  border:1px solid var(--line);
  border-radius:15px;
  overflow:hidden;
}
.cal-head{
  padding:9px;
  text-align:center;
  background:rgba(255,255,255,.05);
  color:var(--muted);
  font-size:12px;
}
.cal-day{
  min-height:105px;
  padding:8px;
  border-top:1px solid var(--line);
  border-right:1px solid var(--line);
  background:rgba(0,0,0,.07);
}
.cal-day:nth-child(7n){border-right:0}
.cal-day.muted-day{opacity:.38}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day-num{font-weight:800;margin-bottom:6px}
.cal-event{
  font-size:10px;
  padding:4px 5px;
  margin:3px 0;
  border-radius:6px;
  background:rgba(124,92,255,.2);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.timer-display{
  font-size:72px;
  font-weight:900;
  letter-spacing:2px;
  text-align:center;
  padding:20px 0;
}
.timer-ring{
  width:280px;height:280px;border-radius:50%;
  margin:10px auto 20px;
  display:grid;place-items:center;
  background:conic-gradient(var(--accent) var(--timer-progress,0%),rgba(255,255,255,.07) 0);
  position:relative;
}
.timer-ring:after{
  content:"";position:absolute;inset:10px;
  border-radius:50%;background:#0d1428;
}
.timer-ring .timer-display{position:relative;z-index:1}

.modal-backdrop{
  position:fixed;inset:0;z-index:100;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.62);
  backdrop-filter:blur(10px);
  padding:18px;
}
.modal-backdrop.show{display:flex}
.modal{
  width:min(700px,100%);
  max-height:90vh;
  overflow:auto;
  background:#11182d;
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:0 30px 100px rgba(0,0,0,.45);
  padding:20px;
}
.modal.large{width:min(1050px,100%)}
.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:var(--muted)}
.modal-actions{
  display:flex;justify-content:flex-end;gap:8px;
  margin-top:18px;
}
.toast{
  position:fixed;right:20px;bottom:20px;z-index:300;
  padding:13px 16px;
  border-radius:13px;
  background:#151d35;
  border:1px solid var(--line);
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  transform:translateY(20px);
  opacity:0;
  pointer-events:none;
  transition:.2s;
}
.toast.show{opacity:1;transform:none}

.command{
  position:fixed;inset:0;z-index:150;
  display:none;align-items:flex-start;justify-content:center;
  padding-top:100px;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(8px);
}
.command.show{display:flex}
.command-box{
  width:min(760px,94%);
  background:#10172b;
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
}
.command-input{
  border:0;border-bottom:1px solid var(--line);
  border-radius:0;font-size:17px;padding:17px;
}
.command-results{max-height:450px;overflow:auto;padding:8px}
.command-result{
  padding:12px;
  border-radius:10px;
  cursor:pointer;
}
.command-result:hover{background:rgba(255,255,255,.07)}

.dashboard-hero{
  padding:22px;
  border-radius:22px;
  background:
    radial-gradient(circle at 80% 20%,rgba(32,217,255,.18),transparent 35%),
    radial-gradient(circle at 20% 80%,rgba(124,92,255,.22),transparent 40%),
    rgba(18,25,45,.85);
  border:1px solid var(--line);
  margin-bottom:15px;
}
.hero-title{font-size:28px;font-weight:900}
.hero-sub{color:var(--muted);margin-top:5px}

.chart{
  width:100%;
  height:230px;
  display:block;
  background:rgba(0,0,0,.12);
  border-radius:12px;
}

.timeline{
  border-left:2px solid rgba(124,92,255,.35);
  margin-left:9px;
  padding-left:15px;
}
.timeline-item{
  position:relative;
  padding-bottom:14px;
}
.timeline-item:before{
  content:"";
  width:8px;height:8px;
  border-radius:50%;
  background:var(--accent);
  position:absolute;
  left:-20px;top:5px;
}

.settings-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.wallpapers{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}
.wall{
  aspect-ratio:16/9;
  border-radius:12px;
  border:2px solid transparent;
  cursor:pointer;
}
.wall.active{border-color:white}
.wall-label{
  font-size:10px;
  text-align:center;
  margin-top:4px;
  color:var(--muted);
}

.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{
  text-align:left;
  padding:10px;
  border-bottom:1px solid var(--line);
}
th{color:var(--muted);font-size:12px}

.goal-ring{
  width:120px;height:120px;
  border-radius:50%;
  display:grid;place-items:center;
  background:conic-gradient(var(--accent) var(--p,0%),rgba(255,255,255,.08) 0);
  margin:auto;
}
.goal-ring:after{
  content:"";
  position:absolute;
}
.goal-ring-inner{
  width:94px;height:94px;border-radius:50%;
  background:#11182d;
  display:grid;place-items:center;
  font-size:21px;font-weight:900;
}

.graph-canvas{
  width:100%;
  min-height:450px;
  background:rgba(0,0,0,.12);
  border-radius:15px;
}

.lock-screen{
  position:fixed;inset:0;z-index:999;
  background:#080c18;
  display:none;
  place-items:center;
  padding:20px;
}
.lock-screen.show{display:grid}
.lock-box{
  width:min(390px,100%);
  padding:30px;
  background:#11182d;
  border:1px solid var(--line);
  border-radius:24px;
  text-align:center;
}

.overlay-preview{
  height:120px;border-radius:15px;
  background:var(--wallpaper);
  border:1px solid var(--line);
}

@media(max-width:1100px){
  .kpi-grid{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(2,1fr)}
  .settings-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:760px){
  :root{--sidebar:280px}
  .sidebar{
    position:fixed;
    left:0;top:0;bottom:0;
    transform:translateX(-100%);
    transition:.25s;
    box-shadow:20px 0 70px rgba(0,0,0,.35);
  }
  .sidebar.open{transform:none}
  .mobile-menu{display:grid}
  .topbar{padding:10px 12px}
  .top-title{font-size:17px}
  .search{display:none}
  .content{padding:12px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .calendar{font-size:11px}
  .cal-day{min-height:75px;padding:5px}
  .timer-ring{width:230px;height:230px}
  .timer-display{font-size:48px}
  .wallpapers{grid-template-columns:repeat(2,1fr)}
  .settings-grid{grid-template-columns:1fr}
}

body.light{
  --bg:#eef2fa;
  --panel:rgba(255,255,255,.84);
  --panel2:rgba(255,255,255,.95);
  --text:#172033;
  --muted:#68738a;
  --line:rgba(30,40,65,.12);
}
body.light .sidebar{background:rgba(245,247,252,.92)}
body.light .topbar{background:rgba(245,247,252,.76)}
body.light .timer-ring:after{background:#f1f4fa}
body.light .goal-ring-inner{background:#f1f4fa}
body.light .modal,.light .command-box{background:#f8f9fd}
body.light .input,body.light input,body.light textarea,body.light select{background:rgba(255,255,255,.8)}
</style>
</head>

<body>
<div class="app" id="app">

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="logo">N</div>
    <div>
      <div class="brand-title">NEXUS</div>
      <div class="brand-sub">PERSONAL OPERATING SYSTEM</div>
    </div>
  </div>

  <nav class="nav" id="nav"></nav>

  <div class="sidebar-bottom">
    <div class="level-mini">
      <div class="level-row">
        <span class="bold" id="miniLevel">Lv.1</span>
        <span class="small muted" id="miniXP">0 XP</span>
      </div>
      <div class="xpbar"><i id="miniXPBar" style="width:0%"></i></div>
    </div>
  </div>
</aside>

<main class="main" id="main">
  <header class="topbar">
    <button class="icon-btn mobile-menu" id="mobileMenu">☰</button>
    <div class="top-title" id="pageTitle">ホーム</div>
    <input class="search" id="globalSearch" placeholder="⌘K / Ctrl+K で検索">
    <button class="icon-btn" id="commandBtn">⌘</button>
    <button class="icon-btn" id="quickBtn">＋</button>
  </header>
  <div class="content" id="content"></div>
</main>
</div>

<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal"></div>
</div>

<div class="command" id="command">
  <div class="command-box">
    <input class="command-input" id="commandInput" placeholder="NEXUSに指示… 例：数学 30分 / ノート アイデア">
    <div class="command-results" id="commandResults"></div>
  </div>
</div>

<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <div class="logo" style="margin:auto">N</div>
    <h2>NEXUS LOCK</h2>
    <p class="muted">ロックを解除してください</p>
    <input id="unlockPin" type="password" inputmode="numeric" maxlength="12" placeholder="PIN">
    <button class="primary" style="width:100%;margin-top:10px" onclick="unlockApp()">解除</button>
    <div id="unlockError" class="danger small" style="margin-top:8px"></div>
  </div>
</div>

<script>
"use strict";

/* =========================================================
   NEXUS 3.0
   Local-first / PWA / Personal OS
========================================================= */

const KEY = "NEXUS_3_0_COMPLETE";
const VERSION = "3.0.0";

const now = () => new Date();
const uid = (p="id") => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = () => new Date().toISOString().slice(0,10);
const esc = s => String(s ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const fmtDate = d => d ? new Date(d).toLocaleDateString("ja-JP") : "";
const fmtDateTime = d => d ? new Date(d).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));
const pct = (n,d)=>d ? clamp(n/d*100,0,100) : 0;

const WALLPAPERS = {
  space:"radial-gradient(circle at 20% 20%,#263b80 0 3%,transparent 4%),radial-gradient(circle at 80% 30%,#7b39a8 0 2%,transparent 3%),linear-gradient(135deg,#050817,#111b43,#260e4d)",
  galaxy:"radial-gradient(circle at 70% 20%,#ff72db,transparent 20%),radial-gradient(circle at 20% 80%,#4e7cff,transparent 25%),linear-gradient(130deg,#080817,#32185f,#090b23)",
  neon:"linear-gradient(135deg,#090016,#180044 40%,#004b5d),repeating-linear-gradient(90deg,transparent 0 40px,rgba(0,255,255,.08) 41px 42px)",
  aurora:"radial-gradient(ellipse at 50% 10%,#54ffd0,transparent 30%),linear-gradient(160deg,#041622,#172b4e,#120c2f)",
  ocean:"linear-gradient(145deg,#03152a,#075878 45%,#13a4a4)",
  forest:"linear-gradient(145deg,#06130c,#123d25 45%,#277347)",
  volcano:"radial-gradient(circle at 50% 100%,#ff5b19,transparent 35%),linear-gradient(145deg,#170707,#411010,#110509)",
  sunset:"linear-gradient(180deg,#21184b,#a44c76 50%,#ff9d58)",
  sunrise:"linear-gradient(180deg,#f0a86c,#ffd48b 45%,#e9edf9)",
  rain:"repeating-linear-gradient(120deg,rgba(130,170,255,.08) 0 2px,transparent 2px 18px),linear-gradient(145deg,#07101f,#1d3556)",
  snow:"radial-gradient(circle,rgba(255,255,255,.5) 0 1px,transparent 2px),linear-gradient(145deg,#7d93ad,#dce7f4)",
  desert:"linear-gradient(150deg,#8c542e,#d69a55 55%,#e9c477)",
  night:"linear-gradient(145deg,#03050c,#0b1021,#101a3b)",

function deepClone(x){return JSON.parse(JSON.stringify(x));}

function mergeDefaults(base, data){
  const out=deepClone(base);
  for(const k in data){
    if(data[k] && typeof data[k]==="object" && !Array.isArray(data[k]) &&
       out[k] && typeof out[k]==="object" && !Array.isArray(out[k])){
      out[k]={...out[k],...data[k]};
    }else{
      out[k]=data[k];
    }
  }
  return out;
}

function loadState(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw)return deepClone(defaults);
    return mergeDefaults(defaults,JSON.parse(raw));
  }catch(e){
    console.error(e);
    return deepClone(defaults);
  }
}

function save(){
  S.system.updatedAt=new Date().toISOString();
  localStorage.setItem(KEY,JSON.stringify(S));
  updateMini();
}

function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;
  el.classList.add("show");
  clearTimeout(toast.t);
  toast.t=setTimeout(()=>el.classList.remove("show"),2300);
}

function playSound(type="done"){
  if(!S.settings.sounds)return;
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return;
    const c=new C();
    const o=c.createOscillator();
    const g=c.createGain();
    o.frequency.value=type==="achievement"?880:660;
    o.type="sine";
    g.gain.value=.05;
    o.connect(g);g.connect(c.destination);
    o.start();
    o.frequency.exponentialRampToValueAtTime(1100,c.currentTime+.18);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);
    o.stop(c.currentTime+.35);
  }catch{}
}

function notify(title,body){
  S.notifications.unshift({
    id:uid("notice"),title,body,
    date:new Date().toISOString(),read:false
  });
  S.notifications=S.notifications.slice(0,100);
  save();

  if(S.settings.notifications && "Notification" in window && Notification.permission==="granted"){
    try{new Notification(title,{body})}catch{}
  }
}

function logActivity(type,title,meta=""){
  S.activity.unshift({
    id:uid("act"),
    type,title,meta,
    date:new Date().toISOString()
  });
  S.activity=S.activity.slice(0,300);
  save();
}

function addXP(amount,reason=""){
  amount=Math.max(0,Number(amount)||0);
  S.xp+=amount;
  let gained=0;
  while(S.xp >= S.level*100){
    S.xp-=S.level*100;
    S.level++;
    gained++;
  }
  S.score += Math.round(amount);
  if(gained){
    notify("🎉 レベルアップ!",`NEXUS Lv.${S.level}になった！`);
    playSound("achievement");
  }
  if(reason)logActivity("xp",`+${amount} XP`,reason);
  checkAchievements();
  save();
}

function totalXP(){
  let total=0;
  for(let i=1;i<S.level;i++)total+=i*100;
  return total+S.xp;
}

function updateStreak(){
  const d=today();
  if(S.lastActive===d)return;
  const yesterdayDate=new Date();
  yesterdayDate.setDate(yesterdayDate.getDate()-1);
  const y=yesterdayDate.toISOString().slice(0,10);

  if(S.lastActive===y)S.streak++;
  else S.streak=1;

  S.bestStreak=Math.max(S.bestStreak,S.streak);
  S.lastActive=d;
  save();
}

function checkAchievements(){
  const unlock=(id,name,desc,xp)=>{
    if(S.achievements.some(a=>a.id===id))return;
    S.achievements.push({
      id,name,desc,xp,
      unlockedAt:new Date().toISOString()
    });
    S.score+=xp;
    notify("🏆 実績解除",`${name} — ${desc}`);
    playSound("achievement");
  };

  if(S.tasks.filter(t=>t.done).length>=1)
    unlock("first_task","はじめの一歩","タスクを1つ完了",20);

  if(S.tasks.filter(t=>t.done).length>=10)
    unlock("ten_tasks","タスクマスター","タスクを10個完了",50);

  if(S.notes.length>=10)
    unlock("ten_notes","記録者","ノートを10個作成",50);

  if(S.streak>=7)
    unlock("week_streak","継続者","7日連続で活動",100);

  if(S.studies.reduce((a,b)=>a+Number(b.minutes||0),0)>=600)
    unlock("study10","10時間","勉強時間が10時間に到達",100);

  if(S.novels.length>=1)
    unlock("writer","創作者","作品を1つ登録",30);

  if(S.goals.some(g=>Number(g.progress)>=100))
    unlock("goal_clear","目標達成","目標を1つ達成",150);
}

function setTaskFilter(x){window.taskFilter=x;render()}
function toggleTask(id){
  const t=S.tasks.find(x=>x.id===id);
  if(!t)return;
  t.done=!t.done;
  if(t.done){
    addXP(20,"タスク完了");
    updateStreak();
    logActivity("task",`タスク完了: ${t.title}`);
  }else{
    logActivity("task",`タスクを未完了に戻した: ${t.title}`);
  }
  save();render();
}
function toggleSubtask(tid,sid){
  const t=S.tasks.find(x=>x.id===tid);
  const s=t?.subtasks?.find(x=>x.id===sid);
  if(!s)return;
  s.done=!s.done;
  save();render();
}

  const first=new Date(y,m,1);

  const start=first.getDay();
  const cells=[];
  for(let i=0;i<start;i++)cells.push(null);
  for(let d=1;d<=last.getDate();d++)cells.push(new Date(y,m,d));
  while(cells.length%7)cells.push(null);

  return `

    <div class="calendar" style="margin-top:15px">
      ${["日","月","火","水","木","金","土"].map(x=>`<div class="cal-head">${x}</div>`).join("")}
      ${cells.map(d=>{
        if(!d)return `<div class="cal-day muted-day"></div>`;
        const ds=d.toISOString().slice(0,10);
        const ev=S.events.filter(e=>e.date===ds);
        const ts=S.tasks.filter(t=>t.due===ds);
        const habits=S.habits.filter(h=>h.logs?.includes(ds));
        return `
          <div class="cal-day ${ds===today()?"today":""}" onclick="openDay('${ds}')">

        return `

              <button class="${done?"success":""}" onclick="toggleHabit('${h.id}')">${done?"✓ 今日達成":"達成"}</button>
            </div>
            <p class="muted">${esc(h.description||"")}</p>

              <span>累計 ${count}日</span>
              <span>🔥 ${habitStreak(h)}日</span>
            </div>

              <button onclick="openEntityForm('habit','${h.id}')">編集</button>

            </div>
          </div>`;

    </div>

function habitStreak(h){
  let n=0;
  const logs=new Set(h.logs||[]);
  let d=new Date();
  while(logs.has(d.toISOString().slice(0,10))){
    n++;d.setDate(d.getDate()-1);
  }
  return n;
}
function toggleHabit(id){
  const h=S.habits.find(x=>x.id===id);
  if(!h)return;
  h.logs=h.logs||[];
  const d=today();
  if(h.logs.includes(d)){
    h.logs=h.logs.filter(x=>x!==d);
  }else{
    h.logs.push(d);
    addXP(15,"習慣達成");
    updateStreak();
    logActivity("habit",`習慣達成: ${h.title}`);
  }
  save();render();
}

function timerText(){
  let seconds=Number(S.timer.remaining||0);
  if(S.timer.running){
    if(S.timer.mode==="countdown"||S.timer.mode==="pomodoro"){
      seconds=Math.max(0,Math.ceil((S.timer.endAt-Date.now())/1000));
    }else if(S.timer.mode==="stopwatch"){
      seconds=Math.max(0,Math.floor((Date.now()-S.timer.stopwatchStarted)/1000));
    }
  }
  const h=Math.floor(seconds/3600);
  const m=Math.floor(seconds%3600/60);
  const s=seconds%60;
  return h>0
    ? `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`
    : `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function timerLabel(){
  if(S.timer.linkType && S.timer.linkId){
    const map={
      task:S.tasks.find(x=>x.id===S.timer.linkId),
      note:S.notes.find(x=>x.id===S.timer.linkId),
      novel:S.novels.find(x=>x.id===S.timer.linkId),
      game:S.games.find(x=>x.id===S.timer.linkId),
      study:S.studies.find(x=>x.id===S.timer.linkId)
    };
    return map[S.timer.linkType]?.title || S.timer.title || "リンクなし";
  }
  return S.timer.title||"リンクなし";
}

function setTimerMode(mode){
  if(S.timer.running)return;
  S.timer.mode=mode;
  if(mode==="stopwatch")S.timer.remaining=0;
  save();render();
}
function setTimerMinutes(m){
  if(S.timer.running)return;
  S.timer.total=m*60;
  S.timer.remaining=S.timer.total;
  save();render();
}
function applyTimerSettings(){
  if(S.timer.running)return;
  const h=Number(document.getElementById("timerH").value||0);
  const m=Number(document.getElementById("timerM").value||0);
  const s=Number(document.getElementById("timerS").value||0);
  S.timer.total=Math.max(1,h*3600+m*60+s);
  S.timer.remaining=S.timer.total;
  S.timer.title=document.getElementById("timerTitle").value.trim();
  const link=document.getElementById("timerLink").value;
  if(link){
    [S.timer.linkType,S.timer.linkId]=link.split(":");
  }else{
    S.timer.linkType="";S.timer.linkId="";
  }
  save();render();toast("タイマー設定を保存しました");
}
function timerLinkChange(v){
  if(!v){S.timer.linkType="";S.timer.linkId="";return}
  [S.timer.linkType,S.timer.linkId]=v.split(":");
  save();
}
function toggleTimer(){
  if(S.timer.running){
    pauseTimer();
  }else{
    startTimer();
  }
}
function startTimer(){
  if(S.timer.mode==="stopwatch"){
    S.timer.stopwatchStarted=Date.now()-((S.timer.remaining||0)*1000);
  }else{
    const remain=Math.max(1,Number(S.timer.remaining||S.timer.total));
    S.timer.endAt=Date.now()+remain*1000;
  }
  S.timer.running=true;
  updateStreak();
  save();
  startTimerLoop();
  toast("タイマー開始");
}
function pauseTimer(){
  if(!S.timer.running)return;
  if(S.timer.mode==="stopwatch"){
    S.timer.remaining=Math.floor((Date.now()-S.timer.stopwatchStarted)/1000);
  }else{
    S.timer.remaining=Math.max(0,Math.ceil((S.timer.endAt-Date.now())/1000));
  }
  S.timer.running=false;
  S.timer.endAt=null;
  S.timer.stopwatchStarted=null;
  save();
  stopTimerLoop();
  render();
}
function resetTimer(){
  S.timer.running=false;
  S.timer.endAt=null;
  S.timer.stopwatchStarted=null;
  S.timer.remaining=S.timer.mode==="stopwatch"?0:S.timer.total;
  save();render();
}
function stopStopwatch(){
  if(S.timer.mode!=="stopwatch")return;
  S.timer.remaining=Math.floor((Date.now()-S.timer.stopwatchStarted)/1000);
  completeTimer(S.timer.remaining);
}
function startTimerLoop(){
  clearInterval(timerInterval);
  timerInterval=setInterval(tickTimer,250);
}
function stopTimerLoop(){
  clearInterval(timerInterval);
  timerInterval=null;
}
function tickTimer(){
  if(!S.timer.running)return;
  let elapsed;
  if(S.timer.mode==="stopwatch"){
    elapsed=Math.floor((Date.now()-S.timer.stopwatchStarted)/1000);
    S.timer.remaining=elapsed;
  }else{
    S.timer.remaining=Math.max(0,Math.ceil((S.timer.endAt-Date.now())/1000));
    elapsed=S.timer.total-S.timer.remaining;
  }

  updateTimerUI();

  if((S.timer.mode==="countdown"||S.timer.mode==="pomodoro")&&S.timer.remaining<=0){
    completeTimer(elapsed);
  }
}
function completeTimer(seconds){
  seconds=Math.max(0,Math.floor(seconds||0));
  if(seconds>0){
    S.timer.sessions.unshift({
      id:uid("session"),
      title:S.timer.title||timerLabel(),
      seconds,
      date:new Date().toISOString(),
      linkType:S.timer.linkType,
      linkId:S.timer.linkId
    });
    S.timer.sessions=S.timer.sessions.slice(0,200);

    if(S.timer.linkType==="novel"){
      const n=S.novels.find(x=>x.id===S.timer.linkId);
      if(n)n.writingMinutes=Number(n.writingMinutes||0)+Math.round(seconds/60);
    }
    if(S.timer.linkType==="game"){
      const g=S.games.find(x=>x.id===S.timer.linkId);
      if(g)g.playMinutes=Number(g.playMinutes||0)+Math.round(seconds/60);
    }

    addXP(Math.max(1,Math.floor(seconds/60)),"集中時間");
    logActivity("timer",`タイマー完了: ${S.timer.title||"集中セッション"}`,`${Math.round(seconds/60)}分`);
  }

  S.timer.running=false;
  S.timer.endAt=null;
  S.timer.stopwatchStarted=null;

  if(S.timer.mode==="pomodoro"){
    notify("🍅 ポモドーロ完了","集中セッションが終了しました。");
  }else{
    notify("⏱ タイマー完了",S.timer.title||"タイマーが終了しました。");
  }
  playSound("done");

  if(S.timer.mode==="stopwatch")S.timer.remaining=0;
  else S.timer.remaining=S.timer.total;

  save();
  stopTimerLoop();
  if(route==="timer")render();
}
function timerQuickStart(min){
  if(S.timer.running)return;
  S.timer.mode="countdown";
  S.timer.total=min*60;
  S.timer.remaining=S.timer.total;
  startTimer();
  if(route==="home")render();
}
function startLinkedTimer(type,id){
  const item=type==="task"?S.tasks.find(x=>x.id===id):
             type==="note"?S.notes.find(x=>x.id===id):
             type==="novel"?S.novels.find(x=>x.id===id):
             type==="game"?S.games.find(x=>x.id===id):
             S.studies.find(x=>x.id===id);
  if(!item)return;
  S.timer.linkType=type;
  S.timer.linkId=id;
  S.timer.title=item.title||"";
  if(!S.timer.running){
    if(!S.timer.total)S.timer.total=25*60;
    S.timer.remaining=S.timer.total;
    S.timer.mode="countdown";
    startTimer();
  }
  go("timer");
}
function updateTimerUI(){
  const d=document.getElementById("timerDisplay");
  if(d)d.textContent=timerText();
  const h=document.getElementById("homeTimer");
  if(h)h.textContent=timerText();
  const ring=document.getElementById("timerRing");
  if(ring){
    const p=S.timer.mode==="stopwatch"
      ? Math.min(100,(S.timer.remaining%3600)/3600*100)
      : pct(S.timer.total-S.timer.remaining,S.timer.total);
    ring.style.setProperty("--timer-progress",p+"%");
  }
}

function entityIcon(t){
  return ({task:"✓",note:"✎",novel:"📖",game:"🎮",goal:"◎",project:"▣",event:"📅",study:"📚",habit:"🔥"}[t]||"•");
}
function findEntity(type,id){
  const map={task:S.tasks,note:S.notes,novel:S.novels,game:S.games,goal:S.goals,project:S.projects,event:S.events,study:S.studies,habit:S.habits};
  return map[type]?.find(x=>x.id===id);
}
function showRelated(type,id){
  const rel=S.links.filter(l=>
    (l.fromType===type&&l.fromId===id)||(l.toType===type&&l.toId===id)
  );
  const e=findEntity(type,id);
  showModal(`
    <div class="between"><h2>${entityIcon(type)} ${esc(e?.title||"")}</h2><button onclick="closeModal()">閉じる</button></div>
    <h3>関連データ</h3>
    <div class="list">
      ${rel.map(l=>{
        const other=l.fromType===type&&l.fromId===id
          ?findEntity(l.toType,l.toId)
          :findEntity(l.fromType,l.fromId);
        const ot=l.fromType===type&&l.fromId===id?l.toType:l.fromType;
        return `<div class="list-item">${entityIcon(ot)} ${esc(other?.title||"不明")}${l.note?`<div class="muted small">${esc(l.note)}</div>`:""}</div>`;
      }).join("")||`<div class="empty">関連データなし</div>`}
    </div>
  `);
}

function drawAnalyticsChart(){
  const c=document.getElementById("analyticsCanvas");
  if(!c)return;
  const dpr=devicePixelRatio||1;
  const rect=c.getBoundingClientRect();
  c.width=rect.width*dpr;c.height=rect.height*dpr;
  const ctx=c.getContext("2d");
  ctx.scale(dpr,dpr);
  const w=rect.width,h=rect.height;

  const days=[];
  for(let i=13;i>=0;i--){
    const d=new Date();
    d.setDate(d.getDate()-i);
    days.push(d.toISOString().slice(0,10));
  }
  const vals=days.map(day=>S.studies.filter(x=>x.date===day).reduce((a,b)=>a+Number(b.minutes||0),0));
  const max=Math.max(30,...vals);

  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle="rgba(255,255,255,.08)";
  ctx.fillStyle="rgba(255,255,255,.55)";
  ctx.font="11px sans-serif";

  for(let i=0;i<5;i++){
    const y=20+i*(h-45)/4;
    ctx.beginPath();ctx.moveTo(35,y);ctx.lineTo(w-15,y);ctx.stroke();
  }

  ctx.beginPath();
  vals.forEach((v,i)=>{
    const x=35+i*(w-55)/(vals.length-1);
    const y=h-30-(v/max)*(h-55);
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue("--accent");
  ctx.lineWidth=3;
  ctx.stroke();

  vals.forEach((v,i)=>{
    const x=35+i*(w-55)/(vals.length-1);
    const y=h-30-(v/max)*(h-55);
    ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);
    ctx.fillStyle=getComputedStyle(document.body).getPropertyValue("--accent");
    ctx.fill();
    if(i%2===0){
      ctx.fillStyle="rgba(255,255,255,.5)";
      ctx.fillText(days[i].slice(5),x-13,h-8);
    }
  });
}

   GRAPH
========================================================= */

function viewGraph(){
  return `
    <div class="card">
      <div class="card-title">
        <div><h2>NEXUS GRAPH</h2><div class="muted small">NEXUS内のデータ接続を可視化</div></div>
        <button onclick="drawGraph()">再描画</button>
      </div>
      <canvas id="graphCanvas" class="graph-canvas"></canvas>
    </div>
  `;
}

function drawGraph(){
  const c=document.getElementById("graphCanvas");
  if(!c)return;
  const rect=c.getBoundingClientRect();
  const dpr=devicePixelRatio||1;
  c.width=rect.width*dpr;c.height=450*dpr;
  const ctx=c.getContext("2d");
  ctx.scale(dpr,dpr);

  const nodes=[
    ...S.tasks.slice(0,8).map(x=>({id:"task:"+x.id,name:x.title,type:"task"})),
    ...S.notes.slice(0,5).map(x=>({id:"note:"+x.id,name:x.title,type:"note"})),
    ...S.novels.slice(0,5).map(x=>({id:"novel:"+x.id,name:x.title,type:"novel"})),
    ...S.games.slice(0,5).map(x=>({id:"game:"+x.id,name:x.title,type:"game"})),
    ...S.goals.slice(0,4).map(x=>({id:"goal:"+x.id,name:x.title,type:"goal"}))
  ];
  const links=S.links;

  ctx.clearRect(0,0,rect.width,450);
  const cx=rect.width/2,cy=225;
  const center={x:cx,y:cy,name:"NEXUS",type:"center"};

  const positions=new Map();
  nodes.forEach((n,i)=>{
    const a=i/nodes.length*Math.PI*2;
    const r=Math.min(rect.width,450)*.34;
    positions.set(n.id,{x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r});
  });

  ctx.lineWidth=1;
  links.forEach(l=>{
    const a=positions.get(l.fromType+":"+l.fromId);
    const b=positions.get(l.toType+":"+l.toId);
    if(a&&b){
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
      ctx.strokeStyle="rgba(124,92,255,.35)";ctx.stroke();
    }
  });

  nodes.forEach(n=>{
    const p=positions.get(n.id);
    if(!p)return;
    ctx.beginPath();ctx.arc(p.x,p.y,25,0,Math.PI*2);
    ctx.fillStyle="rgba(255,255,255,.07)";ctx.fill();
    ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue("--accent");
    ctx.stroke();
    ctx.fillStyle="#fff";
    ctx.font="11px sans-serif";
    ctx.textAlign="center";
    ctx.fillText(n.name.slice(0,13),p.x,p.y+4);
  });

  ctx.beginPath();ctx.arc(cx,cy,45,0,Math.PI*2);
  ctx.fillStyle=getComputedStyle(document.body).getPropertyValue("--accent");
  ctx.fill();
  ctx.fillStyle="#fff";
  ctx.font="bold 16px sans-serif";
  ctx.textAlign="center";
  ctx.fillText("NEXUS",cx,cy+5);
}

            </div>
          </div>
        `).join("")||`<div class="empty">ゴミ箱は空です。</div>`}
      </div>
    </div>
  `;
}
function moveTrash(collection,id){
  const arr=S[collection];
  if(!Array.isArray(arr))return;
  const idx=arr.findIndex(x=>x.id===id);
  if(idx<0)return;
  const item=arr.splice(idx,1)[0];
  S.trash.unshift({
    id:uid("trash"),
    collection,
    originalId:item.id,
    item,
    title:item.title||item.name||"データ",
    deletedAt:new Date().toISOString()
  });
  save();render();
}
function restoreTrash(id){
  const x=S.trash.find(t=>t.id===id);
  if(!x)return;
  S[x.collection]=S[x.collection]||[];
  S[x.collection].push(x.item);
  S.trash=S.trash.filter(t=>t.id!==id);
  save();render();
}
function deleteTrash(id){
  S.trash=S.trash.filter(x=>x.id!==id);
  save();render();
}
function emptyTrash(){
  if(!confirm("ゴミ箱を完全に空にしますか？"))return;
  S.trash=[];save();render();
}

    ["今日のジャーナル","journal"],
    ["NEXUS統計","analytics"],
    ["設定","settings"]
  ];
  const filtered=commands.filter(x=>!q||x[0].includes(q));
  results.innerHTML=filtered.map(x=>`
    <div class="command-result" onclick="executeCommand('${x[1]}')">${esc(x[0])}</div>
  `).join("")||`<div class="empty">コマンドがありません。</div>`;
}
function executeCommand(cmd){
  closeCommand();
  if(cmd==="timer"){go("timer");return}
  openEntityForm(cmd);
}
function parseFreeCommand(text){
  text=text.trim();
  if(!text)return;
  S.settings.commandHistory.unshift(text);
  S.settings.commandHistory=S.settings.commandHistory.slice(0,50);

  const timerMatch=text.match(/(.+?)\s+(\d+)\s*(秒|分|時間|h|m|s)$/i);
  if(timerMatch){
    const title=timerMatch[1];
    const n=Number(timerMatch[2]);
    const unit=timerMatch[3];
    const sec=unit==="時間"||unit.toLowerCase()==="h"?n*3600:
              unit==="分"||unit.toLowerCase()==="m"?n*60:n;
    S.timer.mode="countdown";
    S.timer.total=sec;
    S.timer.remaining=sec;
    S.timer.title=title;
    S.timer.linkType="";
    S.timer.linkId="";
    save();
    closeCommand();
    startTimer();
    go("timer");
    return;
  }

  if(text.startsWith("タスク ")){
    closeCommand();
    openEntityForm("task",null,null,{title:text.slice(3)});
    return;
  }
  if(text.startsWith("ノート ")){
    closeCommand();
    openEntityForm("note",null,null,{title:text.slice(3)});
    return;
  }

  const q=text.toLowerCase();
  closeCommand();
  globalSearch(q);
}

function getFormData(type,id){
  const map={
    task:S.tasks,note:S.notes,event:S.events,novel:S.novels,game:S.games,
    study:S.studies,habit:S.habits,goal:S.goals,project:S.projects,
    workflow:S.workflows,journal:S.journal,template:S.templates,
    link:S.links,database:S.databases,reminder:S.reminders
  };
  return map[type]?.find(x=>x.id===id)||{};
}

function entityOptions(selectedType,selectedId){
  const groups=[
    ["task","タスク",S.tasks],
    ["note","ノート",S.notes],
    ["novel","小説",S.novels],
    ["game","ゲーム",S.games],
    ["goal","目標",S.goals],
    ["project","プロジェクト",S.projects],
    ["event","予定",S.events],
    ["study","勉強",S.studies],
    ["habit","習慣",S.habits]
  ];
  return groups.map(([t,label,arr])=>`
    <optgroup label="${label}">
      ${arr.map(x=>`
        <option value="${t}:${x.id}" ${selectedType===t&&selectedId===x.id?"selected":""}>${esc(x.title||x.subject||x.name||x.date)}</option>
      `).join("")}
    </optgroup>
  `).join("");
}

function saveEntity(type,id){
  const existing=id?getFormData(type,id):null;
  const obj=existing||{id:uid(type),createdAt:new Date().toISOString()};

  if(type==="task"){
    obj.title=document.getElementById("fTitle").value.trim();
    if(!obj.title)return;
    obj.due=document.getElementById("fDue").value;
    obj.priority=document.getElementById("fPriority").value;
    obj.tags=document.getElementById("fTags").value.split(",").map(x=>x.trim()).filter(Boolean);
    obj.projectId=document.getElementById("fProject").value;
    obj.repeat=document.getElementById("fRepeat").value;
    obj.description=document.getElementById("fDescription").value;
    const old=obj.subtasks||[];
    obj.subtasks=document.getElementById("fSubtasks").value.split("\n").map(x=>x.trim()).filter(Boolean).map((title,i)=>({
      id:old[i]?.id||uid("sub"),title,done:old[i]?.done||false
    }));
    if(!existing)S.tasks.unshift(obj);
  }

  if(type==="note"){
    obj.title=document.getElementById("fTitle").value.trim();
    obj.tags=document.getElementById("fTags").value.split(",").map(x=>x.trim()).filter(Boolean);
    obj.projectId=document.getElementById("fProject").value;
    obj.content=document.getElementById("fContent").value;
    obj.pinned=document.getElementById("fPinned").checked;
    obj.updatedAt=new Date().toISOString();
    if(!existing)S.notes.unshift(obj);
  }

  if(type==="event"){
    obj.title=document.getElementById("fTitle").value.trim();
    obj.date=document.getElementById("fDate").value;
    obj.start=document.getElementById("fStart").value;
    obj.end=document.getElementById("fEnd").value;
    obj.place=document.getElementById("fPlace").value;
    obj.repeat=document.getElementById("fRepeat").value;
    obj.description=document.getElementById("fDescription").value;
    if(!existing)S.events.unshift(obj);
  }

  if(type==="novel"){
    obj.title=document.getElementById("fTitle").value.trim();
    obj.genre=document.getElementById("fGenre").value;
    obj.status=document.getElementById("fStatus").value;
    obj.platform=document.getElementById("fPlatform").value;
    obj.pv=Number(document.getElementById("fPV").value||0);
    obj.todayWords=Number(document.getElementById("fTodayWords").value||0);
    obj.synopsis=document.getElementById("fSynopsis").value;
    obj.episodes=obj.episodes||[];
    obj.wordCount=obj.episodes.reduce((a,b)=>a+Number(b.words||0),0);
    obj.writingMinutes=Number(obj.writingMinutes||0);
    if(!existing)S.novels.unshift(obj);
  }

  if(type==="game"){
    obj.title=document.getElementById("fTitle").value.trim();
    obj.platform=document.getElementById("fPlatform").value;
    obj.level=document.getElementById("fLevel").value;
    obj.score=document.getElementById("fScore").value;
    obj.rank=document.getElementById("fRank").value;
    obj.currency=document.getElementById("fCurrency").value;
    obj.note=document.getElementById("fNote").value;
    obj.playMinutes=Number(obj.playMinutes||0);
    obj.achievements=obj.achievements||[];
    if(!existing)S.games.unshift(obj);
  }

  if(type==="study"){
    obj.subject=document.getElementById("fSubject").value.trim();
    obj.date=document.getElementById("fDate").value;
    obj.material=document.getElementById("fMaterial").value;
    obj.minutes=Number(document.getElementById("fMinutes").value||0);
    obj.range=document.getElementById("fRange").value;
    obj.score=document.getElementById("fScore").value;
    obj.note=document.getElementById("fNote").value;
    if(!existing){
      S.studies.unshift(obj);
      addXP(Math.max(1,Math.floor(obj.minutes)),"勉強記録");
      updateStreak();
    }
  }

  if(type==="habit"){
    obj.title=document.getElementById("fTitle").value.trim();
    obj.time=document.getElementById("fTime").value;
    obj.description=document.getElementById("fDescription").value;
    obj.logs=obj.logs||[];
    if(!existing)S.habits.unshift(obj);
  }

  if(type==="goal"){
    obj.title=document.getElementById("fTitle").value.trim();
    obj.deadline=document.getElementById("fDeadline").value;
    obj.progress=clamp(Number(document.getElementById("fProgress").value||0),0,100);
    obj.description=document.getElementById("fDescription").value;
    if(!existing)S.goals.unshift(obj);
  }

  if(type==="project"){
    obj.title=document.getElementById("fTitle").value.trim();
    obj.deadline=document.getElementById("fDeadline").value;
    obj.description=document.getElementById("fDescription").value;
    if(!existing)S.projects.unshift(obj);
  }

  if(type==="workflow"){
    obj.title=document.getElementById("fTitle").value.trim();
    obj.description=document.getElementById("fDescription").value;
    obj.steps=obj.steps||[];
    if(!existing)S.workflows.unshift(obj);
  }

  if(type==="journal"){
    obj.title=document.getElementById("fTitle").value.trim();
    obj.date=document.getElementById("fDate").value;
    obj.mood=document.getElementById("fMood").value;
    obj.rating=Number(document.getElementById("fRating").value||5);
    obj.content=document.getElementById("fContent").value;
    if(!existing)S.journal.unshift(obj);
  }

  if(type==="template"){
    obj.title=document.getElementById("fTitle").value.trim();
    obj.type=document.getElementById("fType").value;
    obj.content=document.getElementById("fContent").value;
    if(!existing)S.templates.unshift(obj);
  }

  if(type==="link"){
    const f=document.getElementById("fFrom").value.split(":");
    const t=document.getElementById("fTo").value.split(":");
    obj.fromType=f[0];obj.fromId=f.slice(1).join(":");
    obj.toType=t[0];obj.toId=t.slice(1).join(":");
    obj.note=document.getElementById("fNote").value;
    if(!existing)S.links.unshift(obj);
  }

  if(type==="database"){
    obj.title=document.getElementById("fTitle").value.trim();
    obj.description=document.getElementById("fDescription").value;
    const old=obj.fields||[];
    obj.fields=document.getElementById("fFields").value.split("\n").map(x=>x.trim()).filter(Boolean).map((name,i)=>({
      id:old[i]?.id||uid("field"),name
    }));
    if(!existing)S.databases.unshift(obj);
  }

  if(type==="reminder"){
    obj.title=document.getElementById("fTitle").value.trim();
    obj.date=document.getElementById("fDate").value;
    obj.time=document.getElementById("fTime").value;
    obj.description=document.getElementById("fDescription").value;
    if(!existing)S.reminders.unshift(obj);
  }

  logActivity("create",`${existing?"更新":"作成"}: ${obj.title||obj.subject||type}`);
  save();
  closeModal();
  render();
}

function globalSearch(q){
  q=(q||"").trim().toLowerCase();
  if(!q)return;
  const data=[
    ...S.tasks.map(x=>({type:"タスク",title:x.title,route:"tasks",id:x.id})),
    ...S.notes.map(x=>({type:"ノート",title:x.title,route:"notes",id:x.id})),
    ...S.novels.map(x=>({type:"小説",title:x.title,route:"novels",id:x.id})),
    ...S.games.map(x=>({type:"ゲーム",title:x.title,route:"games",id:x.id})),
    ...S.goals.map(x=>({type:"目標",title:x.title,route:"goals",id:x.id})),
    ...S.projects.map(x=>({type:"プロジェクト",title:x.title,route:"projects",id:x.id})),
    ...S.habits.map(x=>({type:"習慣",title:x.title,route:"habits",id:x.id}))
  ].filter(x=>x.title?.toLowerCase().includes(q));

  showModal(`
    <div class="between"><h2>検索結果</h2><button onclick="closeModal()">閉じる</button></div>
    <div class="list">
      ${data.map(x=>`
        <button class="list-item" style="text-align:left" onclick="closeModal();go('${x.route}')">
          <span class="badge">${x.type}</span> <b>${esc(x.title)}</b>
        </button>
      `).join("")||`<div class="empty">見つかりませんでした。</div>`}
    </div>
  `);
}

function downloadBlob(name,text,type="application/json"){
  const blob=new Blob([text],{type});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportJSON(){
  downloadBlob(`NEXUS_backup_${today()}.json`,JSON.stringify(S,null,2));
  toast("バックアップを書き出しました");
}
function importJSON(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const imported=JSON.parse(r.result);
      if(!imported.version&&!imported.tasks)throw new Error("invalid");
      S=mergeDefaults(defaults,imported);
      save();render();
      toast("バックアップを復元しました");
    }catch{
      toast("復元に失敗しました");
    }
  };
  r.readAsText(file);
}
function exportCSV(){
  const rows=[["type","title","date","value"]];
  S.tasks.forEach(x=>rows.push(["task",x.title,x.due,x.done?"done":"todo"]));
  S.studies.forEach(x=>rows.push(["study",x.subject,x.date,x.minutes]));
  S.novels.forEach(x=>rows.push(["novel",x.title,"",x.pv]));
  const csv=rows.map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\n");
  downloadBlob(`NEXUS_data_${today()}.csv`,csv,"text/csv");
}

  const pin=prompt("4〜12桁のPIN");
  if(!pin||pin.length<4)return;
  S.settings.pin=hashPIN(pin);
  S.settings.autoLock=true;
  save();toast("PINを設定しました");
}
function removePIN(){
  S.settings.pin="";
  S.settings.autoLock=false;
  save();toast("PINロックを解除しました");
}
function checkPin(){
  if(!S.settings.autoLock||!S.settings.pin)return;
  document.getElementById("lockScreen").classList.add("show");
}
function unlockApp(){
  const pin=document.getElementById("unlockPin").value;
  if(hashPIN(pin)===S.settings.pin){
    document.getElementById("lockScreen").classList.remove("show");
    document.getElementById("unlockError").textContent="";
  }else{
    document.getElementById("unlockError").textContent="PINが違います";
  }
}

function countAllData(){
  return [
    "tasks","notes","events","novels","games","studies","habits","goals",
    "projects","workflows","databases","dbRecords","links","activity",
    "journal","trash","reminders","notifications","templates","files"
  ].reduce((a,k)=>a+(S[k]?.length||0),0);
}
function resetAll(){
  if(!confirm("NEXUSの全データを削除します。本当に初期化しますか？"))return;
  if(!confirm("バックアップなしでは復元できません。本当に削除しますか？"))return;
  localStorage.removeItem(KEY);
  location.reload();
}

/* =========================================================
   REMINDER ENGINE
========================================================= */

function checkReminders(){
  const nowD=new Date();
  const date=nowD.toISOString().slice(0,10);
  const time=nowD.toTimeString().slice(0,5);

  S.reminders.forEach(r=>{
    if(r.date===date&&r.time===time&&!r.notified){
      r.notified=true;
      notify("🔔 "+r.title,r.description||"リマインダー");
      playSound("done");
    }
  });

  S.tasks.filter(t=>!t.done&&t.due===date).forEach(t=>{
    const key="task_"+t.id+"_"+date;
    if(!sessionStorage.getItem(key)){
      sessionStorage.setItem(key,"1");
      notify("📌 今日が期限",t.title);
    }
  });

  S.habits.filter(h=>h.time===time&&!h.logs?.includes(date)).forEach(h=>{
    const key="habit_"+h.id+"_"+date;
    if(!sessionStorage.getItem(key)){
      sessionStorage.setItem(key,"1");
      notify("🔥 習慣リマインド",h.title);
    }
  });

  save();
}
function startReminderLoop(){
  clearInterval(reminderInterval);
  reminderInterval=setInterval(checkReminders,30000);
  checkReminders();
}

/* =========================================================
   MOBILE / KEYBOARD / SEARCH
========================================================= */

document.getElementById("mobileMenu").addEventListener("click",()=>{
  document.getElementById("sidebar").classList.toggle("open");
});

document.getElementById("quickBtn").addEventListener("click",openQuick);
document.getElementById("commandBtn").addEventListener("click",openCommand);

document.getElementById("globalSearch").addEventListener("keydown",e=>{
  if(e.key==="Enter")globalSearch(e.target.value);
});

document.getElementById("command").addEventListener("click",e=>{
  if(e.target.id==="command")closeCommand();
});

document.getElementById("commandInput").addEventListener("input",e=>{
  renderCommandResults(e.target.value.trim());
});

document.getElementById("commandInput").addEventListener("keydown",e=>{
  if(e.key==="Escape")closeCommand();
  if(e.key==="Enter")parseFreeCommand(e.target.value);
});

document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){
    e.preventDefault();
    openCommand();
  }
  if(e.key==="Escape"){
    closeCommand();
    closeModal();
  }
});

window.addEventListener("hashchange",()=>{
  route=location.hash.replace("#/","")||"home";
  render();
});

window.addEventListener("beforeunload",()=>{
  if(S.timer.running)save();
});

/* =========================================================
   DAILY WALLPAPER
========================================================= */

function applyDailyWallpaper(){
  if(!S.settings.dailyWall)return;
  const keys=Object.keys(WALLPAPERS);
  const index=Math.floor(Date.now()/86400000)%keys.length;
  S.settings.wall=keys[index];
  S.settings.customWall="";
  save();
}

   INITIALIZATION
========================================================= */

applyDailyWallpaper();
applySettings();
render();
startReminderLoop();
checkPin();
