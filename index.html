<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NEXUS 2.0</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --accent:#7c3aed;--accent2:#06b6d4;--bg:#080b12;--panel:rgba(17,24,39,.82);
  --panel2:rgba(255,255,255,.055);--text:#f8fafc;--muted:#94a3b8;--border:rgba(255,255,255,.09);
  --danger:#ef4444;--success:#22c55e;--warning:#f59e0b;--radius:18px;
  --sidebar:245px;--blur:18px;--overlay:.28;--density:1;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--text);background:#080b12}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:inherit}
body:before{
  content:"";position:fixed;inset:0;z-index:-4;background:var(--wallpaper,#101827) center/cover fixed no-repeat;
}
body:after{
  content:"";position:fixed;inset:0;z-index:-3;background:rgba(0,0,0,var(--overlay));
  pointer-events:none;
}
#app{height:100%;display:flex;position:relative}
.sidebar{
  width:var(--sidebar);height:100%;flex:none;background:rgba(7,11,19,.82);
  backdrop-filter:blur(var(--blur));border-right:1px solid var(--border);
  display:flex;flex-direction:column;z-index:20;overflow:hidden;
}
.brand{height:76px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--border);flex:none}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900;font-size:19px;box-shadow:0 8px 30px rgba(124,58,237,.35)}
.brand-text{margin-left:11px}.brand-text b{font-size:17px;display:block}.brand-text span{font-size:10px;color:var(--muted);letter-spacing:2px}
.nav{flex:1;overflow:auto;padding:10px 9px}
.nav-section{font-size:10px;color:#64748b;letter-spacing:1.5px;padding:13px 10px 6px;font-weight:800}
.nav button{
  width:100%;border:0;background:transparent;border-radius:11px;padding:10px 12px;margin:2px 0;
  display:flex;align-items:center;gap:11px;text-align:left;color:#aeb9c9;transition:.16s;
}
.nav button:hover{background:var(--panel2);color:white}
.nav button.active{background:linear-gradient(90deg,rgba(124,58,237,.24),rgba(6,182,212,.08));color:white;box-shadow:inset 3px 0 var(--accent)}
.nav .ico{width:20px;text-align:center;font-size:16px}.nav-label{flex:1}.nav-badge{font-size:10px;background:var(--accent);padding:2px 7px;border-radius:10px}
.side-bottom{padding:10px;border-top:1px solid var(--border);flex:none}
.user-mini{display:flex;align-items:center;gap:10px;padding:8px}.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800}
.main{min-width:0;flex:1;height:100%;overflow:auto;scroll-behavior:smooth}
.topbar{height:70px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--border);background:rgba(8,11,18,.52);backdrop-filter:blur(var(--blur));position:sticky;top:0;z-index:15}
.mobile-menu{display:none}
.search{max-width:430px;flex:1;position:relative}.search input{width:100%;height:42px;padding:0 14px 0 40px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:white;outline:none}.search span{position:absolute;left:14px;top:10px}
.top-actions{margin-left:auto;display:flex;gap:8px}.icon-btn,.btn{
  border:1px solid var(--border);background:rgba(255,255,255,.055);border-radius:11px;min-height:40px;padding:0 13px;color:#dbe4ef;
}
.icon-btn{width:40px;padding:0;display:grid;place-items:center}.btn:hover,.icon-btn:hover{background:rgba(255,255,255,.1)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#5b21b6);border:0}.btn.success{background:#15803d;border:0}.btn.danger{background:#991b1b;border:0}
.page{padding:24px;max-width:1500px;margin:auto}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}
.page-title{font-size:28px;font-weight:850;letter-spacing:-.5px}.page-sub{color:var(--muted);font-size:13px;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{
  background:var(--panel);backdrop-filter:blur(var(--blur));border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;box-shadow:0 10px 35px rgba(0,0,0,.12);
}
.card-title{font-weight:750;margin-bottom:13px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:10px}
.stat{font-size:29px;font-weight:850;margin:4px 0}.accent{color:#c4b5fd}.green{color:#86efac}.cyan{color:#67e8f9}.yellow{color:#fde68a}
.progress{height:8px;background:rgba(255,255,255,.08);border-radius:20px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:20px}
.list{display:flex;flex-direction:column;gap:8px}.item{border:1px solid var(--border);background:rgba(255,255,255,.035);padding:12px;border-radius:13px}
.item-row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check{width:21px;height:21px;accent-color:var(--accent)}
.tag{display:inline-flex;align-items:center;background:rgba(124,58,237,.18);border:1px solid rgba(124,58,237,.3);color:#d8caff;padding:3px 7px;border-radius:7px;font-size:10px;margin:2px}
.badge{display:inline-block;padding:4px 8px;border-radius:7px;font-size:10px;background:rgba(255,255,255,.08);color:#cbd5e1}
.priority-high{color:#fca5a5}.priority-mid{color:#fde68a}.priority-low{color:#86efac}
.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:14px}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left;font-size:12px}th{color:var(--muted)}
canvas{width:100%;height:230px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted)}
input,textarea,select{
  width:100%;background:rgba(0,0,0,.22);color:white;border:1px solid var(--border);border-radius:10px;
  padding:10px 11px;outline:none;min-height:40px;
}
textarea{min-height:100px;resize:vertical}select option{background:#111827}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(5px);z-index:100;display:none;align-items:center;justify-content:center;padding:18px}
.modal-bg.show{display:flex}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#111827;border:1px solid var(--border);border-radius:20px;box-shadow:0 30px 100px #000;padding:20px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.modal-title{font-size:20px;font-weight:800}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}
.toast{position:fixed;right:20px;bottom:20px;z-index:200;transform:translateY(100px);opacity:0;transition:.25s;background:#111827;border:1px solid var(--border);border-radius:12px;padding:12px 16px;box-shadow:0 20px 60px #000;max-width:360px}.toast.show{transform:none;opacity:1}
.timer-big{text-align:center;font-size:72px;font-weight:900;letter-spacing:2px;margin:25px 0}.timer-controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.timer-presets{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--border);border-radius:14px;overflow:hidden}.dow,.day{min-height:105px;padding:8px;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}.dow{min-height:auto;text-align:center;background:rgba(255,255,255,.04);color:var(--muted);font-size:11px}.day:nth-child(7n){border-right:0}.day-num{font-size:12px;color:var(--muted)}.today .day-num{background:var(--accent);color:white;padding:3px 6px;border-radius:7px}.cal-event{font-size:10px;padding:4px 5px;border-radius:5px;background:rgba(124,58,237,.25);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wall-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.wall{height:90px;border:2px solid transparent;border-radius:12px;overflow:hidden;cursor:pointer;position:relative;background-size:cover;background-position:center}.wall.selected{border-color:white;box-shadow:0 0 0 2px var(--accent)}.wall span{position:absolute;left:7px;bottom:6px;font-size:10px;text-shadow:0 2px 4px #000}
.color-row{display:flex;gap:10px;flex-wrap:wrap}.color-dot{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent}.color-dot.active{border-color:white}
.link-line{height:1px;background:var(--border);margin:12px 0}
.kpi{display:flex;align-items:center;justify-content:space-between}.kpi-icon{width:40px;height:40px;border-radius:11px;background:rgba(124,58,237,.16);display:grid;place-items:center;font-size:18px}
.mission{display:flex;align-items:center;gap:10px}.mission.done{opacity:.55;text-decoration:line-through}
.quick-add{position:fixed;right:24px;bottom:24px;z-index:30;width:54px;height:54px;border:0;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:26px;box-shadow:0 15px 40px rgba(0,0,0,.4)}
.toast-action{margin-left:10px;color:#c4b5fd}
@media(max-width:900px){
  :root{--sidebar:215px}
  .g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:700px){
  .sidebar{position:fixed;left:-260px;top:0;transition:.2s;box-shadow:20px 0 60px #000}.sidebar.open{left:0}.mobile-menu{display:grid}.topbar{padding:0 12px}.page{padding:15px}.search{display:none}.g2,.g3,.g4{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.wall-grid{grid-template-columns:repeat(2,1fr)}.calendar-grid{font-size:9px}.dow,.day{min-height:70px;padding:5px}.timer-big{font-size:53px}
}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">N</div>
      <div class="brand-text"><b>NEXUS</b><span>PERSONAL OS 2.0</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-bottom">
      <div class="user-mini"><div class="avatar">N</div><div><b id="sideLevel">Lv.1</b><div class="tiny muted">NEXUS USER</div></div></div>
    </div>
  </aside>

  <main class="main" id="main">
    <header class="topbar">
      <button class="icon-btn mobile-menu" id="mobileMenu">☰</button>
      <div class="search"><span>⌕</span><input id="globalSearch" placeholder="NEXUSを検索…"></div>
      <div class="top-actions">
        <button class="icon-btn" id="notifyBtn" title="通知">🔔</button>
        <button class="icon-btn" id="themeBtn" title="テーマ">◐</button>
      </div>
    </header>
    <section id="content"></section>
  </main>
</div>

<button class="quick-add" id="quickAdd">＋</button>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
const KEY="NEXUS_2_0_COMPLETE";
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const fmtDate=d=>d?new Date(d).toLocaleDateString("ja-JP",{year:"numeric",month:"short",day:"numeric"}):"";
const fmtMin=m=>{m=Math.max(0,Math.round(m||0));const h=Math.floor(m/60),x=m%60;return h?`${h}時間${x}分`:`${x}分`};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

const walls={
"space":"radial-gradient(circle at 20% 20%,#243b80 0 2%,transparent 3%),radial-gradient(circle at 80% 70%,#6d28d9 0 3%,transparent 4%),radial-gradient(circle at 50% 30%,#fff 0 1px,transparent 2px),linear-gradient(135deg,#030712,#111827 55%,#312e81)",
"galaxy":"radial-gradient(ellipse at 65% 45%,#a855f7 0,transparent 22%),radial-gradient(ellipse at 25% 65%,#2563eb,transparent 25%),linear-gradient(140deg,#09001f,#020617)",
"neon":"linear-gradient(120deg,transparent 35%,rgba(0,255,255,.2),transparent 36%),linear-gradient(0deg,#09001a,#16002e 50%,#001b2e)",
"aurora":"radial-gradient(ellipse at 50% 0,#22d3ee,transparent 40%),radial-gradient(ellipse at 20% 30%,#22c55e,transparent 35%),linear-gradient(#06111c,#07111a 60%,#020617)",
"ocean":"linear-gradient(160deg,#082f49,#0369a1 45%,#0e7490 70%,#082f49)",
"forest":"radial-gradient(circle at 50% 80%,#166534,transparent 35%),linear-gradient(120deg,#052e16,#14532d 50%,#020617)",
"volcano":"radial-gradient(ellipse at 50% 100%,#ef4444,transparent 28%),linear-gradient(#180000,#451a03 45%,#090909)",
"sunset":"linear-gradient(150deg,#1e1b4b 0%,#7c2d12 48%,#f97316 75%,#facc15)",
"sunrise":"linear-gradient(#172554,#3b82f6 35%,#fb923c 72%,#fef3c7)",
"rain":"repeating-linear-gradient(105deg,rgba(147,197,253,.12) 0 1px,transparent 1px 18px),linear-gradient(#0f172a,#1e293b)",
"snow":"radial-gradient(circle,rgba(255,255,255,.9) 0 2px,transparent 3px) 0 0/55px 55px,linear-gradient(#64748b,#0f172a)",
"desert":"linear-gradient(#451a03,#d97706 50%,#fbbf24)",
"night":"radial-gradient(circle at 70% 20%,#fef3c7 0 2%,transparent 3%),linear-gradient(#020617,#0f172a)",
"sky":"linear-gradient(#38bdf8,#60a5fa 45%,#bfdbfe 75%,#e0f2fe)",
"cyber":"linear-gradient(90deg,rgba(0,255,255,.12) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(rgba(255,0,255,.1) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(135deg,#020617,#1e0035)",
"grid":"linear-gradient(rgba(59,130,246,.16) 1px,transparent 1px) 0 0/30px 30px,linear-gradient(90deg,rgba(59,130,246,.16) 1px,transparent 1px) 0 0/30px 30px,#020617",
"nebula":"radial-gradient(ellipse at 25% 25%,#ec4899,transparent 25%),radial-gradient(ellipse at 70% 70%,#7c3aed,transparent 28%),#05000d",
"crimson":"radial-gradient(circle at 80% 20%,#ef4444,transparent 20%),linear-gradient(135deg,#090909,#3f0a0a,#170000)",
"minimal":"linear-gradient(135deg,#111827,#030712)",
"matrix":"repeating-linear-gradient(90deg,rgba(34,197,94,.13) 0 1px,transparent 1px 12px),repeating-linear-gradient(0deg,rgba(34,197,94,.08) 0 1px,transparent 1px 18px),#020b05"
};
const wallNames={space:"Deep Space",galaxy:"Galaxy",neon:"Neon City",aurora:"Aurora",ocean:"Ocean",forest:"Forest",volcano:"Volcano",sunset:"Sunset",sunrise:"Sunrise",rain:"Rain",snow:"Snow",desert:"Desert",night:"Night",sky:"Sky",cyber:"Cyber",grid:"Blue Grid",nebula:"Purple Nebula",crimson:"Crimson",minimal:"Dark Minimal",matrix:"Matrix"};

const defaults={
 tasks:[],notes:[],events:[],novels:[],games:[],studies:[],habits:[],links:[],tags:[],
 activity:[],trash:[],databases:[],xp:0,level:1,streak:0,
 settings:{theme:"dark",wall:"space",customWall:"",dailyWall:false,overlay:.28,blur:18,accent:"#7c3aed",density:1,font:1,sidebar:245,sounds:true,notifications:true,wallRandom:false},
 timer:{mode:"countdown",total:1500,remaining:1500,running:false,started:0,pausedAt:0,linkType:"",linkId:"",sessions:[]},
 dashboard:["today","tasks","timer","study","xp","habits","activity"],
 history:[],missions:[]
};
let S=load();
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch{return structuredClone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(S));applySettings()}
function log(type,text,xp=0){
 S.activity.unshift({id:uid(),type,text,time:Date.now()});S.activity=S.activity.slice(0,300);
 if(xp){S.xp+=xp;while(S.xp>=S.level*500){S.xp-=S.level*500;S.level++;toast("🎉 LEVEL UP! Lv."+S.level)}}
 save();
}
function toast(t){const e=document.getElementById("toast");e.innerHTML=esc(t);e.classList.add("show");clearTimeout(window._toast);window._toast=setTimeout(()=>e.classList.remove("show"),2600)}
function applySettings(){
 const s=S.settings||defaults.settings;
 document.documentElement.style.setProperty("--accent",s.accent);
 document.documentElement.style.setProperty("--overlay",s.overlay);
 document.documentElement.style.setProperty("--blur",s.blur+"px");
 document.documentElement.style.setProperty("--sidebar",s.sidebar+"px");
 document.documentElement.style.setProperty("--density",s.density);
 document.documentElement.style.fontSize=(s.font||1)+"em";
 let bg=s.customWall?`url("${s.customWall}")`:walls[s.wall]||walls.space;
 document.body.style.setProperty("--wallpaper",bg);
 document.body.dataset.theme=s.theme;
}
applySettings();

const NAV=[
 ["HOME","ホーム","dashboard","⌂"],
 ["PLAN","タスク","tasks","✓"],["PLAN","カレンダー","calendar","▦"],["PLAN","習慣","habits","🔥"],
 ["CREATE","ノート","notes","✎"],["CREATE","小説","novels","📖"],
 ["TRACK","タイマー","timer","⏱"],["TRACK","勉強","study","📚"],["TRACK","ゲーム","games","🎮"],
 ["DATA","NEXUS LINK","link","🔗"],["DATA","データベース","database","▤"],["DATA","統計","stats","◒"],
 ["SYSTEM","通知","notifications","🔔"],["SYSTEM","ゴミ箱","trash","♻"],["SYSTEM","設定","settings","⚙"]
];
let route="dashboard";
function renderNav(){
 const n=document.getElementById("nav");let sec="";
 NAV.forEach(([g,label,id,ico],i)=>{
   if(i===0||NAV[i-1][0]!==g)sec+=`<div class="nav-section">${g}</div>`;
   const badge=id==="tasks"?S.tasks.filter(x=>!x.done).length:"";
   sec+=`<button data-route="${id}" class="${route===id?"active":""}"><span class="ico">${ico}</span><span class="nav-label">${label}</span>${badge?`<span class="nav-badge">${badge}</span>`:""}</button>`;
 });n.innerHTML=sec;
}
document.getElementById("nav").addEventListener("click",e=>{
 const b=e.target.closest("[data-route]");if(!b)return;
 route=b.dataset.route;renderNav();render();document.getElementById("sidebar").classList.remove("open");
});
document.getElementById("mobileMenu").onclick=()=>document.getElementById("sidebar").classList.toggle("open");
document.getElementById("themeBtn").onclick=()=>{S.settings.theme=S.settings.theme==="dark"?"light":"dark";save();document.body.style.filter=S.settings.theme==="light"?"invert(.02)":"none";toast("テーマを変更しました")};
document.getElementById("notifyBtn").onclick=async()=>{
 if(!("Notification"in window)){toast("このブラウザは通知に対応していません");return}
 const p=await Notification.requestPermission();S.settings.notifications=p==="granted";save();toast(p==="granted"?"通知を許可しました":"通知は許可されませんでした");
};
document.getElementById("globalSearch").addEventListener("input",e=>{if(e.target.value.trim())openSearch(e.target.value.trim())});
document.getElementById("quickAdd").onclick=()=>quickAdd();

function render(){const c=document.getElementById("content");c.innerHTML=views[route]?views[route]():notFound();bindView();updateTimerUI();renderNav()}
function notFound(){return `<div class="page"><div class="empty">ページが見つかりません</div></div>`}

function head(title,sub,buttons=""){return `<div class="page-head"><div><div class="page-title">${title}</div><div class="page-sub">${sub}</div></div><div class="actions">${buttons}</div></div>`}
function viewsDashboard(){
 const due=S.tasks.filter(x=>!x.done).sort((a,b)=>(a.due||"").localeCompare(b.due||"")).slice(0,5);
 const ev=S.events.filter(x=>x.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,4);
 return `<div class="page">${head("NEXUS","あなたの情報を一つにつなぐPersonal OS",`<button class="btn primary" data-action="quick">＋ 追加</button>`)}
 <div class="grid g4">${[
 ["📋","未完了タスク",S.tasks.filter(x=>!x.done).length,"accent"],
 ["📚","今日の勉強",fmtMin(S.studies.filter(x=>x.date===today()).reduce((a,x)=>a+(+x.minutes||0),0)),"cyan"],
 ["✍️","小説PV",S.novels.reduce((a,x)=>a+(+x.pv||0),0).toLocaleString(),"green"],
 ["⚡","NEXUS XP",S.xp.toLocaleString(),"yellow"]
 ].map(x=>`<div class="card"><div class="kpi"><div><div class="small muted">${x[1]}</div><div class="stat ${x[3]}">${x[2]}</div></div><div class="kpi-icon">${x[0]}</div></div></div>`).join("")}</div>
 <div class="grid g2" style="margin-top:16px">
 <div class="card"><div class="card-title">📋 今日のタスク <button class="btn" data-action="addTask">＋</button></div>
 ${due.length?`<div class="list">${due.map(taskRow).join("")}</div>`:`<div class="empty">未完了タスクはありません 🎉</div>`}</div>
 <div class="card"><div class="card-title">📅 予定 <button class="btn" data-route2="calendar">すべて</button></div>

function startTimer(){
 if(S.timer.mode==="countdown"&&!S.timer.remaining){return}
 S.timer.running=true;S.timer.started=Date.now()-(S.timer.elapsed||0)*1000;save();toast("タイマー開始")
}
function pauseTimer(){
 if(!S.timer.running)return;S.timer.elapsed=(Date.now()-S.timer.started)/1000;S.timer.remaining=Math.max(0,S.timer.remaining-(S.timer.elapsed-(S.timer.lastTick||0)));S.timer.lastTick=S.timer.elapsed;S.timer.running=false;save()
}
function resetTimer(){S.timer.running=false;S.timer.elapsed=0;S.timer.lastTick=0;S.timer.remaining=S.timer.total;save();updateTimerUI()}
function completeTimer(){
 const mins=Math.max(1,Math.round((S.timer.total-S.timer.remaining)/60));
 S.timer.sessions.unshift({id:uid(),minutes:mins,time:Date.now(),label:timerLabel()});
 log("timer",`${timerLabel()}を${mins}分実行`,Math.min(100,mins));
 S.timer.running=false;S.timer.remaining=S.timer.total;S.timer.elapsed=0;S.timer.lastTick=0;save();
 notify("⏱ NEXUS タイマー",`${timerLabel()}が終了しました`);
 playBeep();render();
}
function timerLabel(){if(S.timer.linkId)return resolveName(S.timer.linkType+":"+S.timer.linkId);return"フリータイマー"}
function updateTimerUI(){
 const el=document.getElementById("timerDisplay")||document.getElementById("dashTimer");if(!el)return;
 if(S.timer.running){
   let elapsed=(Date.now()-S.timer.started)/1000;
   if(S.timer.mode==="stopwatch")el.textContent=clock(Math.floor(elapsed));
   else{let r=Math.max(0,S.timer.remaining-Math.floor(elapsed-(S.timer.lastTick||0)));el.textContent=clock(r)}
 }else el.textContent=timerText();
}
function clock(sec){sec=Math.max(0,sec);return `${String(Math.floor(sec/3600)).padStart(2,"0")}:${String(Math.floor(sec%3600/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`}
setInterval(()=>{
 if(!S.timer.running)return;
 if(S.timer.mode==="stopwatch"){updateTimerUI();return}
 let elapsed=Math.floor((Date.now()-S.timer.started)/1000),r=S.timer.remaining-Math.max(0,elapsed-(S.timer.lastTick||0));
 const el=document.getElementById("timerDisplay")||document.getElementById("dashTimer");if(el)el.textContent=clock(r);
 if(r<=0)completeTimer();
},250);

function notify(title,body){
 if(S.settings.notifications&&"Notification"in window&&Notification.permission==="granted"){
   try{new Notification(title,{body,tag:"nexus"})}catch{}
 }
}
function playBeep(){
 if(!S.settings.sounds)return;
 try{let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.08;o.start();setTimeout(()=>{o.stop();c.close()},500)}catch{}
}

}
function actions(a){
 if(a==="quick")quickAdd();
 if(a==="addTask")openModal("新しいタスク",taskForm());
 if(a==="addNote")openModal("新しいノート",noteForm());
 if(a==="addEvent")openModal("新しい予定",eventForm());
 if(a==="addNovel")openModal("新しい作品",novelForm());
 if(a==="addGame")openModal("新しいゲーム",gameForm());
 if(a==="addStudy")openModal("勉強を記録",studyForm());
 if(a==="addHabit")openModal("新しい習慣",habitForm());
 if(a==="addLink")openModal("NEXUS LINKを作成",linkForm());
 if(a==="addDatabase")openModal("新しいデータベース",dbForm());
 if(a==="timerOpen"){route="timer";render()}
 if(a==="timerToggle"){toggleTimer();render()}
 if(a==="timerReset"){resetTimer();render()}
 if(a==="requestNotify")requestNotify();
 if(a==="addReminder")addReminder();
 if(a==="export")exportData();
 if(a==="import")importData();
 if(a==="reset"){if(confirm("全データを削除しますか？")){localStorage.removeItem(KEY);location.reload()}}
 if(a==="emptyTrash"){if(confirm("ゴミ箱を完全に空にしますか？")){S.trash=[];save();render()}}
 if(a==="pin")setPin();
}
function toggleTask(id){let t=S.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;if(t.done)log("task","タスク完了："+t.title,20);save();render()}
function toggleHabit(id){let h=S.habits.find(x=>x.id===id);if(!h)return;h.logs=h.logs||[];if(!h.logs.includes(today())){h.logs.push(today());log("habit","習慣達成："+h.name,10)}save();render()}
function trash(type,id){
 const arr=S[type];const i=arr.findIndex(x=>x.id===id);if(i<0)return;const obj=arr[i];arr.splice(i,1);S.trash.push({id:uid(),originalId:obj.id,type,title:obj.title||obj.name||obj.subject,data:obj,deletedAt:Date.now()});save()
}
function restoreTrash(id){let x=S.trash.find(x=>x.id===id);if(!x)return;if(S[x.type])S[x.type].push(x.data);S.trash=S.trash.filter(x=>x.id!==id);save();render()}
function setTimer(sec){S.timer.mode="countdown";S.timer.total=sec;S.timer.remaining=sec;S.timer.elapsed=0;S.timer.lastTick=0;S.timer.running=false;save();render()}
function syncTimerInputs(){let h=+g("timerH")||0,m=+g("timerM")||0,s=+g("timerS")||0;S.timer.total=h*3600+m*60+s;S.timer.remaining=S.timer.total;S.timer.running=false;S.timer.elapsed=0;save();updateTimerUI()}
function toggleTimer(){
 if(S.timer.running){pauseTimer();toast("タイマーを一時停止しました")}
 else{if(!S.timer.remaining)S.timer.remaining=S.timer.total;S.timer.started=Date.now();S.timer.lastTick=0;S.timer.running=true;save();toast("タイマー開始")}
}
function randomWall(){let keys=Object.keys(walls);S.settings.wall=keys[Math.floor(Math.random()*keys.length)];S.settings.customWall=""}
async function requestNotify(){if(!("Notification"in window)){toast("通知非対応ブラウザです");return}let p=await Notification.requestPermission();S.settings.notifications=p==="granted";save();toast(p==="granted"?"通知ON":"通知OFF");render()}
function addReminder(){openModal("リマインダー",`<div class="form-grid"><div class="field"><label>内容</label><input id="fTitle"></div><div class="field"><label>日時</label><input id="fAt" type="datetime-local"></div></div><div class="modal-foot"><button class="btn" data-close>キャンセル</button><button class="btn primary" data-save-reminder>保存</button></div>`)}
function exportData(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download=`NEXUS-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href);toast("バックアップを書き出しました")}
function importData(){let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{S={...defaults,...JSON.parse(r.result)};save();render();toast("復元しました")}catch{toast("JSONが正しくありません")}};r.readAsText(i.files[0])};i.click()}
function setPin(){let p=prompt("4〜8桁のPINを設定");if(!p)return;if(!/^\d{4,8}$/.test(p)){toast("数字4〜8桁で設定してください");return}S.settings.pin=btoa(p);save();toast("PINを設定しました")}
function checkPin(){if(!S.settings.pin)return true;let p=prompt("NEXUS PINを入力");if(p===atob(S.settings.pin))return true;alert("PINが違います");return false}
function drawChart(){
 const c=document.getElementById("studyChart");if(!c)return;const ctx=c.getContext("2d"),w=c.width=c.clientWidth*devicePixelRatio,h=c.height=230*devicePixelRatio;ctx.clearRect(0,0,w,h);const vals=[],labs=[];
 for(let i=13;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let ds=d.toISOString().slice(0,10);labs.push(ds.slice(5));vals.push(S.studies.filter(x=>x.date===ds).reduce((a,x)=>a+(+x.minutes||0),0))}
 const max=Math.max(30,...vals),pad=35*devicePixelRatio;ctx.strokeStyle="rgba(255,255,255,.12)";ctx.lineWidth=1;
 for(let j=0;j<5;j++){let y=pad+(h-pad*1.5)*j/4;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-10,y);ctx.stroke()}
 ctx.beginPath();vals.forEach((v,i)=>{let x=pad+i*(w-pad-15)/(vals.length-1),y=h-pad-(h-pad*1.7)*v/max;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--accent");ctx.lineWidth=4;ctx.stroke();
 ctx.fillStyle="#94a3b8";ctx.font=`${11*devicePixelRatio}px sans-serif`;labs.forEach((l,i)=>{let x=pad+i*(w-pad-15)/(labs.length-1);ctx.fillText(l,x-12,h-7*devicePixelRatio)});
}

document.addEventListener("click",e=>{
 if(e.target.closest("[data-save-reminder]")){let r={id:uid(),title:g("fTitle"),at:g("fAt")};S.settings.reminders=S.settings.reminders||[];S.settings.reminders.push(r);save();closeModal();render()}
});
function reminderLoop(){
 const now=Date.now();(S.settings.reminders||[]).forEach(r=>{if(!r.done&&new Date(r.at).getTime()<=now){notify("🔔 NEXUS リマインダー",r.title);r.done=true;save()}});
 S.events.forEach(e=>{if(e.date===today()&&e.time&&!e._notified){let t=new Date(`${e.date}T${e.time}`).getTime();if(t-now<60000&&t-now>-60000){notify("📅 NEXUS 予定",e.title);e._notified=true;save()}}});
 S.tasks.forEach(t=>{if(!t.done&&t.due===today()&&!t._notified){notify("📋 NEXUS タスク",`期限：${t.title}`);t._notified=true;save()}});
}
setInterval(reminderLoop,30000);

if(S.settings.dailyWall){
 const key="NEXUS_WALL_DATE",d=today();
 if(localStorage.getItem(key)!==d){randomWall();localStorage.setItem(key,d);save()}
}else if(S.settings.wallRandom){randomWall();save()}

document.addEventListener("keydown",e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();document.getElementById("globalSearch").focus()}
 if(e.key==="Escape")closeModal();
});
S.calendar=S.calendar||{year:new Date().getFullYear(),month:new Date().getMonth()};
if(!checkPin())document.body.innerHTML="<div style='height:100vh;display:grid;place-items:center;background:#080b12;color:white;font-family:sans-serif'><h2>🔒 NEXUS Locked</h2></div>";
else{render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});}
</script>
</body>
</html>
