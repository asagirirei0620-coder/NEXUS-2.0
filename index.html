<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>NEXUS 2.0</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#080c18;
    --panel:#10172a;
    --panel2:#151e34;
    --border:#27324d;
    --text:#f2f5ff;
    --sub:#8d99b5;
    --accent:#7180ff;
    --accent2:#8c6cff;
    --green:#53d39c;
    --red:#ff637d;
    --yellow:#ffc857;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background:
        radial-gradient(
            circle at 20% 0%,
            #1a2445 0,
            #080c18 42%
        );
    color:var(--text);
    min-height:100vh;
}

/* =========================
   APP
========================= */

.app{
    display:flex;
    min-height:100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:240px;
    padding:22px 14px;
    background:#0b1020ee;
    backdrop-filter:blur(20px);
    border-right:1px solid var(--border);
    z-index:50;
}

.logo{
    font-size:24px;
    font-weight:800;
    letter-spacing:3px;
    padding:8px 12px 28px;
}

.logo span{
    color:var(--accent);
    font-size:11px;
    letter-spacing:1px;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.nav button{
    border:0;
    background:transparent;
    color:#aeb8d0;
    text-align:left;
    padding:12px;
    border-radius:12px;
    cursor:pointer;
    transition:.2s;
    font-size:14px;
}

.nav button:hover,
.nav button.active{
    background:#19233d;
    color:white;
}

.sidebar-bottom{
    position:absolute;
    bottom:18px;
    left:25px;
    color:#5e6b88;
    font-size:11px;
}

/* =========================
   MAIN
========================= */

.main{
    margin-left:240px;
    width:calc(100% - 240px);
    padding:25px 32px 60px;
}

.topbar{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:28px;
}

.menu{
    display:none;
}

.eyebrow{
    color:#697693;
    font-size:10px;
    letter-spacing:3px;
}

.page-title{
    font-size:30px;
    margin-top:4px;
}

.quick-add{
    margin-left:auto;
    background:linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
    );
    color:white;
    border:0;
    padding:11px 16px;
    border-radius:12px;
    cursor:pointer;
    font-weight:600;
}

/* =========================
   GRID
========================= */

.grid{
    display:grid;
    grid-template-columns:repeat(12,1fr);
    gap:16px;
}

.card{
    background:
        linear-gradient(
            145deg,
            #11192c,
            #0d1425
        );
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    box-shadow:0 15px 35px #0003;
}

.col-4{
    grid-column:span 4;
}

.col-6{
    grid-column:span 6;
}

.col-8{
    grid-column:span 8;
}

.col-12{
    grid-column:span 12;
}

.card-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.card-title h2{
    font-size:15px;
}

.sub{
    color:var(--sub);
    font-size:12px;
}

.big-number{
    font-size:42px;
    font-weight:800;
}

.small-button{
    background:#19223a;
    color:white;
    border:1px solid var(--border);
    border-radius:9px;
    padding:7px 10px;
    cursor:pointer;
}

/* =========================
   DASHBOARD
========================= */

.stat-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.stat{
    padding:14px;
    border:1px solid var(--border);
    border-radius:13px;
    background:#0c1323;
}

.stat-number{
    font-size:25px;
    font-weight:700;
}

.stat-label{
    color:var(--sub);
    font-size:11px;
    margin-top:4px;
}

.list{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.list-item{
    padding:12px;
    background:#0d1425;
    border:1px solid var(--border);
    border-radius:11px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.item-main{
    min-width:0;
}

.item-title{
    font-size:13px;
    font-weight:600;
}

.item-meta{
    color:var(--sub);
    font-size:11px;
    margin-top:4px;
}

.tag{
    display:inline-block;
    padding:4px 8px;
    border-radius:999px;
    border:1px solid var(--border);
    color:#aeb8ff;
    font-size:10px;
}

/* =========================
   TIMER
========================= */

.timer{
    text-align:center;
}

.timer-display{
    font-size:65px;
    font-weight:800;
    letter-spacing:2px;
    margin:10px 0;
}

.timer-mode{
    color:var(--accent);
    font-size:12px;
    margin-bottom:8px;
}

.timer-controls{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
}

.timer-controls button{
    background:#19223a;
    color:white;
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 14px;
    cursor:pointer;
}

.timer-controls .start{
    background:var(--accent);
    border-color:var(--accent);
}

.timer-presets{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-top:13px;
}

.timer-presets button{
    background:#0c1323;
    color:#b9c3db;
    border:1px solid var(--border);
    border-radius:8px;
    padding:7px 10px;
    cursor:pointer;
    font-size:11px;
}

/* =========================
   PROGRESS
========================= */

.progress{
    height:8px;
    background:#202943;
    border-radius:99px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(
        90deg,
        var(--accent),
        var(--accent2)
    );
}

/* =========================
   FORMS
========================= */

.form{
    display:flex;
    flex-direction:column;
    gap:10px;
}

input,
textarea,
select{
    width:100%;
    background:#0a1020;
    border:1px solid var(--border);
    color:white;
    padding:11px;
    border-radius:10px;
    outline:none;
}

textarea{
    min-height:140px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:var(--accent);
}

.primary{
    border:0;
    background:var(--accent);
    color:white;
    padding:11px;
    border-radius:10px;
    cursor:pointer;
}

.danger{
    border:0;
    background:#451b28;
    color:#ff91a4;
    padding:7px 10px;
    border-radius:8px;
    cursor:pointer;
}

.empty{
    text-align:center;
    padding:35px 10px;
    color:#66728d;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:#0009;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal.hidden{
    display:none;
}

.modal-box{
    width:min(550px,100%);
    background:#10172a;
    border:1px solid var(--border);
    border-radius:18px;
    padding:22px;
    position:relative;
}

.close{
    position:absolute;
    right:15px;
    top:12px;
    border:0;
    background:transparent;
    color:white;
    font-size:24px;
    cursor:pointer;
}

/* =========================
   TAGS
========================= */

.tag-list{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.tag-button{
    border:1px solid var(--border);
    background:#10182b;
    color:#b8c1dc;
    padding:7px 10px;
    border-radius:999px;
    cursor:pointer;
}

.tag-button:hover{
    border-color:var(--accent);
}

/* =========================
   MOBILE
========================= */

@media(max-width:850px){

    .sidebar{
        transform:translateX(-100%);
        transition:.25s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        margin-left:0;
        width:100%;
        padding:18px;
    }

    .menu{
        display:block;
        background:transparent;
        color:white;
        border:0;
        font-size:23px;
        cursor:pointer;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .col-4,
    .col-6,
    .col-8,
    .col-12{
        grid-column:span 1;
    }

    .timer-display{
        font-size:52px;
    }

    .stat-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar" id="sidebar">

    <div class="logo">
        NEXUS
        <span>2.0</span>
    </div>

    <nav class="nav">

        <button class="active" onclick="navigate('dashboard')">
            🏠 Dashboard
        </button>

        <button onclick="navigate('tasks')">
            ☑️ Tasks
        </button>

        <button onclick="navigate('notes')">
            📝 Notes
        </button>

        <button onclick="navigate('timer')">
            ⏱️ Timer
        </button>

        <button onclick="navigate('tags')">
            #️⃣ Tags
        </button>

        <button onclick="navigate('activity')">
            📊 Activity
        </button>

        <button onclick="navigate('settings')">
            ⚙️ Settings
        </button>

    </nav>

    <div class="sidebar-bottom">
        NEXUS Personal OS
    </div>

</aside>


<!-- =========================
     MAIN
========================= -->

<main class="main">

<header class="topbar">

    <button class="menu" onclick="toggleMenu()">
        ☰
    </button>

    <div>

        <div class="eyebrow">
            PERSONAL OPERATING SYSTEM
        </div>

        <h1 class="page-title" id="pageTitle">
            Dashboard
        </h1>

    </div>

    <button class="quick-add" onclick="openQuickAdd()">
        ＋ Quick Add
    </button>

</header>


<section id="content"></section>

</main>

</div>


<!-- =========================
     MODAL
========================= -->

<div class="modal hidden" id="modal">

    <div class="modal-box">

        <button class="close" onclick="closeModal()">
            ×
        </button>

        <h2 id="modalTitle">
            Quick Add
        </h2>

        <div id="modalContent"></div>

    </div>

</div>


<script>

/* =========================================================
   NEXUS DATA
========================================================= */

const STORAGE_KEY = "NEXUS_2_0_DATA";

let data = JSON.parse(
    localStorage.getItem(STORAGE_KEY)
) || {

    tasks: [],

    notes: [],

    activities: [],

    timerSessions: [],

    tags: [
        "勉強",
        "小説",
        "ゲーム",
        "集中",
        "重要"
    ],

    settings:{
        sound:true,
        dark:true
    }

};


function save(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


/* =========================================================
   NAVIGATION
========================================================= */

let currentPage = "dashboard";


function navigate(page){

    currentPage = page;

    document
        .querySelectorAll(".nav button")
        .forEach(button => {

            button.classList.remove("active");

        });

    const titles = {

        dashboard:"Dashboard",

        tasks:"Tasks",

        notes:"Notes",

        timer:"Timer",

        tags:"Tags",

        activity:"Activity",

        settings:"Settings"

    };

    document.getElementById("pageTitle").textContent =
        titles[page];

    renderPage();

    document
        .getElementById("sidebar")
        .classList.remove("open");

}


function renderPage(){

    switch(currentPage){

        case "dashboard":
            renderDashboard();
            break;

        case "tasks":
            renderTasks();
            break;

        case "notes":
            renderNotes();
            break;

        case "timer":
            renderTimerPage();
            break;

        case "tags":
            renderTags();
            break;

        case "activity":
            renderActivity();
            break;

        case "settings":
            renderSettings();
            break;

    }

}


/* =========================================================
   ACTIVITY
========================================================= */

function addActivity(type,text,tags=[]){

    data.activities.unshift({

        id:Date.now(),

        type,

        text,

        tags,

        date:new Date().toISOString()

    });

    data.activities =
        data.activities.slice(0,100);

    save();

}


/* =========================================================
   DASHBOARD
========================================================= */

function renderDashboard(){

    const completed =
        data.tasks.filter(t=>t.completed).length;

    const totalTasks =
        data.tasks.length;

    const totalMinutes =
        data.timerSessions.reduce(
            (sum,s)=>sum+s.minutes,
            0
        );

    document.getElementById("content").innerHTML = `

    <div class="grid">

        <div class="card col-8">

            <div class="card-title">

                <h2>Overview</h2>

                <span class="sub">
                    NEXUS 2.0
                </span>

            </div>

            <div class="stat-grid">

                <div class="stat">

                    <div class="stat-number">
                        ${totalTasks}
                    </div>

                    <div class="stat-label">
                        Tasks
                    </div>

                </div>

                <div class="stat">

                    <div class="stat-number">
                        ${completed}
                    </div>

                    <div class="stat-label">
                        Completed
                    </div>

                </div>

                <div class="stat">

                    <div class="stat-number">
                        ${totalMinutes}
                    </div>

                    <div class="stat-label">
                        Focus Minutes
                    </div>

                </div>

            </div>

        </div>


        <div class="card col-4">

            <div class="card-title">

                <h2>Quick Timer</h2>

                <button
                    class="small-button"
                    onclick="navigate('timer')"
                >
                    Open
                </button>

            </div>

            <div class="timer">

                <div class="timer-mode">
                    READY
                </div>

                <div
                    class="timer-display"
                    id="dashboardTimer"
                >
                    25:00
                </div>

                <div class="timer-controls">

                    <button
                        class="start"
                        onclick="startTimer(25)"
                    >
                        Start
                    </button>

                </div>

            </div>

        </div>


        <div class="card col-6">

            <div class="card-title">

                <h2>Today's Tasks</h2>

                <button
                    class="small-button"
                    onclick="navigate('tasks')"
                >
                    View
                </button>

            </div>

            <div class="list">

                ${
                    data.tasks.length
                    ?
                    data.tasks
                    .slice(0,5)
                    .map(task => `

                        <div class="list-item">

                            <div class="item-main">

                                <div class="item-title">
                                    ${
                                        task.completed
                                        ? "✅ "
                                        : "⬜ "
                                    }
                                    ${escapeHTML(task.title)}
                                </div>

                                <div class="item-meta">
                                    ${task.tags.map(t=>"#"+escapeHTML(t)).join(" ")}
                                </div>

                            </div>

                        </div>

                    `).join("")
                    :
                    `
                    <div class="empty">
                        まだタスクがないよ
                    </div>
                    `
                }

            </div>

        </div>


        <div class="card col-6">

            <div class="card-title">

                <h2>Recent Activity</h2>

                <button
                    class="small-button"
                    onclick="navigate('activity')"
                >
                    View
                </button>

            </div>

            <div class="list">

                ${
                    data.activities.length
                    ?
                    data.activities
                    .slice(0,5)
                    .map(a => `

                        <div class="list-item">

                            <div class="item-main">

                                <div class="item-title">
                                    ${escapeHTML(a.text)}
                                </div>

                                <div class="item-meta">
                                    ${formatDate(a.date)}
                                </div>

                            </div>

                        </div>

                    `).join("")
                    :
                    `
                    <div class="empty">
                        まだ活動履歴がないよ
                    </div>
                    `
                }

            </div>

        </div>


        <div class="card col-12">

            <div class="card-title">

                <h2>Tags</h2>

                <button
                    class="small-button"
                    onclick="navigate('tags')"
                >
                    Manage
                </button>

            </div>

            <div class="tag-list">

                ${
                    data.tags
                    .map(tag => `
                        <button
                            class="tag-button"
                            onclick="filterByTag('${escapeJS(tag)}')"
                        >
                            #${escapeHTML(tag)}
                        </button>
                    `)
                    .join("")
                }

            </div>

        </div>

    </div>

    `;

}


/* =========================================================
   TASKS
========================================================= */

function renderTasks(){

    document.getElementById("content").innerHTML = `

    <div class="grid">

        <div class="card col-12">

            <div class="card-title">

                <h2>Tasks</h2>

                <button
                    class="primary"
                    onclick="openTaskModal()"
                >
                    ＋ Task
                </button>

            </div>

            <div class="list">

                ${
                    data.tasks.length

                    ?

                    data.tasks.map(task => `

                        <div class="list-item">

                            <div class="item-main">

                                <div class="item-title">

                                    ${
                                        task.completed
                                        ? "✅"
                                        : "⬜"
                                    }

                                    ${escapeHTML(task.title)}

                                </div>

                                <div class="item-meta">

                                    ${
                                        task.tags
                                        .map(t=>"#"+escapeHTML(t))
                                        .join(" ")
                                    }

                                </div>

                            </div>

                            <div class="row">

                                <button
                                    class="small-button"
                                    onclick="toggleTask(${task.id})"
                                >
                                    ${
                                        task.completed
                                        ? "Undo"
                                        : "Done"
                                    }
                                </button>

                                <button
                                    class="danger"
                                    onclick="deleteTask(${task.id})"
                                >
                                    Delete
                                </button>

                            </div>

                        </div>

                    `).join("")

                    :

                    `
                    <div class="empty">
                        タスクはまだありません。
                    </div>
                    `
                }

            </div>

        </div>

    </div>

    `;

}


function openTaskModal(){

    openModal(
        "New Task",
        `

        <form class="form" onsubmit="createTask(event)">

            <input
                id="taskTitle"
                placeholder="タスク名"
                required
            >

            <input
                id="taskTags"
                placeholder="タグ（カンマ区切り）"
            >

            <button class="primary">
                作成
            </button>

        </form>

        `
    );

}


function createTask(event){

    event.preventDefault();

    const title =
        document.getElementById("taskTitle").value.trim();

    const tags =
        document
        .getElementById("taskTags")
        .value
        .split(",")
        .map(x=>x.trim())
        .filter(Boolean);

    const task = {

        id:Date.now(),

        title,

        tags,

        completed:false,

        created:new Date().toISOString()

    };

    data.tasks.unshift(task);

    tags.forEach(tag=>{

        if(!data.tags.includes(tag)){
            data.tags.push(tag);
        }

    });

    addActivity(
        "task",
        `タスク「${title}」を作成`,
        tags
    );

    save();

    closeModal();

    renderPage();

}


function toggleTask(id){

    const task =
        data.tasks.find(t=>t.id===id);

    if(!task) return;

    task.completed =
        !task.completed;

    addActivity(
        "task",
        task.completed
        ? `タスク「${task.title}」を完了`
        : `タスク「${task.title}」を未完了に戻した`,
        task.tags
    );

    save();

    renderPage();

}


function deleteTask(id){

    const task =
        data.tasks.find(t=>t.id===id);

    if(!task) return;

    data.tasks =
        data.tasks.filter(t=>t.id!==id);

    addActivity(
        "task",
        `タスク「${task.title}」を削除`,
        task.tags
    );

    save();

    renderPage();

}


/* =========================================================
   NOTES
========================================================= */

function renderNotes(){

    document.getElementById("content").innerHTML = `

    <div class="grid">

        <div class="card col-12">

            <div class="card-title">

                <h2>Notes</h2>

                <button
                    class="primary"
                    onclick="openNoteModal()"
                >
                    ＋ Note
                </button>

            </div>

            <div class="list">

                ${
                    data.notes.length

                    ?

                    data.notes.map(note => `

                        <div class="list-item">

                            <div class="item-main">

                                <div class="item-title">
                                    ${escapeHTML(note.title)}
                                </div>

                                <div class="item-meta">
                                    ${escapeHTML(note.body).slice(0,100)}
                                </div>

                                <div class="item-meta">
                                    ${
                                        note.tags
                                        .map(t=>"#"+escapeHTML(t))
                                        .join(" ")
                                    }
                                </div>

                            </div>

                            <button
                                class="danger"
                                onclick="deleteNote(${note.id})"
                            >
                                Delete
                            </button>

                        </div>

                    `).join("")

                    :

                    `
                    <div class="empty">
                        ノートはまだありません。
                    </div>
                    `
                }

            </div>

        </div>

    </div>

    `;

}


function openNoteModal(){

    openModal(
        "New Note",
        `

        <form class="form" onsubmit="createNote(event)">

            <input
                id="noteTitle"
                placeholder="タイトル"
                required
            >

            <textarea
                id="noteBody"
                placeholder="本文..."
            ></textarea>

            <input
                id="noteTags"
                placeholder="タグ（カンマ区切り）"
            >

            <button class="primary">
                保存
            </button>

        </form>

        `
    );

}


function createNote(event){

    event.preventDefault();

    const title =
        document.getElementById("noteTitle").value.trim();

    const body =
        document.getElementById("noteBody").value;

    const tags =
        document
        .getElementById("noteTags")
        .value
        .split(",")
        .map(x=>x.trim())
        .filter(Boolean);

    data.notes.unshift({

        id:Date.now(),

        title,

        body,

        tags,

        created:new Date().toISOString()

    });

    tags.forEach(tag=>{

        if(!data.tags.includes(tag)){
            data.tags.push(tag);
        }

    });

    addActivity(
        "note",
        `ノート「${title}」を作成`,
        tags
    );

    save();

    closeModal();

    renderPage();

}


function deleteNote(id){

    const note =
        data.notes.find(n=>n.id===id);

    data.notes =
        data.notes.filter(n=>n.id!==id);

    if(note){

        addActivity(
            "note",
            `ノート「${note.title}」を削除`,
            note.tags
        );

    }

    save();

    renderPage();

}


/* =========================================================
   TIMER
========================================================= */

let timerSeconds = 25 * 60;

let timerInterval = null;

let timerRunning = false;

let timerStartedAt = null;

let timerInitialMinutes = 25;


function formatTime(seconds){

    const min =
        Math.floor(seconds / 60)
        .toString()
        .padStart(2,"0");

    const sec =
        (seconds % 60)
        .toString()
        .padStart(2,"0");

    return `${min}:${sec}`;

}


function startTimer(minutes){

    if(minutes){

        timerSeconds =
            minutes * 60;

        timerInitialMinutes =
            minutes;

    }

    if(timerRunning) return;

    timerRunning = true;

    timerStartedAt =
        Date.now();

    updateTimerUI();

    timerInterval =
        setInterval(()=>{

            timerSeconds--;

            updateTimerUI();

            if(timerSeconds <= 0){

                finishTimer();

            }

        },1000);

}


function pauseTimer(){

    clearInterval(timerInterval);

    timerInterval = null;

    timerRunning = false;

    updateTimerUI();

}


function resetTimer(minutes=25){

    pauseTimer();

    timerInitialMinutes =
        minutes;

    timerSeconds =
        minutes * 60;

    updateTimerUI();

}


function finishTimer(){

    clearInterval(timerInterval);

    timerInterval = null;

    timerRunning = false;

    timerSeconds = 0;

    updateTimerUI();

    const session = {

        id:Date.now(),

        minutes:timerInitialMinutes,

        date:new Date().toISOString()

    };

    data.timerSessions.unshift(session);

    addActivity(
        "timer",
        `${timerInitialMinutes}分の集中セッション完了`,
        ["集中"]
    );

    if(data.settings.sound){

        playBeep();

    }

    save();

    alert(
        `🎉 ${timerInitialMinutes}分の集中時間が終了！`
    );

}


function updateTimerUI(){

    const elements =
        document.querySelectorAll(".timer-display");

    elements.forEach(el=>{

        el.textContent =
            formatTime(timerSeconds);

    });

    const modes =
        document.querySelectorAll(".timer-mode");

    modes.forEach(el=>{

        el.textContent =
            timerRunning
            ? "FOCUSING"
            : "READY";

    });

}


function renderTimerPage(){

    document.getElementById("content").innerHTML = `

    <div class="grid">

        <div class="card col-8">

            <div class="timer">

                <div class="timer-mode">
                    ${timerRunning ? "FOCUSING" : "READY"}
                </div>

                <div class="timer-display">
                    ${formatTime(timerSeconds)}
                </div>

                <div class="timer-controls">

                    ${
                        timerRunning

                        ?

                        `
                        <button onclick="pauseTimer()">
                            Pause
                        </button>
                        `

                        :

                        `
                        <button
                            class="start"
                            onclick="startTimer()"

                            Start
                        </button>
                        `
                    }

                    <button onclick="resetTimer(25)">
                        Reset
                    </button>

                </div>

                <div class="timer-presets">

                    <button onclick="resetTimer(1)">
                        1m
                    </button>

                    <button onclick="resetTimer(5)">
                        5m
                    </button>

                    <button onclick="resetTimer(10)">
                        10m
                    </button>

                    <button onclick="resetTimer(25)">
                        25m
                    </button>

                    <button onclick="resetTimer(50)">
                        50m
                    </button>

                </div>

            </div>

        </div>


        <div class="card col-4">

            <div class="card-title">
                <h2>Timer Stats</h2>
            </div>

            <div class="stat">

                <div class="stat-number">
                    ${
                        data.timerSessions
                        .reduce(
                            (s,x)=>s+x.minutes,
                            0
                        )
                    }
                </div>

                <div class="stat-label">

                </div>

            </div>

            <br>

            <div class="stat">

                <div class="stat-number">
                    ${data.timerSessions.length}
                </div>

                <div class="stat-label">
                    Sessions
                </div>

            </div>

        </div>


        <div class="card col-12">

            <div class="card-title">
                <h2>Focus History</h2>
            </div>

            <div class="list">

                ${

                    ?

                        <div class="list-item">

                            <div class="item-main">

                                </div>

                                </div>

                            </div>

                            <span class="tag">
                                #集中
                            </span>

                        </div>

                    `).join("")

                    :

                    `
                    <div class="empty">

                    </div>
                    `
                }

            </div>

    `;

    updateTimerUI();

}

function renderTags(){

    const counts = {};

    data.tags.forEach(tag=>{

        counts[tag] =

            data.tasks.filter(
                x=>x.tags.includes(tag)
            ).length

            +

            data.notes.filter(
                x=>x.tags.includes(tag)
            ).length;

    });

    document.getElementById("content").innerHTML = `

    <div class="grid">

        <div class="card col-12">

            <div class="card-title">

                <h2>Global Tags</h2>

                <button
                    class="primary"
                    onclick="addTag()"

            </div>

            <div class="tag-list">

                ${
                    data.tags
                    .map(tag=>`

                        <button
                            class="tag-button"
                            onclick="filterByTag('${escapeJS(tag)}')"

                    .join("")
                }

            </div>

        </div>

    </div>

function addTag(){

    const tag =

    if(!tag) return;

    if(!data.tags.includes(tag)){

        data.tags.push(tag);

        save();

        renderPage();

    }

}


function filterByTag(tag){

    alert(
        `#${tag}\n\n`
        +
        "このタグに紐づくデータ検索機能はNEXUSの次のアップデートで強化予定。"
    );

}

function exportData(){

    const blob =
        new Blob(
            [
                JSON.stringify(
                    data,
                    null,
                    2
                )
            ],
            {
                type:"application/json"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "nexus-backup.json";

    a.click();

    URL.revokeObjectURL(url);

}


function clearData(){

    if(
        !confirm(
            "本当に全データを削除しますか？"
        )
    ) return;

    localStorage.removeItem(STORAGE_KEY);

    location.reload();

}

function openModal(title,content){

    document.getElementById("modalTitle")
        .textContent = title;

    document.getElementById("modalContent")
        .innerHTML = content;

    document.getElementById("modal")
        .classList.remove("hidden");

}


function closeModal(){

    document.getElementById("modal")
        .classList.add("hidden");

}


/* =========================================================
   UTIL
========================================================= */

function formatDate(date){

    return new Date(date)
        .toLocaleString(
            "ja-JP",
            {
                month:"numeric",
                day:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}


function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function escapeJS(text){

    return String(text)
        .replaceAll("\\","\\\\")
        .replaceAll("'","\\'");

}


function toggleMenu(){

    document
        .getElementById("sidebar")
        .classList.toggle("open");

}


function playBeep(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx =
            new AudioContext();

        const osc =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        osc.frequency.value = 880;

        gain.gain.value = 0.08;

        osc.connect(gain);

        gain.connect(ctx.destination);

        osc.start();

        osc.stop(
            ctx.currentTime + 0.25
        );

    }catch(e){}

}
