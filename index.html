<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXUS">
<title>NEXUS 2.1</title>

<style>
/* =========================================================
   NEXUS 2.1
   PERSONAL OPERATING SYSTEM
   ========================================================= */

:root {
    --bg:#080b14;
    --bg2:#0d1220;
    --panel:#111827;
    --panel2:#172033;
    --panel3:#1d2940;
    --text:#eef3ff;
    --muted:#8d9ab2;
    --line:rgba(255,255,255,.08);
    --accent:#6ea8ff;
    --accent2:#8c7bff;
    --good:#53d88a;
    --warn:#ffc857;
    --danger:#ff6577;
    --shadow:0 18px 50px rgba(0,0,0,.28);
    --radius:18px;
    --sidebar:250px;
    --density:1;
    --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
}

* {
    box-sizing:border-box;
}

html,
body {
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
}

body {
    font-size:15px;
}

button,
input,
textarea,
select {
    font:inherit;
}

button {
    cursor:pointer;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
    outline:2px solid var(--accent);
    outline-offset:2px;
}

/* =========================================================
   BOOT
   ========================================================= */

.boot {
    position:fixed;
    inset:0;
    z-index:99999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 45%,rgba(86,115,255,.18),transparent 35%),
        linear-gradient(135deg,#03050b,#090d18 50%,#03050b);
    transition:opacity .7s ease,visibility .7s ease;
}

.boot.hidden {
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.boot-grid {
    position:absolute;
    inset:0;
    opacity:.14;
    background-image:
        linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:40px 40px;
    mask-image:linear-gradient(to bottom,transparent,#000,transparent);
}

.boot-core {
    position:relative;
    width:min(680px,90vw);
    text-align:center;
}

.boot-logo {
    font-size:clamp(44px,9vw,92px);
    font-weight:800;
    letter-spacing:.38em;
    margin-left:.38em;
    background:linear-gradient(90deg,#fff,#8fb8ff,#b69aff,#fff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:bootLogo 1.6s ease both;
}

.boot-sub {
    margin-top:10px;
    color:#aebde0;
    letter-spacing:.38em;
    font-size:12px;
    animation:bootSub 1.8s ease both;
}

.boot-status {
    margin-top:55px;
    text-align:left;
    padding:20px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(5,9,18,.55);
    backdrop-filter:blur(15px);
    border-radius:16px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12px;
    line-height:2;
    color:#8ea7d4;
}

.boot-status span {
    color:#61e29a;
}

.boot-line {
    opacity:0;
    animation:bootLine .35s ease forwards;
}

.boot-line:nth-child(1) { animation-delay:.25s; }
.boot-line:nth-child(2) { animation-delay:.45s; }
.boot-line:nth-child(3) { animation-delay:.65s; }
.boot-line:nth-child(4) { animation-delay:.85s; }
.boot-line:nth-child(5) { animation-delay:1.05s; }

@keyframes bootLogo {
    from {
        opacity:0;
        transform:scale(.92);
        letter-spacing:.7em;
        filter:blur(10px);
    }
    to {
        opacity:1;
        transform:scale(1);
        letter-spacing:.38em;
        filter:blur(0);
    }
}

@keyframes bootSub {
    from {
        opacity:0;
        transform:translateY(12px);
    }
    to {
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes bootLine {
    from {
        opacity:0;
        transform:translateX(-12px);
    }
    to {
        opacity:1;
        transform:translateX(0);
    }
}

/* =========================================================
   APP
   ========================================================= */

.app {
    display:flex;
    width:100%;
    height:100%;
}

.sidebar {
    width:var(--sidebar);
    flex:0 0 var(--sidebar);
    height:100%;
    overflow-y:auto;
    overflow-x:hidden;
    padding:20px 14px;
    background:
        linear-gradient(180deg,rgba(255,255,255,.025),transparent),
        var(--bg2);
    border-right:1px solid var(--line);
    scrollbar-width:thin;
    position:relative;
    z-index:20;
}

.brand {
    display:flex;
    align-items:center;
    gap:11px;
    padding:6px 9px 22px;
}

.brand-mark {
    width:38px;
    height:38px;
    display:grid;
    place-items:center;
    border-radius:12px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 8px 25px rgba(80,110,255,.28);
    font-weight:900;
    color:white;
}

.brand-name {
    font-size:18px;
    font-weight:800;
    letter-spacing:.14em;
}

.brand-version {
    display:block;
    color:var(--muted);
    font-size:10px;
    letter-spacing:.1em;
    margin-top:2px;
}

.nav-group {
    margin-top:18px;
}

.nav-title {
    color:#61708c;
    font-size:10px;
    font-weight:800;
    letter-spacing:.16em;
    padding:0 10px 7px;
}

.nav-item {
    width:100%;
    border:0;
    background:transparent;
    color:#aab6ca;
    display:flex;
    align-items:center;
    gap:11px;
    padding:10px 11px;
    border-radius:11px;
    margin:2px 0;
    text-align:left;
    transition:.18s ease;
}

.nav-item:hover {
    background:rgba(255,255,255,.045);
    color:white;
}

.nav-item.active {
    background:linear-gradient(90deg,rgba(110,168,255,.16),rgba(140,123,255,.08));
    color:white;
    box-shadow:inset 2px 0 var(--accent);
}

.nav-icon {
    width:21px;
    text-align:center;
    opacity:.9;
}

.nav-badge {
    margin-left:auto;
    min-width:20px;
    height:20px;
    display:grid;
    place-items:center;
    padding:0 6px;
    border-radius:99px;
    background:rgba(255,255,255,.08);
    color:#9daaca;
    font-size:10px;
}

.sidebar-bottom {
    margin-top:20px;
    padding:12px;
    border:1px solid var(--line);
    border-radius:15px;
    background:rgba(255,255,255,.025);
}

.score-mini {
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.score-mini strong {
    font-size:20px;
}

.score-mini small {
    color:var(--muted);
}

.main {
    min-width:0;
    flex:1;
    height:100%;
    overflow-y:auto;
    overflow-x:hidden;
    position:relative;
}

.topbar {
    position:sticky;
    top:0;
    z-index:10;
    display:flex;
    align-items:center;
    gap:12px;
    min-height:68px;
    padding:12px 22px;
    background:rgba(8,11,20,.82);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--line);
}

.mobile-menu {
    display:none;
}

.search {
    flex:1;
    position:relative;
}

.search input {
    width:100%;
    height:42px;
    border:1px solid var(--line);
    border-radius:13px;
    padding:0 15px 0 42px;
    background:rgba(255,255,255,.04);
    color:white;
}

.search-icon {
    position:absolute;
    left:14px;
    top:11px;
    color:var(--muted);
}

.top-actions {
    display:flex;
    gap:8px;
}

.icon-btn {
    width:40px;
    height:40px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.04);
    color:#c7d1e4;
    border-radius:12px;
}

.icon-btn:hover {
    background:rgba(255,255,255,.08);
}

.content {
    padding:26px;
    max-width:1700px;
    margin:0 auto;
}

.page-head {
    display:flex;
    justify-content:space-between;
    gap:20px;
    align-items:flex-start;
    margin-bottom:22px;
}

.page-title {
    margin:0;
    font-size:29px;
    letter-spacing:-.03em;
}

.page-description {
    margin:7px 0 0;
    color:var(--muted);
}

.page-actions {
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.btn {
    border:1px solid var(--line);
    background:rgba(255,255,255,.045);
    color:#dfe8fa;
    padding:10px 14px;
    border-radius:11px;
    transition:.18s ease;
}

.btn:hover {
    background:rgba(255,255,255,.08);
    transform:translateY(-1px);
}

.btn.primary {
    border-color:transparent;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:white;
    font-weight:700;
}

.btn.good {
    background:rgba(83,216,138,.12);
    color:#7deca9;
    border-color:rgba(83,216,138,.22);
}

.btn.danger {
    background:rgba(255,101,119,.1);
    color:#ff8b99;
    border-color:rgba(255,101,119,.2);
}

.btn.small {
    padding:7px 10px;
    font-size:12px;
}

.grid {
    display:grid;
    gap:16px;
}

.grid-2 {
    grid-template-columns:repeat(2,minmax(0,1fr));
}

.grid-3 {
    grid-template-columns:repeat(3,minmax(0,1fr));
}

.grid-4 {
    grid-template-columns:repeat(4,minmax(0,1fr));
}

.card {
    border:1px solid var(--line);
    background:
        linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.015)),
        var(--panel);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
    min-width:0;
}

.card-title {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;
}

.card-title h3,
.card-title h4 {
    margin:0;
    font-size:15px;
}

.card-title span {
    color:var(--muted);
    font-size:12px;
}

.stat-card {
    position:relative;
    overflow:hidden;
}

.stat-card::after {
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    right:-30px;
    bottom:-40px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(110,168,255,.18),transparent 70%);
}

.stat-label {
    color:var(--muted);
    font-size:12px;
}

.stat-value {
    margin-top:5px;
    font-size:29px;
    font-weight:800;
    letter-spacing:-.04em;
}

.stat-extra {
    margin-top:5px;
    color:#9eabc1;
    font-size:11px;
}

.progress {
    height:7px;
    background:rgba(255,255,255,.07);
    border-radius:99px;
    overflow:hidden;
}

.progress > div {
    height:100%;
    border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .4s ease;
}

.empty {
    padding:32px 15px;
    text-align:center;
    color:var(--muted);
    border:1px dashed var(--line);
    border-radius:14px;
}

.list {
    display:flex;
    flex-direction:column;
    gap:9px;
}

.list-row {
    display:flex;
    align-items:center;
    gap:11px;
    padding:11px;
    border:1px solid var(--line);
    border-radius:12px;
    background:rgba(255,255,255,.025);
}

.list-main {
    flex:1;
    min-width:0;
}

.list-main strong {
    display:block;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.list-main small {
    color:var(--muted);
}

.checkbox {
    width:20px;
    height:20px;
    border-radius:6px;
    border:1px solid #52627e;
    background:transparent;
    display:grid;
    place-items:center;
    flex:none;
    color:white;
}

.checkbox.checked {
    background:var(--accent);
    border-color:var(--accent);
}

.tag {
    display:inline-flex;
    align-items:center;
    padding:4px 8px;
    border-radius:99px;
    background:rgba(110,168,255,.11);
    border:1px solid rgba(110,168,255,.18);
    color:#a9c7ff;
    font-size:10px;
}

.tags {
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

.muted {
    color:var(--muted);
}

.good-text {
    color:var(--good);
}

.warn-text {
    color:var(--warn);
}

.danger-text {
    color:var(--danger);
}

/* =========================================================
   FORMS
   ========================================================= */

.form {
    display:flex;
    flex-direction:column;
    gap:13px;
}

.form-row {
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
}

.form-row.three {
    grid-template-columns:repeat(3,minmax(0,1fr));
}

.field {
    display:flex;
    flex-direction:column;
    gap:6px;
}

.field label {
    color:#aab6ca;
    font-size:12px;
}

.field input,
.field textarea,
.field select {
    width:100%;
    border:1px solid var(--line);
    background:#0c1321;
    color:white;
    border-radius:11px;
    padding:10px 11px;
}

.field textarea {
    min-height:110px;
    resize:vertical;
}

.field input::placeholder,
.field textarea::placeholder {
    color:#58657c;
}

.form-actions {
    display:flex;
    justify-content:flex-end;
    gap:8px;
    padding-top:4px;
}

/* =========================================================
   DASHBOARD
   ========================================================= */

.hero {
    padding:24px;
    min-height:180px;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 80% 20%,rgba(140,123,255,.22),transparent 30%),
        radial-gradient(circle at 30% 100%,rgba(110,168,255,.12),transparent 30%),
        var(--panel);
}

.hero h2 {
    margin:0;
    font-size:32px;
}

.hero p {
    color:var(--muted);
    max-width:700px;
}

.hero-score {
    position:absolute;
    right:25px;
    bottom:20px;
    text-align:right;
}

.hero-score strong {
    font-size:36px;
}

.today-strip {
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
}

.day {
    min-width:86px;
    padding:12px;
    border:1px solid var(--line);
    border-radius:12px;
    text-align:center;
    background:rgba(255,255,255,.025);
}

.day.active {
    border-color:rgba(110,168,255,.45);
    background:rgba(110,168,255,.1);
}

.day small {
    display:block;
    color:var(--muted);
}

.day strong {
    display:block;
    margin-top:5px;
    font-size:20px;
}

/* =========================================================
   CALENDAR
   ========================================================= */

.calendar-head {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.calendar-title {
    font-size:19px;
    font-weight:800;
}

.calendar-grid {
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    gap:5px;
}

.calendar-weekday {
    text-align:center;
    padding:8px 0;
    color:var(--muted);
    font-size:11px;
}

.calendar-cell {
    min-height:100px;
    padding:8px;
    border:1px solid var(--line);
    border-radius:10px;
    background:rgba(255,255,255,.018);
    cursor:pointer;
}

.calendar-cell:hover {
    background:rgba(255,255,255,.045);
}

.calendar-cell.today {
    border-color:rgba(110,168,255,.55);
    box-shadow:inset 0 0 0 1px rgba(110,168,255,.2);
}

.calendar-cell.other {
    opacity:.35;
}

.calendar-number {
    font-size:12px;
    color:#b8c3d6;
}

.calendar-event {
    margin-top:5px;
    padding:4px 5px;
    border-radius:6px;
    background:rgba(110,168,255,.12);
    color:#acd0ff;
    font-size:10px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================================================
   TIMER
   ========================================================= */

.timer-card {
    text-align:center;
    padding:35px;
}

.timer-display {
    font-size:clamp(50px,10vw,105px);
    font-weight:800;
    letter-spacing:-.06em;
    font-variant-numeric:tabular-nums;
}

.timer-mode {
    color:var(--muted);
    margin-bottom:10px;
}

.timer-controls {
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:9px;
    margin-top:22px;
}

.timer-inputs {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    max-width:500px;
    margin:20px auto 0;
}

.timer-inputs input {
    text-align:center;
}

/* =========================================================
   NOVEL
   ========================================================= */

.novel-cover {
    height:90px;
    border-radius:12px;
    background:
        radial-gradient(circle at 30% 30%,rgba(255,255,255,.18),transparent 30%),
        linear-gradient(135deg,var(--accent2),var(--accent));
    display:flex;
    align-items:flex-end;
    padding:12px;
    font-weight:800;
    overflow:hidden;
}

.novel-card {
    display:flex;
    flex-direction:column;
    gap:11px;
}

.metric-row {
    display:flex;
    justify-content:space-between;
    gap:10px;
    color:var(--muted);
    font-size:12px;
}

.metric-row strong {
    color:white;
}

/* =========================================================
   GRAPH
   ========================================================= */

.chart {
    width:100%;
    height:190px;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:15px 4px 5px;
}

.bar-wrap {
    height:100%;
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:center;
    gap:5px;
}

.bar {
    width:100%;
    max-width:35px;
    min-height:2px;
    border-radius:6px 6px 2px 2px;
    background:linear-gradient(to top,var(--accent2),var(--accent));
}

.bar-label {
    color:var(--muted);
    font-size:9px;
}

/* =========================================================
   TABLE
   ========================================================= */

.table-wrap {
    overflow:auto;
}

.table {
    width:100%;
    border-collapse:collapse;
    font-size:12px;
}

.table th,
.table td {
    padding:10px;
    border-bottom:1px solid var(--line);
    text-align:left;
    white-space:nowrap;
}

.table th {
    color:#8290a8;
    font-weight:600;
}

/* =========================================================
   MODAL
   ========================================================= */

.modal-layer {
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.62);
    backdrop-filter:blur(8px);
}

.modal-layer.open {
    display:flex;
}

.modal {
    width:min(700px,96vw);
    max-height:90vh;
    overflow:auto;
    border:1px solid var(--line);
    border-radius:20px;
    background:#101827;
    box-shadow:0 30px 100px rgba(0,0,0,.5);
}

.modal-head {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 20px;
    border-bottom:1px solid var(--line);
}

.modal-head h3 {
    margin:0;
}

.modal-body {
    padding:20px;
}

.close {
    border:0;
    background:transparent;
    color:#94a0b6;
    font-size:23px;
}

/* =========================================================
   TOAST
   ========================================================= */

.toast-wrap {
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:5000;
    display:flex;
    flex-direction:column;
    gap:8px;
    width:min(350px,calc(100vw - 40px));
}

.toast {
    padding:13px 15px;
    border:1px solid var(--line);
    border-radius:13px;
    background:#141e31;
    box-shadow:var(--shadow);
    animation:toastIn .25s ease;
}

.toast small {
    display:block;
    color:var(--muted);
    margin-top:3px;
}

@keyframes toastIn {
    from {
        opacity:0;
        transform:translateY(12px);
    }
    to {
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================================================
   QUICK ADD
   ========================================================= */

.quick-add {
    position:fixed;
    right:24px;
    bottom:24px;
    z-index:30;
}

.quick-main {
    width:56px;
    height:56px;
    border-radius:18px;
    border:0;
    color:white;
    font-size:25px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 15px 35px rgba(60,80,180,.35);
}

.quick-menu {
    position:absolute;
    right:0;
    bottom:67px;
    display:none;

<script>
/* =========================================================
   NEXUS 2.1
   DATA CORE
   ========================================================= */

const STORAGE_KEY = "NEXUS_2_1_DATA";
const FIRST_BOOT_KEY = "NEXUS_2_1_BOOT";

const WALLPAPERS = {
    space: "radial-gradient(circle at 20% 20%,#243c74 0,transparent 30%),radial-gradient(circle at 80% 70%,#31245e 0,transparent 30%),linear-gradient(135deg,#02050c,#090d1b)",

    aurora: "radial-gradient(ellipse at 20% 80%,#23c6a8 0,transparent 35%),radial-gradient(ellipse at 80% 20%,#6b54db 0,transparent 35%),linear-gradient(#061019,#0a0719)",
    ocean: "radial-gradient(circle at 30% 20%,#2582b6 0,transparent 35%),linear-gradient(145deg,#021018,#06283d)",
    forest: "radial-gradient(circle at 30% 30%,#2c8d58 0,transparent 30%),linear-gradient(135deg,#04100a,#0b1c13)",

    sunrise: "radial-gradient(circle at 50% 80%,#ffce70 0,transparent 25%),linear-gradient(160deg,#17274d,#c66c72)",
    rain: "linear-gradient(145deg,#111a2b,#263c57)",
    snow: "radial-gradient(circle at 30% 30%,#bcd6ff 0,transparent 20%),linear-gradient(145deg,#172337,#45566f)",
    desert: "radial-gradient(circle at 65% 25%,#e4ad55 0,transparent 20%),linear-gradient(145deg,#2a1b12,#6c4022)",
    night: "radial-gradient(circle at 75% 25%,#d9e6ff 0,transparent 2%),radial-gradient(circle at 20% 40%,#b9ccff 0,transparent 1%),linear-gradient(145deg,#03050d,#0a1126)",
    sky: "linear-gradient(180deg,#19446c,#4d9fc5 55%,#b8e3ef)",
    cyber: "linear-gradient(135deg,#0b0016,#17002d 50%,#001c2b)",
    grid: "linear-gradient(rgba(90,140,255,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(90,140,255,.1) 1px,transparent 1px),#070c17",
    nebula: "radial-gradient(circle at 35% 35%,#b3408f 0,transparent 20%),radial-gradient(circle at 70% 60%,#4169cf 0,transparent 25%),#05060f",
    crimson: "radial-gradient(circle at 70% 40%,#a52b45 0,transparent 30%),linear-gradient(135deg,#100308,#260713)",
    minimal: "linear-gradient(135deg,#101522,#1a2030)",
    matrix: "linear-gradient(90deg,rgba(0,255,120,.06) 1px,transparent 1px),linear-gradient(rgba(0,255,120,.06) 1px,transparent 1px),#020804"
};

const DEFAULT_DATA = {
    profile: {
        name:"USER",
        xp:0,
        level:1,
        score:0,
        streak:0,
        created:new Date().toISOString()
    },

    tasks:[],
    notes:[],
    events:[],
    habits:[],
    missions:[],
    novels:[],
    episodes:[],
    ideas:[],
    games:[],
    studies:[],
    links:[],
    reminders:[],
    activity:[],
    trash:[],
    databases:[],

    timer:{
        mode:"countdown",
        running:false,
        paused:false,
        startedAt:null,
        endAt:null,
        elapsed:0,
        remaining:0,
        duration:1500,
        taskId:null,
        novelId:null,
        gameId:null,
        pomodoroPhase:"work",
        pomodoroWork:25*60,
        pomodoroBreak:5*60,
        pomodoroCycles:4,
        pomodoroCurrent:0,
        history:[]
    },

    settings:{
        theme:"dark",
        wallpaper:"space",
        customWallpaper:"",
        overlay:.78,
        blur:0,
        accent:"#6ea8ff",
        density:"normal",
        font:"system",
        sounds:true,
        notifications:true,
        reminders:true,
        boot:true,
        animations:true,
        dailyMission:true,
        sidebar:true
    }
};

let data = loadData();
let currentView = "home";
let calendarDate = new Date();
let editingId = null;
let saveTimer = null;
let searchTimer = null;

/* =========================================================
   DATA UTILITIES
   ========================================================= */

function clone(obj) {
    return JSON.parse(JSON.stringify(obj));
}

function loadData() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return clone(DEFAULT_DATA);

        const saved = JSON.parse(raw);

        return deepMerge(clone(DEFAULT_DATA), saved);
    } catch (error) {
        console.error(error);
        return clone(DEFAULT_DATA);
    }
}

function deepMerge(base, source) {
    if (!source || typeof source !== "object") {
        return base;
    }

    Object.keys(source).forEach(key => {
        if (
            source[key] &&
            typeof source[key] === "object" &&
            !Array.isArray(source[key]) &&
            base[key] &&
            typeof base[key] === "object" &&
            !Array.isArray(base[key])
        ) {
            base[key] = deepMerge(base[key], source[key]);
        } else {
            base[key] = source[key];
        }
    });

    return base;
}

function saveData() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (error) {
        console.warn("NEXUS storage error",error);
        toast("保存容量がいっぱいです");
    }
}

function saveSoon() {
    clearTimeout(saveTimer);

    saveTimer = setTimeout(() => {
        saveData();
    },300);
}

function uid(prefix="id") {
    return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
}

function nowISO() {
    return new Date().toISOString();
}

function todayISO() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");

    return `${y}-${m}-${day}`;
}

function dateOnly(value) {
    if (!value) return "";

    const d = new Date(value);

    if (Number.isNaN(d.getTime())) {
        return String(value).slice(0,10);
    }

    return d.toISOString().slice(0,10);
}

function formatDate(value) {
    if (!value) return "-";

    const d = new Date(value);

    if (Number.isNaN(d.getTime())) {
        return value;
    }

    return d.toLocaleDateString("ja-JP",{
        year:"numeric",
        month:"numeric",
        day:"numeric"
    });
}

function formatDateTime(value) {
    if (!value) return "-";

    const d = new Date(value);

    if (Number.isNaN(d.getTime())) {
        return value;
    }

    return d.toLocaleString("ja-JP",{
        month:"numeric",
        day:"numeric",
        hour:"2-digit",
        minute:"2-digit"
    });
}

function escapeHTML(value) {
    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function parseTags(value) {
    return String(value || "")
        .split(",")
        .map(x => x.trim())
        .filter(Boolean);
}

function tagsHTML(tags) {
    if (!tags || !tags.length) return "";

    return `
        <div class="tags">
            ${tags.map(tag => `<span class="tag">#${escapeHTML(tag)}</span>`).join("")}
        </div>
    `;
}

function sortNewest(a,b) {
    return new Date(b.updated || b.created || 0) - new Date(a.updated || a.created || 0);
}

function findById(collection,id) {
    return data[collection].find(item => item.id === id);
}

function removeFromCollection(collection,id) {
    const index = data[collection].findIndex(item => item.id === id);

    if (index === -1) {
        return null;
    }

    return data[collection].splice(index,1)[0];
}

function addTrash(type,item) {
    data.trash.push({
        id:uid("trash"),
        type,
        original:item,
        deletedAt:nowISO()
    });
}

function deleteItem(collection,id,type=collection) {
    const item = removeFromCollection(collection,id);

    if (!item) return;

    addTrash(type,item);

    logActivity("削除",`${type}「${item.title || item.name || "無題"}」をゴミ箱へ移動`);

    saveData();
    render();

    toast("ゴミ箱へ移動しました");
}

function restoreTrash(id) {
    const index = data.trash.findIndex(item => item.id === id);

    if (index === -1) return;

    const item = data.trash[index];

    if (!data[item.type]) {
        data[item.type] = [];
    }

    data[item.type].push(item.original);
    data.trash.splice(index,1);

    saveData();
    render();

    toast("復元しました");
}

function permanentDeleteTrash(id) {
    data.trash = data.trash.filter(item => item.id !== id);
    saveData();
    render();
}

function logActivity(action,detail) {
    data.activity.unshift({
        id:uid("activity"),
        action,
        detail,
        created:nowISO()
    });

    if (data.activity.length > 300) {
        data.activity.length = 300;
    }

    saveSoon();
}

function addXP(amount,reason="") {
    const oldLevel = data.profile.level;

    data.profile.xp += Math.max(0,Number(amount) || 0);
    data.profile.score += Math.max(0,Number(amount) || 0);

    while (data.profile.xp >= data.profile.level * 100) {
        data.profile.xp -= data.profile.level * 100;
        data.profile.level++;
    }

    if (data.profile.level > oldLevel) {
        toast(`LEVEL UP! Lv.${data.profile.level}`);
        playSound("level");
        logActivity("LEVEL UP",`Lv.${oldLevel} → Lv.${data.profile.level}`);
    }

    if (reason) {
        logActivity("XP",`+${amount} XP / ${reason}`);
    }

    saveSoon();
}

function completeTask(id) {
    const task = findById("tasks",id);

    if (!task || task.completed) return;

    task.completed = true;
    task.completedAt = nowISO();
    task.updated = nowISO();

    addXP(Number(task.xp) || 10,`タスク完了: ${task.title}`);
    logActivity("TASK COMPLETE",task.title);

    saveData();
    render();

    toast("タスク完了！");
    playSound("complete");
}

function reopenTask(id) {
    const task = findById("tasks",id);

    if (!task) return;

    task.completed = false;
    task.completedAt = null;
    task.updated = nowISO();

    saveData();
    render();
}

/* =========================================================
   SOUND
   ========================================================= */

let audioContext = null;

function getAudioContext() {
    if (!audioContext) {
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
            return null;
        }
    }

    return audioContext;
}

function playSound(type="click") {
    if (!data.settings.sounds) return;

    const ctx = getAudioContext();

    if (!ctx) return;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.connect(gain);
    gain.connect(ctx.destination);

    const configs = {
        click:[520,.045,.045],
        complete:[720,.08,.15],
        level:[480,.12,.22],
        notify:[640,.1,.12],
        error:[160,.1,.12]
    };

    const config = configs[type] || configs.click;

    osc.frequency.value = config[0];
    gain.gain.value = config[1];

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
        .001,
        ctx.currentTime + config[2]
    );

    osc.stop(ctx.currentTime + config[2]);
}

/* =========================================================
   TOAST
   ========================================================= */

function toast(message,detail="") {
    const wrap = document.getElementById("toastWrap");

    const node = document.createElement("div");

    node.className = "toast";

    node.innerHTML = `
        <strong>${escapeHTML(message)}</strong>
        ${detail ? `<small>${escapeHTML(detail)}</small>` : ""}
    `;

    wrap.appendChild(node);

    setTimeout(() => {
        node.remove();
    },3500);
}

/* =========================================================
   MODAL
   ========================================================= */

function openModal(title,html) {
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalBody").innerHTML = html;
    document.getElementById("modalLayer").classList.add("open");
}

function closeModal() {
    document.getElementById("modalLayer").classList.remove("open");
}

document.getElementById("modalLayer").addEventListener("click",event => {
    if (event.target.id === "modalLayer") {
        closeModal();
    }
});

/* =========================================================
   NAVIGATION
   ========================================================= */

function navigate(view) {
    currentView = view;

    const sidebar = document.getElementById("sidebar");
    const scroll = sidebar.scrollTop;

    document.querySelectorAll(".nav-item").forEach(item => {
        item.classList.toggle(
            "active",
            item.dataset.view === view
        );
    });

    render();

    requestAnimationFrame(() => {
        sidebar.scrollTop = scroll;
    });

    sidebar.classList.remove("mobile-open");
}

document.querySelectorAll(".nav-item").forEach(item => {
    item.addEventListener("click",() => {
        navigate(item.dataset.view);
    });
});

document.getElementById("mobileMenu").addEventListener("click",() => {
    document.getElementById("sidebar").classList.toggle("mobile-open");
});

document.getElementById("notificationButton").addEventListener("click",() => {
    navigate("notifications");
});

document.getElementById("quickButtonTop").addEventListener("click",() => {
    document.getElementById("quickAdd").classList.toggle("open");
});

document.getElementById("quickMain").addEventListener("click",() => {
    document.getElementById("quickAdd").classList.toggle("open");
});

/* =========================================================
   SEARCH
   ========================================================= */

document.getElementById("globalSearch").addEventListener("input",event => {
    clearTimeout(searchTimer);

    const value = event.target.value.trim();

    searchTimer = setTimeout(() => {
        if (value) {
            navigate("search");
        }
    },250);
});

/* =========================================================
   QUICK ADD
   ========================================================= */

function quickAdd(type) {
    document.getElementById("quickAdd").classList.remove("open");

    if (type === "task") {
        openTaskModal();
        return;
    }

    if (type === "note") {
        openNoteModal();
        return;
    }

    if (type === "event") {
        openEventModal();
        return;
    }

    if (type === "novel") {
        openNovelModal();
        return;
    }

    if (type === "game") {
        openGameModal();
        return;
    }

    if (type === "study") {
        openStudyModal();
        return;
    }

    if (type === "habit") {
        openHabitModal();
        return;
    }

    if (type === "idea") {
        openIdeaModal();
        return;
    }
}

/* =========================================================
   RENDER
   ========================================================= */

function render() {
    updateGlobalUI();

    const content = document.getElementById("content");

    const views = {
        home:renderHome,
        tasks:renderTasks,
        calendar:renderCalendar,
        habits:renderHabits,
        missions:renderMissions,
        notes:renderNotes,
        novels:renderNovels,
        ideas:renderIdeas,
        timer:renderTimer,
        study:renderStudy,
        games:renderGames,
        link:renderLink,
        database:renderDatabase,
        stats:renderStats,
        activity:renderActivity,
        notifications:renderNotifications,
        backup:renderBackup,
        trash:renderTrash,
        settings:renderSettings,
        search:renderSearch
    };

    content.innerHTML = (views[currentView] || renderHome)();
    bindDynamicEvents();
}

function updateGlobalUI() {
    document.getElementById("sideScore").textContent =
        Math.floor(data.profile.score).toLocaleString();

    document.getElementById("sideLevel").textContent =
        data.profile.level;

    const xpNeeded = data.profile.level * 100;

    const percent = Math.min(
        100,
        Math.round(data.profile.xp / xpNeeded * 100)
    );

    document.getElementById("sideXpBar").style.width = percent + "%";

    const pending = data.tasks.filter(x => !x.completed).length;

    document.getElementById("taskBadge").textContent = pending;

    document.body.classList.toggle(
        "light",
        data.settings.theme === "light"
    );

    document.body.classList.toggle(
        "compact",
        data.settings.density === "compact"
    );

    document.body.classList.toggle(
        "no-motion",
        !data.settings.animations
    );

    document.documentElement.style.setProperty(
        "--accent",
        data.settings.accent || "#6ea8ff"
    );

    const wallpaper = document.getElementById("wallpaper");

    if (data.settings.customWallpaper) {
        wallpaper.style.backgroundImage =
            `url("${data.settings.customWallpaper}")`;
    } else {
        wallpaper.style.backgroundImage =
            WALLPAPERS[data.settings.wallpaper] || WALLPAPERS.space;
    }

    wallpaper.style.filter =
        `blur(${Number(data.settings.blur) || 0}px)`;

    document.querySelector(".overlay").style.background =
        `rgba(3,5,12,${Number(data.settings.overlay) || .78})`;
}

/* =========================================================
   TASKS
   ========================================================= */

function renderTasks() {
    const pending = data.tasks.filter(x => !x.completed);
    const completed = data.tasks.filter(x => x.completed);

    return `
        ${pageHeader(
            "タスク",
            "予定・勉強・創作など、すべてのやることを管理。",
            `<button class="btn primary" onclick="openTaskModal()">＋ タスク追加</button>`
        )}

        <div class="grid grid-4" style="margin-bottom:16px">

            <div class="card stat-card">
                <div class="stat-label">未完了</div>
                <div class="stat-value">${pending.length}</div>
            </div>

            <div class="card stat-card">
                <div class="stat-label">完了</div>
                <div class="stat-value">${completed.length}</div>
            </div>

            <div class="card stat-card">
                <div class="stat-label">今日</div>
                <div class="stat-value">${pending.filter(x=>x.due===todayISO()).length}</div>
            </div>

            <div class="card stat-card">
                <div class="stat-label">合計XP</div>
                <div class="stat-value">
                    ${data.tasks.reduce((s,x)=>s+Number(x.xp||0),0)}
                </div>
            </div>

        </div>

        <div class="card">
            <div class="card-title">
                <h3>タスク一覧</h3>
                <div class="page-actions">
                    <button class="btn small" onclick="sortTasks('priority')">優先度順</button>
                    <button class="btn small" onclick="sortTasks('date')">期限順</button>
                </div>
            </div>

            <div class="list">
                ${
                    pending.length
                    ? pending.map(taskRowHTML).join("")
                    : `<div class="empty">未完了のタスクはありません</div>`
                }
            </div>
        </div>

        <div style="height:16px"></div>

        <div class="card">
            <div class="card-title">
                <h3>完了済み</h3>
                <span>${completed.length}件</span>
            </div>

            <div class="list">
                ${
                    completed.length
                    ? completed.slice(0,30).map(taskRowHTML).join("")
                    : `<div class="empty">完了したタスクはありません</div>`
                }
            </div>
        </div>
    `;
}

function taskRowHTML(task) {
    const priorityLabel = {
        high:"高",
        medium:"中",
        low:"低"
    }[task.priority] || "中";

    const overdue =
        !task.completed &&
        task.due &&
        task.due < todayISO();

    return `
        <div class="list-row">
            <button
                class="checkbox ${task.completed ? "checked" : ""}"
                onclick="toggleTask('${task.id}')"
            >
                ${task.completed ? "✓" : ""}
            </button>

            <div class="list-main">
                <strong>${escapeHTML(task.title)}</strong>
                <small>
                    ${task.due ? `期限 ${escapeHTML(task.due)}` : "期限なし"}
                    · XP ${Number(task.xp||0)}
                    ${overdue ? " · 期限超過" : ""}
                </small>

                ${tagsHTML(task.tags)}
            </div>

            <span class="${
                task.priority === "high"
                ? "danger-text"
                : task.priority === "low"
                ? "muted"
                : "warn-text"
            }">
                ${priorityLabel}
            </span>

            <button class="btn small" onclick="editTask('${task.id}')">編集</button>
            <button class="btn small danger" onclick="deleteItem('tasks','${task.id}','tasks')">×</button>
        </div>
    `;
}

function toggleTask(id) {
    const task = findById("tasks",id);

    if (!task) return;

    if (task.completed) {
        reopenTask(id);
    } else {
        completeTask(id);
    }
}

function sortTasks(mode) {
    if (mode === "priority") {
        const order = {high:0,medium:1,low:2};

        data.tasks.sort(
            (a,b)=>(order[a.priority]??1)-(order[b.priority]??1)
        );
    }

    if (mode === "date") {
        data.tasks.sort(
            (a,b)=>(a.due||"9999").localeCompare(b.due||"9999")
        );
    }

    saveData();
    render();
}

function editTask(id) {
    const task = findById("tasks",id);

    if (!task) return;

    openTaskModal(task);
}

function openTaskModal(task=null) {
    const isEdit = Boolean(task);

    openModal(
        isEdit ? "タスクを編集" : "タスクを追加",
        `
        <form class="form" onsubmit="saveTask(event,'${task?.id || ""}')">

            <div class="field">
                <label>タイトル</label>
                <input id="taskTitle" required value="${escapeHTML(task?.title || "")}" placeholder="数学ワーク">
            </div>

            <div class="form-row">

                <div class="field">
                    <label>期限</label>
                    <input id="taskDue" type="date" value="${task?.due || todayISO()}">
                </div>

                <div class="field">
                    <label>優先度</label>
                    <select id="taskPriority">
                        <option value="high" ${task?.priority==="high"?"selected":""}>高</option>
                        <option value="medium" ${!task || task?.priority==="medium"?"selected":""}>中</option>
                        <option value="low" ${task?.priority==="low"?"selected":""}>低</option>
                    </select>
                </div>

            </div>

            <div class="form-row">

                <div class="field">
                    <label>XP</label>
                    <input id="taskXP" type="number" min="0" value="${Number(task?.xp ?? 10)}">
                </div>

                <div class="field">
                    <label>カテゴリ</label>
                    <input id="taskCategory" value="${escapeHTML(task?.category || "")}" placeholder="勉強">
                </div>

            </div>

            <div class="field">
                <label>タグ</label>
                <input id="taskTags" value="${escapeHTML((task?.tags||[]).join(", "))}" placeholder="数学, テスト">
            </div>

            <div class="field">
                <label>メモ</label>
                <textarea id="taskDescription" placeholder="詳細">${escapeHTML(task?.description || "")}</textarea>
            </div>

            <div class="form-actions">
                <button type="button" class="btn" onclick="closeModal()">キャンセル</button>
                <button type="submit" class="btn primary">保存</button>
            </div>

        </form>
        `
    );
}

function saveTask(event,id) {
    event.preventDefault();

    const title = document.getElementById("taskTitle").value.trim();

    if (!title) return;

    let task;

    if (id) {
        task = findById("tasks",id);
    } else {
        task = {
            id:uid("task"),
            created:nowISO(),
            completed:false,
            completedAt:null
        };

        data.tasks.unshift(task);
    }

    task.title = title;
    task.due = document.getElementById("taskDue").value;
    task.priority = document.getElementById("taskPriority").value;
    task.xp = Number(document.getElementById("taskXP").value) || 0;
    task.category = document.getElementById("taskCategory").value.trim();
    task.tags = parseTags(document.getElementById("taskTags").value);
    task.description = document.getElementById("taskDescription").value;
    task.updated = nowISO();

    logActivity(
        id ? "TASK UPDATE" : "TASK CREATE",
        task.title
    );

    saveData();
    closeModal();
    render();

    toast(id ? "タスクを更新しました" : "タスクを追加しました");
}

/* =========================================================
   CALENDAR
   ========================================================= */

function renderCalendar() {
    const year = calendarDate.getFullYear();
    const month = calendarDate.getMonth();

    const first = new Date(year,month,1);
    const startDay = first.getDay();

    const days = new Date(year,month+1,0).getDate();

    let cells = "";

    for (let i=0;i<42;i++) {
        const dayNumber = i - startDay + 1;

        const cellDate = new Date(year,month,dayNumber);

        const inMonth =
            dayNumber >= 1 &&
            dayNumber <= days;

        const iso =
            cellDate.getFullYear() +
            "-" +
            String(cellDate.getMonth()+1).padStart(2,"0") +
            "-" +
            String(cellDate.getDate()).padStart(2,"0");

        const events = data.events.filter(
            event => dateOnly(event.date) === iso
        );

        const tasks = data.tasks.filter(
            task => task.due === iso
        );

        cells += `
            <div
                class="calendar-cell ${inMonth ? "" : "other"} ${iso===todayISO() ? "today":""}"
                onclick="openCalendarDate('${iso}')"
            >
                <div class="calendar-number">${cellDate.getDate()}</div>

                ${events.slice(0,3).map(event => `
                    <div class="calendar-event">
                        ${escapeHTML(event.title)}
                    </div>
                `).join("")}

                ${tasks.slice(0,2).map(task => `
                    <div
                        class="calendar-event"
                        style="background:rgba(83,216,138,.1);color:#83e7aa"
                    >
                        ✓ ${escapeHTML(task.title)}
                    </div>
                `).join("")}
            </div>
        `;
    }

    return `
        ${pageHeader(
            "カレンダー",
            "予定・期限・タスクを一つの時間軸で管理。",
            `<button class="btn primary" onclick="openEventModal()">＋ 予定追加</button>`
        )}

        <div class="card">

            <div class="calendar-head">

                <button class="btn" onclick="changeCalendar(-1)">←</button>

                <div class="calendar-title">
                    ${year}年${month+1}月
                </div>

                <button class="btn" onclick="changeCalendar(1)">→</button>

            </div>

            <div class="calendar-grid">

                ${["日","月","火","水","木","金","土"].map(day => `
                    <div class="calendar-weekday">${day}</div>
                `).join("")}

                ${cells}

            </div>

        </div>

        <div style="height:16px"></div>

        <div class="card">
            <div class="card-title">
                <h3>今月の予定</h3>
                <span>${data.events.filter(x=>{
                    const d=new Date(x.date);
                    return d.getFullYear()===year && d.getMonth()===month;
                }).length}件</span>
            </div>

            <div class="list">
                ${
                    data.events
                    .filter(x=>{
                        const d=new Date(x.date);
                        return d.getFullYear()===year && d.getMonth()===month;
                    })
                    .sort((a,b)=>new Date(a.date)-new Date(b.date))
                    .map(event => `
                        <div class="list-row">
                            <div class="nav-icon">□</div>
                            <div class="list-main">
                                <strong>${escapeHTML(event.title)}</strong>
                                <small>${formatDateTime(event.date)} ${escapeHTML(event.place||"")}</small>
                            </div>
                            <button class="btn small" onclick="editEvent('${event.id}')">編集</button>
                            <button class="btn small danger" onclick="deleteItem('events','${event.id}','events')">×</button>
                        </div>
                    `).join("") ||
                    `<div class="empty">予定はありません</div>`
                }
            </div>
        </div>
    `;
}

function changeCalendar(amount) {
    calendarDate.setMonth(calendarDate.getMonth()+amount);
    render();
}

function openCalendarDate(date) {
    openEventModal(null,date);
}

function openEventModal(event=null,date=todayISO()) {
    openModal(
        event ? "予定を編集" : "予定を追加",
        `
        <form class="form" onsubmit="saveEvent(event,'${event?.id || ""}')">

            <div class="field">
                <label>タイトル</label>
                <input id="eventTitle" required value="${escapeHTML(event?.title||"")}" placeholder="学校・予定・締切など">
            </div>

            <div class="form-row">

                <div class="field">
                    <label>日時</label>
                    <input id="eventDate" type="datetime-local" value="${event?.date ? localDateTimeValue(event.date) : `${date}T09:00`}">
                </div>

                <div class="field">
                    <label>場所</label>
                    <input id="eventPlace" value="${escapeHTML(event?.place||"")}" placeholder="学校">
                </div>

            </div>

            <div class="form-row">

                <div class="field">
                    <label>カテゴリ</label>
                    <input id="eventCategory" value="${escapeHTML(event?.category||"")}" placeholder="学校">
                </div>

                <div class="field">
                    <label>通知（分前）</label>
                    <input id="eventReminder" type="number" min="0" value="${Number(event?.reminder ?? 10)}">
                </div>

            </div>

            <div class="field">
                <label>詳細</label>
                <textarea id="eventDescription">${escapeHTML(event?.description||"")}</textarea>
            </div>

            <div class="form-actions">
                <button type="button" class="btn" onclick="closeModal()">キャンセル</button>
                <button class="btn primary">保存</button>
            </div>

        </form>
        `
    );
}

function localDateTimeValue(value) {
    const d = new Date(value);

    if (Number.isNaN(d.getTime())) return "";

    const local = new Date(
        d.getTime() - d.getTimezoneOffset()*60000
    );

    return local.toISOString().slice(0,16);
}

function saveEvent(event,id) {
    event.preventDefault();

    let item = id ? findById("events",id) : null;

    if (!item) {
        item = {
            id:uid("event"),
            created:nowISO()
        };

        data.events.push(item);
    }

    item.title = document.getElementById("eventTitle").value.trim();
    item.date = document.getElementById("eventDate").value;
    item.place = document.getElementById("eventPlace").value.trim();
    item.category = document.getElementById("eventCategory").value.trim();
    item.reminder = Number(document.getElementById("eventReminder").value)||0;
    item.description = document.getElementById("eventDescription").value;
    item.updated = nowISO();

    logActivity(
        id ? "EVENT UPDATE" : "EVENT CREATE",
        item.title
    );

    saveData();
    closeModal();
    render();

    toast(id ? "予定を更新しました" : "予定を追加しました");
}

function editEvent(id) {
    const event = findById("events",id);

    if (event) {
        openEventModal(event);
    }
}

/* =========================================================
   HABITS
   ========================================================= */

function renderHabits() {
    const today = todayISO();

    return `
        ${pageHeader(
            "習慣",
            "毎日の小さな行動を記録して、継続を可視化。",
            `<button class="btn primary" onclick="openHabitModal()">＋ 習慣追加</button>`
        )}

        <div class="grid grid-3">
            ${
                data.habits.length
                ? data.habits.map(habit => {

                    const done = Boolean(habit.history?.[today]);
                    const streak = calculateHabitStreak(habit);

                    return `
                        <div class="card">

                            <div class="card-title">
                                <h3>${escapeHTML(habit.title)}</h3>
                                <button class="btn small danger" onclick="deleteItem('habits','${habit.id}','habits')">×</button>
                            </div>

                            </button>

                        </div>
                    `;
                }).join("")
                : `<div class="empty" style="grid-column:1/-1">習慣を追加するとここに表示されます</div>`
            }

    `;
}

function calculateHabitStreak(habit) {
    let streak = 0;
    const d = new Date();

    while (true) {
        const iso = dateOnly(d.toISOString());

        if (!habit.history?.[iso]) {
            break;
        }

        streak++;

        d.setDate(d.getDate()-1);

        if (streak > 10000) break;
    }

    return streak;
}

function toggleHabit(id) {
    const habit = findById("habits",id);

    if (!habit) return;

    if (!habit.history) {
        habit.history = {};
    }

    const today = todayISO();

    if (habit.history[today]) {
        delete habit.history[today];
        toast("習慣記録を取り消しました");
    } else {
        habit.history[today] = true;
        addXP(Number(habit.xp||5),`習慣達成: ${habit.title}`);
        toast("習慣達成！");
        playSound("complete");
    }

    saveData();
    render();
}

    const today = todayISO();

    const hasToday = data.missions.some(

    if (hasToday) return;

    generateDailyMissions(today);
}

function generateDailyMissions(date=todayISO()) {
    data.missions = data.missions.filter(
        x => x.date !== date
    );

    const pool = [
        {
            title:"タスクを1つ完了",
            description:"今日のタスクを1つ完了させる。",
            type:"task",
            xp:15
        },
        {
            title:"勉強を30分記録",
            description:"30分以上の勉強記録を作る。",
            type:"study",
            xp:20
        },
        {
            title:"習慣を1つ達成",
            description:"今日の習慣を1つ達成する。",
            type:"habit",
            xp:15
        }
    ];

    pool.forEach(item => {
        data.missions.push({
            id:uid("mission"),
            date,
            title:item.title,
            description:item.description,
            type:item.type,
            xp:item.xp,
            progress:0,
            completedDate:null

    });

    saveData();
}

/* =========================================================
   TIMER
   ========================================================= */

let timerInterval = null;

function getTimerDisplaySeconds() {
    const timer = data.timer;

    if (timer.mode === "stopwatch") {
        if (!timer.running) {
            return Math.max(0,Number(timer.elapsed||0));
        }

        return Math.max(
            0,
            Math.floor(
                (Date.now() - Number(timer.startedAt || Date.now())) / 1000
            ) + Number(timer.elapsed||0)
        );
    }

    if (!timer.running) {
        return Math.max(0,Number(timer.remaining||timer.duration||0));
    }

    return Math.max(
        0,
        Math.ceil(
            (Number(timer.endAt)-Date.now())/1000
        )
    );
}

function formatTimerDisplay(seconds) {
    seconds = Math.max(0,Math.floor(seconds));

    const h = Math.floor(seconds/3600);
    const m = Math.floor((seconds%3600)/60);
    const s = seconds%60;

    if (h > 0) {
        return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
    }

    return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function changeTimerMode(mode) {
    if (data.timer.running) {
        toast("実行中はモードを変更できません");
        render();
        return;
    }

    data.timer.mode = mode;

    if (mode === "pomodoro") {
        data.timer.duration = 25*60;
        data.timer.remaining = 25*60;
        data.timer.pomodoroPhase = "work";
        data.timer.pomodoroCurrent = 0;
    }

    if (mode === "stopwatch") {
        data.timer.elapsed = 0;
    }

    saveData();
    render();
}

function setTimerMinutes(minutes) {
    if (data.timer.running) return;

    data.timer.mode = "countdown";
    data.timer.duration = minutes*60;
    data.timer.remaining = minutes*60;

    saveData();
    render();
}

function applyTimerSettings() {
    if (data.timer.running) {
        toast("タイマー実行中は設定できません");
        return;
    }

    const h =
        Number(document.getElementById("timerHours").value)||0;

    const m =
        Number(document.getElementById("timerMinutes").value)||0;

    const s =
        Number(document.getElementById("timerSeconds").value)||0;

    const seconds =
        h*3600+m*60+s;

    data.timer.duration = seconds;
    data.timer.remaining = seconds;

    data.timer.taskId =
        document.getElementById("timerTask").value || null;

    data.timer.novelId =
        document.getElementById("timerNovel").value || null;

    data.timer.gameId =
        document.getElementById("timerGame").value || null;

    if (data.timer.mode === "stopwatch") {
        data.timer.elapsed = 0;
    }

    saveData();
    render();

    toast("タイマー設定を適用しました");
}

function toggleTimer() {
    const timer = data.timer;

    if (timer.running && !timer.paused) {
        pauseTimer();
        return;
    }

    startTimer();
}

function startTimer() {
    const timer = data.timer;

    if (timer.mode === "countdown") {
        if (timer.remaining <= 0) {
            timer.remaining = timer.duration;
        }

        timer.endAt =
            Date.now() + timer.remaining*1000;
    }

    if (timer.mode === "pomodoro") {
        if (timer.remaining <= 0) {
            timer.remaining =
                timer.pomodoroPhase === "work"
                ? timer.pomodoroWork
                : timer.pomodoroBreak;
        }

        timer.endAt =
            Date.now() + timer.remaining*1000;
    }

    if (timer.mode === "stopwatch") {
        timer.startedAt = Date.now();
    }

    timer.running = true;
    timer.paused = false;

    saveData();

    startTimerLoop();
    render();

    toast("タイマー開始");
}

function pauseTimer() {
    const timer = data.timer;

    if (!timer.running) return;

    if (
        timer.mode === "countdown" ||
        timer.mode === "pomodoro"
    ) {
        timer.remaining = Math.max(
            0,
            Math.ceil(
                (Number(timer.endAt)-Date.now())/1000
            )
        );
    }

    if (timer.mode === "stopwatch") {
        timer.elapsed =
            Math.max(
                0,
                Math.floor(
                    (Date.now()-Number(timer.startedAt))/1000
                ) + Number(timer.elapsed||0)
            );
    }

    timer.running = true;
    timer.paused = true;

    saveData();
    render();

    toast("一時停止");
}

function resetTimer() {
    const timer = data.timer;

    timer.running = false;
    timer.paused = false;
    timer.startedAt = null;
    timer.endAt = null;
    timer.elapsed = 0;

    if (timer.mode === "stopwatch") {
        timer.remaining = 0;
    } else {
        timer.remaining = timer.mode === "pomodoro"
            ? timer.pomodoroPhase==="work"
                ? timer.pomodoroWork
                : timer.pomodoroBreak
            : timer.duration;
    }

    saveData();
    render();
}

function startTimerLoop() {
    clearInterval(timerInterval);

    timerInterval = setInterval(() => {
        if (!data.timer.running || data.timer.paused) {
            return;
        }

        const seconds = getTimerDisplaySeconds();

        if (
            data.timer.mode !== "stopwatch" &&
            seconds <= 0
        ) {
            timerFinished();
            return;
        }

        const display = document.getElementById("timerDisplay");

        if (display) {
            display.textContent =
                formatTimerDisplay(seconds);
        }

        saveSoon();
    },250);
}

function timerFinished() {
    const timer = data.timer;

    let seconds;

    if (timer.mode === "stopwatch") {
        seconds = getTimerDisplaySeconds();
    } else {
        seconds =
            timer.mode === "pomodoro"
            ? (
                timer.pomodoroPhase === "work"
                ? timer.pomodoroWork
                : timer.pomodoroBreak
            )
            : timer.duration;
    }

    const linkedTask = timer.taskId
        ? findById("tasks",timer.taskId)
        : null;

    const linkedNovel = timer.novelId
        ? findById("novels",timer.novelId)
        : null;

    const linkedGame = timer.gameId
        ? findById("games",timer.gameId)
        : null;

    const link =
        linkedTask ? `Task: ${linkedTask.title}` :
        linkedNovel ? `Novel: ${linkedNovel.title}` :
        linkedGame ? `Game: ${linkedGame.title}` :
        "";

    timer.history.unshift({
        id:uid("session"),
        seconds,
        type:timer.mode,
        link,
        created:nowISO(),
        xp:Math.max(1,Math.floor(seconds/60))
    });

    if (timer.history.length > 200) {
        timer.history.length = 200;
    }

    addXP(
        Math.max(1,Math.floor(seconds/60)),
        "タイマーセッション"
    );

    logActivity(
        "TIMER COMPLETE",
        formatTimerDisplay(seconds)
    );

    if (timer.mode === "pomodoro") {
        if (timer.pomodoroPhase === "work") {
            timer.pomodoroCurrent++;
            timer.pomodoroPhase = "break";
            timer.remaining = timer.pomodoroBreak;
        } else {
            timer.pomodoroPhase = "work";
            timer.remaining = timer.pomodoroWork;
        }

        timer.running = false;
        timer.paused = false;
        timer.endAt = null;
    } else {
        timer.running = false;
        timer.paused = false;
        timer.endAt = null;

        if (timer.mode === "countdown") {
            timer.remaining = timer.duration;
        }

        if (timer.mode === "stopwatch") {
            timer.elapsed = 0;
        }
    }

    saveData();

    playSound("complete");

    sendNotification(
        "NEXUS タイマー",
        "タイマーが終了しました。"
    );

    toast("タイマー終了！");
    render();
}

function studySubjectChart() {
    const map = {};

    data.studies.forEach(item => {
        map[item.subject] =
            (map[item.subject]||0)+Number(item.minutes||0);
    });

    const entries =
        Object.entries(map)
        .sort((a,b)=>b[1]-a[1])
        .slice(0,8);

    if (!entries.length) {
        return `<div class="empty">データがありません</div>`;
    }

    const max =
        Math.max(...entries.map(x=>x[1]),1);

    return `
        <div class="chart">
            ${entries.map(([name,value])=>`
                <div class="bar-wrap">
                    <div
                        class="bar"
                        style="height:${Math.max(4,value/max*100)}%"
                        title="${escapeHTML(name)}: ${value}分"
                    ></div>
                    <div class="bar-label">${escapeHTML(name).slice(0,7)}</div>
                </div>
            `).join("")}
        </div>
    `;
}

function saveDatabaseRow(event,id) {
    event.preventDefault();

    const db = findById("databases",id);

    if (!db) return;

    const row = {};

    db.fields.forEach((field,index)=>{
        row[field] =
            document.getElementById(`dbRow${index}`).value;
    });

    db.rows.push(row);

    saveData();
    closeModal();
    openDatabaseDetail(id);
}

function deleteDatabaseRow(id,index) {
    const db = findById("databases",id);

    if (!db) return;

    db.rows.splice(index,1);

    saveData();
    openDatabaseDetail(id);
}

function activityChart() {
    const days = [];

    for (let i=6;i>=0;i--) {
        const d = new Date();
        d.setDate(d.getDate()-i);

        const iso =
            d.getFullYear() +
            "-" +
            String(d.getMonth()+1).padStart(2,"0") +
            "-" +
            String(d.getDate()).padStart(2,"0");

        const count =
            data.activity.filter(
                x => dateOnly(x.created) === iso
            ).length;

        days.push({
            label:`${d.getMonth()+1}/${d.getDate()}`,
            count
        });
    }

    const max =
        Math.max(...days.map(x=>x.count),1);

    return `
        <div class="chart">

            ${days.map(day=>`
                <div class="bar-wrap">

                    <div
                        class="bar"
                        style="height:${Math.max(3,day.count/max*100)}%"
                        title="${day.count}件"
                    ></div>

                    <div class="bar-label">
                        ${day.label}
                    </div>

                </div>
            `).join("")}

        </div>
    `;
}

function requestNotificationPermission() {
    if (!("Notification" in window)) {
        toast("このブラウザは通知に対応していません");
        return;
    }

    Notification.requestPermission().then(permission => {

        if (permission === "granted") {
            data.settings.notifications = true;
            saveData();

            new Notification("NEXUS",{
                body:"通知が有効になりました。"
            });

            toast("通知を有効にしました");
        } else {
            toast("通知が許可されませんでした");
        }

        render();
    });
}

function sendNotification(title,body) {
    if (!data.settings.notifications) return;

    if (
        "Notification" in window &&
        Notification.permission === "granted"
    ) {
        try {
            new Notification(title,{body});
        } catch (e) {}
    }
}

function exportData() {
    const output = {
        ...data,
        exportedAt:nowISO(),
        version:"2.1"
    };

    const blob =
        new Blob(
            [JSON.stringify(output,null,2)],
            {type:"application/json"}
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;
    a.download =
        `NEXUS-2.1-backup-${todayISO()}.json`;

    a.click();

    URL.revokeObjectURL(url);

    toast("バックアップを書き出しました");
}

document.getElementById("importFile").addEventListener("change",event => {

    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = () => {

        try {

            const imported =
                JSON.parse(reader.result);

            data =
                deepMerge(
                    clone(DEFAULT_DATA),
                    imported
                );

            saveData();
            render();

            toast("バックアップを復元しました");

        } catch (error) {

            toast("JSONの読み込みに失敗しました");
            console.error(error);

        }

        event.target.value = "";
    };

    reader.readAsText(file);
});

function resetAllData() {
    const ok =
        confirm(
            "NEXUSのすべてのデータを削除します。\nこの操作は元に戻せません。"
        );

    if (!ok) return;

    localStorage.removeItem(STORAGE_KEY);

    data = clone(DEFAULT_DATA);

    saveData();
    render();

    toast("データを初期化しました");
}

function searchOpenResult(index) {
    const input =
        document.getElementById("globalSearch");

    const query =
        input?.value.trim().toLowerCase() || "";

        ["tasks",data.tasks],
        ["notes",data.notes],
        ["novels",data.novels],
        ["games",data.games],
        ["ideas",data.ideas]
    ];

    let count = 0;

    for (const [view,collection] of views) {

        for (const item of collection) {

            const text =
                `${item.title||""} ${item.description||""} ${item.content||""}`
                .toLowerCase();

                    return;

                count++;

        }
    }
}

/* =========================================================
   NOTIFICATION CHECKER
   ========================================================= */

function checkReminders() {
    if (!data.settings.reminders) {
        return;
    }

    const now = Date.now();

    data.reminders.forEach(reminder => {

        if (reminder.notified) {
            return;
        }

        const time =
            new Date(reminder.date).getTime();

        if (
            Number.isFinite(time) &&
            time <= now
        ) {

            reminder.notified = true;

            sendNotification(
                "NEXUS リマインダー",
                reminder.title
            );

            toast(
                reminder.title,
                "リマインダー"
            );

            logActivity(
                "REMINDER",
                reminder.title
            );

            saveSoon();
        }
    });

    data.events.forEach(event => {

        if (event.notified) {
            return;
        }

        const eventTime =
            new Date(event.date).getTime();

        const reminderTime =
            eventTime -
            Number(event.reminder||0)*60000;

        if (
            Number.isFinite(eventTime) &&
            reminderTime <= now
        ) {

            event.notified = true;

            sendNotification(
                "NEXUS 予定",
                event.title
            );

            saveSoon();
        }
    });
}

/* =========================================================
   DAILY STREAK
   ========================================================= */

function updateStreak() {
    const last =
        localStorage.getItem("NEXUS_LAST_ACTIVITY");

    const today =
        todayISO();

    if (last === today) {
        return;
    }

    if (last) {

        const previous =
            new Date(last);

        const current =
            new Date(today);

        const diff =
            Math.round(
                (current-previous)/86400000
            );

        if (diff === 1) {
            data.profile.streak++;
        } else if (diff > 1) {
            data.profile.streak = 1;
        }

    } else {
        data.profile.streak = 1;
    }

    localStorage.setItem(
        "NEXUS_LAST_ACTIVITY",
        today
    );

    saveSoon();
}

/* =========================================================
   SERVICE WORKER GENERATOR
   ========================================================= */

function enableOfflineMode() {
    if (!("serviceWorker" in navigator)) {
        return;
    }

    const worker = `
        const CACHE = "NEXUS-2.1";
        self.addEventListener("install",event => {
            self.skipWaiting();
        });
        self.addEventListener("activate",event => {
            event.waitUntil(self.clients.claim());
        });
        self.addEventListener("fetch",event => {
            event.respondWith(
                fetch(event.request).catch(
                    () => caches.match(event.request)
                )
            );
        });
    `;

    const blob =
        new Blob(
            [worker],
            {type:"text/javascript"}
        );

    const url =
        URL.createObjectURL(blob);

    navigator.serviceWorker
        .register(url)
        .catch(()=>{});
}

/* =========================================================
   QUICK DAILY MISSION PROGRESS
   ========================================================= */

function refreshMissionProgress() {
    const today = todayISO();

    data.missions
        .filter(m => m.date === today)
        .forEach(mission => {

            if (mission.completedDate === today) {
                return;
            }

            if (mission.type === "task") {
                const completed =
                    data.tasks.filter(
                        x =>
                            x.completed &&
                            dateOnly(x.completedAt) === today
                    ).length;

                mission.progress =
                    Math.min(100,completed*100);
            }

            if (mission.type === "study") {
                const minutes =
                    data.studies
                        .filter(x=>x.date===today)
                        .reduce(
                            (s,x)=>s+Number(x.minutes||0),
                            0
                        );

                mission.progress =
                    Math.min(100,minutes/30*100);
            }

            if (mission.type === "habit") {
                const completed =
                    data.habits.filter(
                        x=>x.history?.[today]
                    ).length;

                mission.progress =
                    Math.min(100,completed*100);
            }

            if (mission.progress >= 100) {
                mission.completedDate = today;
            }
        });

    saveSoon();
}

setInterval(refreshMissionProgress,5000);

/* =========================================================
   FUTURE-READY API
   ========================================================= */

const NexusAPI = {

    task(title,options={}) {

        const task = {
            id:uid("task"),
            title,
            due:options.due || "",
            priority:options.priority || "medium",
            xp:Number(options.xp || 10),
            tags:options.tags || [],
            description:options.description || "",
            completed:false,
            completedAt:null,
            created:nowISO(),
            updated:nowISO()
        };

        data.tasks.unshift(task);

        saveData();

        return task;
    },

    note(title,content="") {

        const note = {
            id:uid("note"),
            title,
            content,
            tags:[],
            created:nowISO(),
            updated:nowISO()
        };

        data.notes.unshift(note);

        saveData();

        return note;
    },

    study(subject,minutes,content="") {

        const study = {
            id:uid("study"),
            subject,
            minutes:Number(minutes)||0,
            content,
            date:todayISO(),
            created:nowISO()
        };

        data.studies.unshift(study);

        addXP(
            Math.max(1,Math.floor(study.minutes/5)),
            `勉強 ${study.minutes}分`
        );

        saveData();

        return study;
    },

    score() {
        return data.profile.score;
    },

    level() {
        return data.profile.level;
    },

    export() {
        exportData();
    }

};
