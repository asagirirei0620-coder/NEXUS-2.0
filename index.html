<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXUS">
<link rel="manifest" href="manifest.json">
<title>NEXUS 2.0</title>

<style>
:root{
  --bg:#0b1020;
  --panel:#121a2d;
  --panel2:#182238;
  --panel3:#202c46;
  --text:#f3f6ff;
  --muted:#8e9ab5;
  --line:#293653;
  --accent:#6c7cff;
  --accent2:#8d9aff;
  --danger:#ff5f6d;
  --success:#38d39f;
  --warning:#ffbd59;
  --radius:18px;
  --shadow:0 12px 35px rgba(0,0,0,.2);
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{color:inherit}
.hidden{display:none!important}

.app{
  min-height:100vh;
  display:flex;
}

.sidebar{
  width:260px;
  background:rgba(12,18,34,.96);
  border-right:1px solid var(--line);
  position:fixed;
  inset:0 auto 0 0;
  z-index:100;
  padding:18px 12px;
  overflow:auto;
  transition:.25s;
}

.logo{
  font-size:25px;
  font-weight:900;
  padding:8px 12px 18px;
  letter-spacing:2px;
}

.logo small{
  display:block;
  color:var(--muted);
  font-size:10px;
  letter-spacing:1px;
  margin-top:3px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.nav button{
  border:0;
  background:transparent;
  color:#aeb8cf;
  text-align:left;
  padding:11px 13px;
  border-radius:12px;
  transition:.15s;
}

.nav button:hover,
.nav button.active{
  background:var(--panel2);
  color:white;
}

.nav-group{
  color:#586680;
  font-size:10px;
  padding:14px 12px 5px;
  letter-spacing:1px;
  text-transform:uppercase;
}

.main{
  margin-left:260px;
  width:calc(100% - 260px);
  min-width:0;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  height:70px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 22px;
  background:rgba(11,16,32,.86);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}

.menu-btn{display:none}

.search{
  flex:1;
  max-width:600px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:13px;
  padding:11px 15px;
  color:white;
  outline:none;
}

.top-actions{
  margin-left:auto;
  display:flex;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:1px solid var(--line);
  background:var(--panel);
  color:white;
  border-radius:12px;
}

.content{
  max-width:1600px;
  margin:auto;
  padding:25px;
}

.page-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.page-head h1{
  margin:0;
  font-size:28px;
}

.page-head p{
  margin:5px 0 0;
  color:var(--muted);
}

.btn{
  border:1px solid var(--line);
  background:var(--panel2);
  color:white;
  border-radius:11px;
  padding:10px 14px;
}

.btn:hover{filter:brightness(1.12)}
.btn.primary{background:var(--accent);border-color:var(--accent)}
.btn.danger{background:rgba(255,95,109,.15);color:#ff8791}
.btn.success{background:rgba(56,211,159,.14);color:#5ee6b8}
.btn.warning{background:rgba(255,189,89,.13);color:#ffd27d}

.grid{
  display:grid;
  gap:16px;
}

.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

.card{
  background:linear-gradient(145deg,var(--panel),rgba(18,26,45,.75));
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
  box-shadow:var(--shadow);
}

.card h2,.card h3{
  margin:0 0 12px;
}

.stat{
  min-height:120px;
}

.stat-label{
  color:var(--muted);
  font-size:13px;
}

.stat-value{
  font-size:31px;
  font-weight:800;
  margin-top:12px;
}

.stat-sub{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.progress{
  height:8px;
  background:#28334d;
  border-radius:99px;
  overflow:hidden;
}

.progress i{
  display:block;
  height:100%;
  background:var(--accent);
  border-radius:99px;
}

.list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.list-item{
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(255,255,255,.02);
}

.list-item:hover{background:rgba(255,255,255,.04)}

.row{
  display:flex;
  align-items:center;
  gap:10px;
}

.between{
  justify-content:space-between;
}

.wrap{flex-wrap:wrap}

.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:10px}

.badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:4px 8px;
  border-radius:99px;
  font-size:11px;
  background:var(--panel3);
  color:#c8d1e8;
}

.badge.accent{background:rgba(108,124,255,.15);color:#aab3ff}
.badge.success{background:rgba(56,211,159,.14);color:#64e9bb}
.badge.warning{background:rgba(255,189,89,.14);color:#ffd07a}
.badge.danger{background:rgba(255,95,109,.14);color:#ff9099}

input,textarea,select{
  width:100%;
  background:#0d1527;
  border:1px solid var(--line);
  color:white;
  border-radius:10px;
  padding:10px 11px;
  outline:none;
}

textarea{
  min-height:140px;
  resize:vertical;
}

input:focus,textarea:focus,select:focus{
  border-color:var(--accent);
}

label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:5px;
}

.field{
  margin-bottom:13px;
}

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  backdrop-filter:blur(5px);
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal{
  width:min(720px,100%);
  max-height:92vh;
  overflow:auto;
  background:#111a2e;
  border:1px solid var(--line);
  border-radius:22px;
  padding:22px;
  box-shadow:0 30px 80px rgba(0,0,0,.5);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.modal-head h2{margin:0}

.close{
  border:0;
  background:transparent;
  color:#aeb8cf;
  font-size:24px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.full{grid-column:1/-1}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:3000;
  background:#151f35;
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px 17px;
  box-shadow:var(--shadow);
  transform:translateY(20px);
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  transform:none;
  opacity:1;
}

.empty{
  padding:35px;
  text-align:center;
  color:var(--muted);
}

.check{
  width:20px;
  height:20px;
  accent-color:var(--accent);
}

.task-done{
  text-decoration:line-through;
  opacity:.55;
}

.priority-high{border-left:4px solid var(--danger)}
.priority-mid{border-left:4px solid var(--warning)}
.priority-low{border-left:4px solid var(--success)}

.calendar-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  border-top:1px solid var(--line);
  border-left:1px solid var(--line);
}

.cal-day{
  min-height:120px;
  padding:8px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.01);
}

.cal-day.other{opacity:.35}
.cal-day.today{background:rgba(108,124,255,.09)}

.cal-num{
  font-size:12px;
  color:var(--muted);
  margin-bottom:5px;
}

.cal-event{
  font-size:10px;
  padding:4px 5px;
  border-radius:6px;
  background:rgba(108,124,255,.18);
  margin-top:4px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.view-tabs{
  display:flex;
  gap:5px;
  margin-bottom:12px;
}

.view-tabs button{
  border:1px solid var(--line);
  background:var(--panel);
  color:#aab5ce;
  padding:8px 12px;
  border-radius:9px;
}

.view-tabs button.active{
  background:var(--accent);
  color:white;
}

.timer{
  text-align:center;
  padding:35px;
}

.timer-display{
  font-size:80px;
  font-weight:900;
  letter-spacing:3px;
  margin:20px 0;
}

.timer-mode{
  display:flex;
  justify-content:center;
  gap:6px;
}

.timer-mode button{
  border:1px solid var(--line);
  background:var(--panel2);
  color:white;
  border-radius:10px;
  padding:9px 13px;
}

.timer-mode button.active{
  background:var(--accent);
}

.chart{
  width:100%;
  height:230px;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding-top:15px;
}

.bar{
  flex:1;
  min-width:4px;
  position:relative;
  background:var(--accent);
  border-radius:6px 6px 0 0;
}

.bar span{
  position:absolute;
  bottom:-20px;
  left:50%;
  transform:translateX(-50%);
  font-size:9px;
  color:var(--muted);
}

.bar em{
  position:absolute;
  top:-17px;
  left:50%;
  transform:translateX(-50%);
  font-size:9px;
  color:var(--muted);
  font-style:normal;
}

.drag{
  cursor:grab;
}

.dashboard-card.dragging{
  opacity:.35;
}

.custom-field{
  display:grid;
  grid-template-columns:1fr 130px 1fr auto;
  gap:8px;
  align-items:end;
}

.toggle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:11px 0;
  border-bottom:1px solid var(--line);
}

.toggle input{
  width:auto;
}

.quick{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.quick button{
  padding:15px 8px;
  border:1px solid var(--line);
  background:var(--panel2);
  color:white;
  border-radius:14px;
}

.kpi{
  font-size:12px;
  color:var(--muted);
}

.level{
  font-size:14px;
  color:#bfc8ff;
}

@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:850px){
  .sidebar{
    transform:translateX(-100%);
  }
  .sidebar.open{transform:none}
  .main{
    margin-left:0;
    width:100%;
  }
  .menu-btn{display:block}
  .g2,.g3{grid-template-columns:1fr}
  .content{padding:16px}
  .topbar{padding:10px 13px}
  .search{max-width:none}
  .form-grid{grid-template-columns:1fr}
  .full{grid-column:auto}
  .calendar-grid{min-width:700px}
  .calendar-wrap{overflow:auto}
  .quick{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:520px){
  .g4{grid-template-columns:1fr}
  .top-actions .icon-btn:nth-child(2){display:none}
  .timer-display{font-size:55px}
}
</style>
</head>

<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script>
"use strict";

/* =========================================================
   NEXUS 2.0 FULL
   local-first / PWA / dashboard / tasks / notes / calendar /
   timer / novels / games / study / habits / tags / link /
   stats / activity / custom DB / trash / history / settings
========================================================= */

const KEY="NEXUS_2_FULL";
const VERSION=2.0;

const DEFAULT={
  version:VERSION,
  tasks:[],
  notes:[],
  events:[],
  novels:[],
  episodes:[],
  games:[],
  studies:[],
  habits:[],
  habitLogs:[],
  links:[],
  tags:[],
  activity:[],
  timerSessions:[],
  customDB:[],
  trash:[],
  xp:0,
  level:1,
  achievements:[],
  dashboard:[
    "welcome","stats","quick","tasks","calendar","timer","novels","games"
  ],
  settings:{
    dark:true,
    accent:"#6c7cff",
    density:"normal",
    animations:true,
    sounds:true,
    notifications:false,
    autoSave:true,
    confirmDelete:true,
    dashboardWelcome:true,
    sidebarCompact:false
  },
  calendar:{
    year:new Date().getFullYear(),
    month:new Date().getMonth()
  }
};

let db=loadDB();
let currentPage="dashboard";
let timer={
  mode:"countdown",
  running:false,
  seconds:25*60,
  total:25*60,
  interval:null,
  linkedType:"",
  linkedId:""
};
let draggedDashboard=null;

function clone(x){return JSON.parse(JSON.stringify(x));}

function loadDB(){
  try{
    const saved=JSON.parse(localStorage.getItem(KEY));
    if(!saved)return clone(DEFAULT);
    return mergeDefaults(clone(DEFAULT),saved);
  }catch(e){
    return clone(DEFAULT);
  }
}

function mergeDefaults(base,src){
  Object.keys(src||{}).forEach(k=>{
    if(src[k]!==undefined){
      if(
        typeof base[k]==="object" &&
        base[k]!==null &&
        !Array.isArray(base[k]) &&
        typeof src[k]==="object" &&
        !Array.isArray(src[k])
      ) base[k]=Object.assign(base[k],src[k]);
      else base[k]=src[k];
    }
  });
  return base;
}

function save(){
  localStorage.setItem(KEY,JSON.stringify(db));
}

function uid(prefix="id"){
  return prefix+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);
}

function nowISO(){
  return new Date().toISOString();
}

function today(){
  const d=new Date();
  return d.toISOString().slice(0,10);
}

function esc(v){
  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function fmtDate(v){
  if(!v)return "-";
  const d=new Date(v);
  if(Number.isNaN(d.getTime()))return v;
  return d.toLocaleDateString("ja-JP");
}

function fmtDateTime(v){
  if(!v)return "-";
  const d=new Date(v);
  if(Number.isNaN(d.getTime()))return v;
  return d.toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
}

function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;
  el.classList.add("show");
  clearTimeout(toast.t);
  toast.t=setTimeout(()=>el.classList.remove("show"),2200);
}

function logActivity(type,text,meta={}){
  db.activity.unshift({
    id:uid("act"),
    type,
    text,
    meta,
    at:nowISO()
  });
  db.activity=db.activity.slice(0,500);
}

function addXP(amount,reason){
  db.xp+=amount;
  while(db.xp>=levelNeed(db.level)){
    db.xp-=levelNeed(db.level);
    db.level++;
    achievement("level_"+db.level,"LEVEL "+db.level);
  }
  logActivity("xp",`+${amount} XP ${reason||""}`);
}

function levelNeed(level){
  return 100+((level-1)*50);
}

function achievement(id,title){
  if(db.achievements.some(x=>x.id===id))return;
  db.achievements.push({id,title,at:nowISO()});
  toast("🏆 "+title);
}

function ensureTag(name){
  name=String(name||"").trim();
  if(!name)return null;
  let t=db.tags.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!t){
    t={id:uid("tag"),name,color:db.settings.accent};
    db.tags.push(t);
  }
  return t.id;
}

function tagsFromString(s){
  return String(s||"")
    .split(/[,\s#]+/)
    .map(x=>x.trim())
    .filter(Boolean)
    .map(ensureTag);
}

function tagsText(ids){
  return (ids||[])
    .map(id=>db.tags.find(t=>t.id===id)?.name)
    .filter(Boolean)
    .map(x=>"#"+x)
    .join(" ");
}

function findAny(type,id){
  const map={
    task:"tasks",note:"notes",event:"events",
    novel:"novels",episode:"episodes",game:"games",
    study:"studies",habit:"habits",custom:"customDB"
  };
  return db[map[type]||type]?.find(x=>x.id===id);
}

function entityLabel(type,obj){
  if(!obj)return "-";
  return obj.title||obj.name||obj.subject||obj.text||"無題";
}

function entityOptions(type){
  const map={
    task:["tasks","タスク"],
    note:["notes","ノート"],
    event:["events","予定"],
    novel:["novels","小説"],
    episode:["episodes","エピソード"],
    game:["games","ゲーム"],
    study:["studies","学習"],
    habit:["habits","習慣"],
    custom:["customDB","データ"]
  };
  const [arr]=map[type]||[];
  return (db[arr]||[]).map(x=>`<option value="${esc(x.id)}">${esc(entityLabel(type,x))}</option>`).join("");
}

function openModal(title,html,onSave){
  const root=document.getElementById("modalRoot");
  root.innerHTML=`
    <div class="modal-bg" id="modalBg">
      <div class="modal">
        <div class="modal-head">
          <h2>${title}</h2>
          <button class="close" onclick="closeModal()">×</button>
        </div>
        <div id="modalBody">${html}</div>
        <div class="row" style="justify-content:flex-end;margin-top:18px">
          <button class="btn" onclick="closeModal()">キャンセル</button>
          <button class="btn primary" id="modalSave">保存</button>
        </div>
      </div>
    </div>`;
  document.getElementById("modalSave").onclick=()=>{
    if(onSave()!==false)closeModal();
  };
}

function closeModal(){
  document.getElementById("modalRoot").innerHTML="";
}

function confirmDelete(){
  return !db.settings.confirmDelete || confirm("削除しますか？ゴミ箱から復元できます。");
}

function trashItem(type,id){
  const map={
    task:"tasks",note:"notes",event:"events",
    novel:"novels",episode:"episodes",game:"games",
    study:"studies",habit:"habits",custom:"customDB"
  };
  const arr=db[map[type]];
  const index=arr.findIndex(x=>x.id===id);
  if(index<0)return;
  if(!confirmDelete())return;
  const item=arr.splice(index,1)[0];
  db.trash.push({
    id:uid("trash"),
    type,
    originalId:id,
    data:item,
    deletedAt:nowISO()
  });
  logActivity("delete",`${entityLabel(type,item)}をゴミ箱へ`);
  save();
  render();
}

function restoreTrash(id){
  const i=db.trash.findIndex(x=>x.id===id);
  if(i<0)return;
  const x=db.trash.splice(i,1)[0];
  const map={
    task:"tasks",note:"notes",event:"events",
    novel:"novels",episode:"episodes",game:"games",
    study:"studies",habit:"habits",custom:"customDB"
  };
  db[map[x.type]].push(x.data);
  logActivity("restore",`${entityLabel(x.type,x.data)}を復元`);
  save();
  render();
}

function permanentTrash(id){
  if(!confirm("完全削除します。この操作は元に戻せません。"))return;
  db.trash=db.trash.filter(x=>x.id!==id);
  save();
  render();
}

function duplicate(obj){
  const x=clone(obj);
  x.id=uid("copy");
  x.createdAt=nowISO();
  x.updatedAt=nowISO();
  return x;
}

function editHistory(obj,type){
  obj.history=obj.history||[];
  obj.history.unshift({
    id:uid("hist"),
    at:nowISO(),
    data:clone(obj)
  });
  obj.history=obj.history.slice(0,30);
}

function audioBeep(){
  if(!db.settings.sounds)return;
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return;
    const c=new C();
    const o=c.createOscillator();
    const g=c.createGain();
    o.frequency.value=880;
    g.gain.value=.05;
    o.connect(g);g.connect(c.destination);
    o.start();
    o.stop(c.currentTime+.15);
  }catch(e){}
}

function notify(title,body){
  if("Notification" in window && Notification.permission==="granted"){
    new Notification(title,{body});
  }
}

/* =========================================================
   SHELL
========================================================= */

const NAV=[
  ["dashboard","⌂","ダッシュボード","MAIN"],
  ["tasks","✓","タスク"],

          <button class="icon-btn menu-btn" onclick="toggleSidebar()">☰</button>

            <button class="icon-btn" onclick="toggleTheme()">☾</button>

function toggleSidebar(){

}

function applySettings(){
  document.documentElement.style.setProperty("--accent",db.settings.accent);
  document.documentElement.style.setProperty("--accent2",db.settings.accent);
  document.body.classList.toggle("animations-off",!db.settings.animations);
}

function toggleTheme(){
  db.settings.dark=!db.settings.dark;
  if(db.settings.dark){
    document.documentElement.style.setProperty("--bg","#0b1020");
    document.documentElement.style.setProperty("--panel","#121a2d");
    document.documentElement.style.setProperty("--panel2","#182238");
    document.documentElement.style.setProperty("--text","#f3f6ff");
  }else{
    document.documentElement.style.setProperty("--bg","#eef2f8");
    document.documentElement.style.setProperty("--panel","#ffffff");
    document.documentElement.style.setProperty("--panel2","#e9eef7");
    document.documentElement.style.setProperty("--text","#111827");
  }
  save();
  render();
}

function taskRows(limit=99,todayOnly=false){
  let arr=db.tasks.filter(t=>!todayOnly || t.due===today());
  arr.sort((a,b)=>{
    if(a.done!==b.done)return a.done?1:-1;
    return String(a.due||"9999").localeCompare(String(b.due||"9999"));
  });
  return arr.slice(0,limit).map(t=>`
    <div class="list-item ${t.done?"":"priority-"+(t.priority||"low")}">
      <div class="row between">
        <div class="row" style="min-width:0">
          <input class="check" type="checkbox" ${t.done?"checked":""} onchange="toggleTask('${t.id}')">
          <div style="min-width:0">
            <div class="${t.done?"task-done":""}"><strong>${esc(t.title)}</strong></div>
            <div class="small muted">${t.due?esc(t.due):"期限なし"} ${tagsText(t.tags)}</div>
          </div>
        </div>
        <div class="row">
          <button class="btn" onclick="openTask('${t.id}')">編集</button>
          <button class="btn danger" onclick="trashItem('task','${t.id}')">×</button>
        </div>
      </div>
    </div>`).join("");
}

function toggleTask(id){
  const t=db.tasks.find(x=>x.id===id);
  if(!t)return;
  t.done=!t.done;
  t.completedAt=t.done?nowISO():null;
  t.updatedAt=nowISO();
  if(t.done){
    addXP(10,"タスク完了");
    achievement("first_task","FIRST TASK");
  }
  logActivity("task",`${t.done?"完了":"未完了に戻した"}: ${t.title}`);
  save();render();
}

function calendarPage(){
  const y=db.calendar.year,m=db.calendar.month;
  const first=new Date(y,m,1);
  const start=new Date(y,m,1-first.getDay());
  const cells=[];
  for(let i=0;i<42;i++){
    const d=new Date(start);
    d.setDate(start.getDate()+i);
    const iso=d.toISOString().slice(0,10);
    const events=db.events.filter(e=>e.date===iso);
    const tasks=db.tasks.filter(t=>t.due===iso&&!t.done);
    cells.push(`
      <div class="cal-day ${d.getMonth()!==m?"other":""} ${iso===today()?"today":""}" onclick="openEvent(null,'${iso}')">
        <div class="cal-num">${d.getDate()}</div>
        ${events.map(e=>`<div class="cal-event">${esc(e.title)}</div>`).join("")}
        ${tasks.slice(0,3).map(t=>`<div class="cal-event" style="background:rgba(56,211,159,.13)">✓ ${esc(t.title)}</div>`).join("")}
      </div>`);
  }
  return `
    <div class="page-head">
      <div><h1>Calendar</h1><p>予定とタスクをまとめて管理</p></div>
      <button class="btn primary" onclick="openEvent()">＋ 予定</button>
    </div>
    <div class="view-tabs">
      <button class="active">月</button>
      <button onclick="calendarSimpleView('week')">週</button>
      <button onclick="calendarSimpleView('day')">日</button>
    </div>
    <div class="card">
      <div class="calendar-head">
        <div class="row">
          <button class="btn" onclick="changeMonth(-1)">‹</button>
          <strong style="min-width:130px;text-align:center">${y}年 ${m+1}月</strong>
          <button class="btn" onclick="changeMonth(1)">›</button>
        </div>
        <button class="btn" onclick="goTodayCalendar()">今日</button>
      </div>
      <div class="calendar-wrap">
        <div style="display:grid;grid-template-columns:repeat(7,1fr);min-width:700px">
          ${["日","月","火","水","木","金","土"].map(x=>`<div style="padding:8px;text-align:center;color:var(--muted);font-size:12px">${x}</div>`).join("")}
        </div>
        <div class="calendar-grid" style="min-width:700px">${cells.join("")}</div>
      </div>
    </div>`;
}

function changeMonth(n){
  db.calendar.month+=n;
  if(db.calendar.month<0){db.calendar.month=11;db.calendar.year--}
  if(db.calendar.month>11){db.calendar.month=0;db.calendar.year++}
  save();render();
}

function goTodayCalendar(){
  const d=new Date();
  db.calendar.year=d.getFullYear();
  db.calendar.month=d.getMonth();
  save();render();
}

  openModal(mode==="week"?"週間ビュー":"日別ビュー",`

        <div class="list-item">
          <div class="row between"><strong>${esc(e.title)}</strong><span class="badge">${esc(e.date)} ${esc(e.time||"")}</span></div>
          <div class="small muted">${esc(e.place||"")}</div>

function timerText(){
  const s=Math.max(0,timer.seconds);
  const h=Math.floor(s/3600);
  const m=Math.floor((s%3600)/60);
  const sec=s%60;
  return h>0
    ?`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`
    :`${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

function setTimerMode(mode){
  pauseTimer();
  timer.mode=mode;
  timer.seconds=mode==="countdown"?25*60:0;
  timer.total=timer.seconds;
  render();
}

function setPreset(min){
  pauseTimer();
  timer.seconds=min*60;
  timer.total=timer.seconds;
  render();
}

function startTimer(){
  if(timer.running)return;
  if(timer.mode==="countdown"&&timer.seconds<=0)return;
  timer.running=true;
  timer.interval=setInterval(()=>{
    if(timer.mode==="countdown"){
      timer.seconds--;
      if(timer.seconds<=0){
        timer.seconds=0;
        pauseTimer();
        audioBeep();
        notify("NEXUS Timer","タイマーが終了しました");
        toast("⏱ タイマー終了");
      }
    }else{
      timer.seconds++;
    }
    if(currentPage==="timer"||currentPage==="dashboard")render();
  },1000);
  render();
}

function pauseTimer(){
  timer.running=false;
  if(timer.interval)clearInterval(timer.interval);
  timer.interval=null;
  render();
}

function resetTimer(){
  pauseTimer();
  timer.seconds=timer.mode==="countdown"?timer.total:0;
  render();
}

function finishTimer(){
  const elapsed=timer.mode==="countdown"
    ?Math.max(0,timer.total-timer.seconds)
    :timer.seconds;
  const minutes=elapsed/60;
  if(minutes<.1){toast("記録できる時間がありません");return}
  const target=findAny(timer.linkedType,timer.linkedId);
  db.timerSessions.unshift({
    id:uid("timer"),
    seconds:elapsed,
    minutes,
    at:nowISO(),
    linkedType:timer.linkedType,
    linkedId:timer.linkedId,
    linkLabel:target?entityLabel(timer.linkedType,target):""
  });
  if(timer.linkedType==="game"&&target){
    target.playMinutes=Number(target.playMinutes||0)+minutes;
  }
  addXP(Math.max(1,Math.floor(minutes/5)),"タイマー");
  logActivity("timer",`${Math.round(minutes)}分のセッションを記録`);
  save();
  resetTimer();
  toast("セッションを記録しました");
}

function habitRate(){
  if(!db.habits.length)return 0;
  const days=[];
  for(let i=0;i<7;i++){
    const d=new Date();
    d.setDate(d.getDate()-i);
    days.push(d.toISOString().slice(0,10));
  }
  const possible=db.habits.length*7;
  const done=db.habitLogs.filter(x=>days.includes(x.date)).length;
  return Math.round(done/possible*100)||0;
}

function countTag(id){
  let n=0;
  ["tasks","notes","novels"].forEach(k=>db[k].forEach(x=>{if((x.tags||[]).includes(id))n++}));
  return n;
}

function openTag(){
  openModal("タグ作成",`
    <div class="field"><label>タグ名</label><input id="tagName"></div>
    <div class="field"><label>色</label><input id="tagColor" type="color" value="${db.settings.accent}"></div>
  `,()=>{
    const name=document.getElementById("tagName").value.trim();
    if(!name)return false;
    if(db.tags.some(x=>x.name.toLowerCase()===name.toLowerCase())){
      toast("同じタグがあります");return false;
    }
    db.tags.push({id:uid("tag"),name,color:document.getElementById("tagColor").value});
    save();render();
  });
}

function deleteTag(id){
  if(!confirm("タグを削除しますか？"))return;
  db.tags=db.tags.filter(x=>x.id!==id);
  ["tasks","notes","novels"].forEach(k=>{
    db[k].forEach(x=>x.tags=(x.tags||[]).filter(t=>t!==id));
  });
  save();render();
}

function showTag(id){
  const t=db.tags.find(x=>x.id===id);
  if(!t)return;
  const found=[];
  ["tasks","notes","novels"].forEach(k=>{
    db[k].forEach(x=>{
      if((x.tags||[]).includes(id))found.push({...x,_type:k});
    });
  });
  openModal("#"+t.name,`
    <div class="list">
      ${found.map(x=>`
        <div class="list-item">
          <span class="badge">${x._type}</span>
          <strong>${esc(entityLabel("",x))}</strong>
        </div>`).join("")||`<div class="empty">関連データなし</div>`}
    </div>
  `,()=>{});
}

/* =========================================================
   STATS
========================================================= */

function statsPage(){
  const studyDays=[];
  for(let i=6;i>=0;i--){
    const d=new Date();
    d.setDate(d.getDate()-i);
    const iso=d.toISOString().slice(0,10);
    studyDays.push({
      date:iso,
      value:db.studies.filter(x=>x.date===iso).reduce((a,b)=>a+Number(b.minutes||0),0)
    });
  }

  const max=Math.max(1,...studyDays.map(x=>x.value));
  const taskTotal=db.tasks.length;
  const taskDone=db.tasks.filter(x=>x.done).length;
  const timerMinutes=db.timerSessions.reduce((a,b)=>a+Number(b.minutes||0),0);
  const gameMinutes=db.games.reduce((a,b)=>a+Number(b.playMinutes||0),0);
  const novelPV=db.episodes.reduce((a,b)=>a+Number(b.pv||0),0);

  return `
    <div class="page-head">
      <div><h1>Analytics</h1><p>NEXUS全体の活動データ</p></div>
    </div>

    <div class="grid g4">
      <div class="card stat"><div class="stat-label">総XP</div><div class="stat-value">${db.xp}</div></div>
      <div class="card stat"><div class="stat-label">タイマー</div><div class="stat-value">${Math.round(timerMinutes)}<span style="font-size:13px">分</span></div></div>
      <div class="card stat"><div class="stat-label">ゲーム</div><div class="stat-value">${Math.round(gameMinutes)}<span style="font-size:13px">分</span></div></div>
      <div class="card stat"><div class="stat-label">小説PV</div><div class="stat-value">${novelPV.toLocaleString()}</div></div>
    </div>

    <div class="grid g2" style="margin-top:16px">
      <div class="card">
        <h3>直近7日の学習時間</h3>
        <div class="chart">
          ${studyDays.map(x=>`
            <div class="bar" style="height:${Math.max(3,x.value/max*180)}px">
              <em>${x.value}</em>
              <span>${x.date.slice(5)}</span>
            </div>`).join("")}
        </div>
      </div>

      <div class="card">
        <h3>タスク達成率</h3>
        <div style="font-size:55px;font-weight:900;margin:25px 0">
          ${taskTotal?Math.round(taskDone/taskTotal*100):0}%
        </div>
        <div class="progress"><i style="width:${taskTotal?taskDone/taskTotal*100:0}%"></i></div>
        <div class="small muted" style="margin-top:10px">${taskDone}/${taskTotal} 完了</div>
      </div>

      <div class="card">
        <h3>小説PVランキング</h3>
        <div class="list">
          ${db.novels.map(n=>{
            const pv=db.episodes.filter(e=>e.novelId===n.id).reduce((a,b)=>a+Number(b.pv||0),0);
            return `<div class="list-item"><div class="row between"><strong>${esc(n.title)}</strong><span>${pv.toLocaleString()} PV</span></div></div>`;
          }).sort((a,b)=>b.localeCompare(a)).join("")||`<div class="empty">データなし</div>`}
        </div>
      </div>

      <div class="card">
        <h3>習慣達成率</h3>
        <div style="font-size:55px;font-weight:900;margin:25px 0">${habitRate()}%</div>
        <div class="progress"><i style="width:${habitRate()}%"></i></div>
      </div>

/* =========================================================
   EXPORT / IMPORT
========================================================= */

function exportData(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`NEXUS-backup-${today()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("バックアップを出力しました");
}

function importData(){
  const input=document.createElement("input");
  input.type="file";
  input.accept=".json,application/json";
  input.onchange=()=>{
    const file=input.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const incoming=JSON.parse(reader.result);
        db=mergeDefaults(clone(DEFAULT),incoming);
        save();
        render();
        toast("バックアップを読み込みました");
      }catch(e){
        toast("読み込みに失敗しました");
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetData(){
  if(!confirm("NEXUSの全データを初期化します。バックアップはありますか？"))return;
  db=clone(DEFAULT);
  save();
  currentPage="dashboard";
  render();
}

function checkNotifications(){
  if(!db.settings.notifications)return;
  if(!("Notification" in window)||Notification.permission!=="granted")return;

  const todayTasks=db.tasks.filter(t=>!t.done&&t.due===today());
  if(todayTasks.length){
    const key="NEXUS_NOTIFIED_"+today();
    if(!localStorage.getItem(key)){
      notify("NEXUS","今日の未完了タスクが"+todayTasks.length+"件あります");
      localStorage.setItem(key,"1");
    }
  }
}

/* =========================================================
   PWA
========================================================= */

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

/* =========================================================
   RENDER
========================================================= */

function go(page){
  currentPage=page;
  render();
}

function render(){
  applySettings();
  renderShell();

  const pages={
    dashboard:dashboard,
    tasks:tasksPage,
    notes:notesPage,
    calendar:calendarPage,
    timer:timerPage,
    novels:novelsPage,
    games:gamesPage,
    study:studyPage,
    habits:habitsPage,
    tags:tagsPage,
    link:linkPage,
    stats:statsPage,
    activity:activityPage,
    trash:trashPage,
    database:databasePage,
    settings:settingsPage,
    search:searchPage
  };

  document.getElementById("content").innerHTML=(pages[currentPage]||dashboard)();

  if(currentPage==="dashboard")setupDashboardDrag();
}

function setupDashboardDrag(){
  const grid=document.getElementById("dashboardGrid");
  if(!grid)return;
  [...grid.querySelectorAll(".dashboard-card")].forEach(el=>{
    el.draggable=true;
    el.classList.add("drag");
    el.addEventListener("dragstart",()=>{
      draggedDashboard=el.dataset.id;
      el.classList.add("dragging");
    });
    el.addEventListener("dragend",()=>{
      el.classList.remove("dragging");
    });
    el.addEventListener("dragover",e=>e.preventDefault());
    el.addEventListener("drop",e=>{
      e.preventDefault();
      const target=el.dataset.id;
      if(!draggedDashboard||draggedDashboard===target)return;
      const a=db.dashboard.indexOf(draggedDashboard);
      const b=db.dashboard.indexOf(target);
      db.dashboard.splice(a,1);
      db.dashboard.splice(b,0,draggedDashboard);
      save();render();
    });
  });
}

/* =========================================================
   AUTO SAVE / HOTKEYS
========================================================= */

document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){
    e.preventDefault();
    document.getElementById("globalSearch")?.focus();
  }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="n"){
    e.preventDefault();
    quickAdd();
  }
});

setInterval(()=>{
  if(db.settings.autoSave)save();
  checkNotifications();
},30000);

setInterval(checkNotifications,60000);

window.addEventListener("beforeunload",()=>save());

/* =========================================================
   INITIALIZE
========================================================= */

render();
checkNotifications();

</script>
</body>
</html>
